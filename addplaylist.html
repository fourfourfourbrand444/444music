<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Listen Now</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --spotify-green: #1DB954;
    --spotify-black: #191414;
    --spotify-white: #FFFFFF;
    --spotify-light-gray: #B3B3B3;
    --audiomack-orange: #FFA200;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    font-family: 'Montserrat', sans-serif;
    background: var(--spotify-black);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* Stage background */
  .bg-stage {
    position: fixed;
    inset: 0;
    background-image: url('https://images.unsplash.com/photo-1516450360452-9312f5e86fc7?w=1920&q=80');
    background-size: cover;
    background-position: center 30%;
    z-index: 0;
  }

  .bg-stage::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(
      160deg,
      rgba(25, 20, 20, 0.82) 0%,
      rgba(29, 185, 84, 0.10) 40%,
      rgba(0,0,0,0.88) 100%
    );
    z-index: 1;
  }

  .bg-stage::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 60%, transparent 20%, rgba(0,0,0,0.75) 100%);
    z-index: 2;
  }

  /* Grain texture overlay */
  .grain {
    position: fixed;
    inset: 0;
    z-index: 1;
    opacity: 0.045;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-size: 200px 200px;
    pointer-events: none;
  }

  /* Page content */
  .container {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding: 48px 28px;
    max-width: 420px;
    width: 100%;
  }

  .brand-mark {
    margin-bottom: 6px;
    animation: fadeDown 0.7s ease both;
  }

  .brand-mark svg {
    width: 44px;
    height: 44px;
    filter: drop-shadow(0 0 18px rgba(29,185,84,0.45));
  }

  /* Header */
  .header-text {
    text-align: center;
    animation: fadeDown 0.7s 0.1s ease both;
    margin-bottom: 10px;
  }

  .header-text h1 {
    font-size: clamp(28px, 7vw, 40px);
    font-weight: 900;
    letter-spacing: -0.5px;
    color: var(--spotify-white);
    line-height: 1.1;
    text-transform: uppercase;
  }

  .header-text h1 span {
    color: var(--spotify-green);
  }

  .header-text p {
    margin-top: 10px;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--spotify-light-gray);
  }

  .divider {
    width: 48px;
    height: 2px;
    background: var(--spotify-green);
    border-radius: 2px;
    margin-bottom: 4px;
    animation: fadeIn 0.7s 0.2s ease both;
  }

  /* Buttons */
  .btn {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 16px 24px;
    border-radius: 56px;
    border: none;
    cursor: pointer;
    text-decoration: none;
    font-family: 'Montserrat', sans-serif;
    font-size: 14.5px;
    font-weight: 700;
    letter-spacing: 0.4px;
    transition: transform 0.18s cubic-bezier(.34,1.56,.64,1), box-shadow 0.18s ease, filter 0.18s ease;
    position: relative;
    overflow: hidden;
  }

  .btn::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    opacity: 0;
    background: rgba(255,255,255,0.08);
    transition: opacity 0.18s;
  }

  .btn:hover::after { opacity: 1; }

  .btn:hover {
    transform: scale(1.035) translateY(-2px);
  }

  .btn:active {
    transform: scale(0.97);
  }

  .btn-icon {
    width: 36px;
    height: 36px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
  }

  .btn-label {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 1px;
  }

  .btn-label span.service {
    font-size: 11px;
    font-weight: 600;
    opacity: 0.72;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  .btn-label span.action {
    font-size: 14.5px;
    font-weight: 800;
    letter-spacing: 0.2px;
  }

  .btn-arrow {
    margin-left: auto;
    opacity: 0.7;
    font-size: 18px;
    transition: transform 0.18s;
  }

  .btn:hover .btn-arrow {
    transform: translateX(4px);
    opacity: 1;
  }

  /* Spotify button */
  .btn-spotify {
    background: var(--spotify-green);
    color: #000;
    box-shadow: 0 6px 36px rgba(29,185,84,0.38), 0 2px 8px rgba(0,0,0,0.4);
    animation: fadeUp 0.6s 0.3s ease both;
  }

  .btn-spotify:hover {
    box-shadow: 0 10px 48px rgba(29,185,84,0.55), 0 2px 12px rgba(0,0,0,0.5);
  }

  .btn-spotify .btn-icon {
    background: rgba(0,0,0,0.18);
  }

  /* Audiomack button */
  .btn-audiomack {
    background: var(--audiomack-orange);
    color: #000;
    box-shadow: 0 6px 36px rgba(255,162,0,0.35), 0 2px 8px rgba(0,0,0,0.4);
    animation: fadeUp 0.6s 0.42s ease both;
  }

  .btn-audiomack:hover {
    box-shadow: 0 10px 48px rgba(255,162,0,0.5), 0 2px 12px rgba(0,0,0,0.5);
  }

  /* Dark disc so the official orange logo stays visible on the orange button */
  .btn-audiomack .btn-icon {
    background: #000;
  }

  .btn-audiomack .btn-icon svg {
    display: block;
  }

  /* Footer */
  .footer {
    margin-top: 10px;
    font-size: 11px;
    color: rgba(255,255,255,0.28);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    text-align: center;
    animation: fadeIn 0.7s 0.9s ease both;
  }

  /* Animations */
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-18px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @keyframes glow-pulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 0.8; }
  }

  .spotlight {
    position: fixed;
    z-index: 2;
    top: -10%;
    left: 50%;
    transform: translateX(-50%);
    width: 340px;
    height: 520px;
    background: radial-gradient(ellipse at 50% 0%, rgba(29,185,84,0.13) 0%, transparent 70%);
    pointer-events: none;
    animation: glow-pulse 4s ease-in-out infinite;
  }
</style>
</head>
