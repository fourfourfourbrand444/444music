<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Song takedown — 444Music</title>
<style>
:root {
  --bg: #000000;
  --s1: #1c1c1e;
  --sep: rgba(84,84,88,0.55);
  --fill: rgba(120,120,128,0.24);
  --t2: rgba(235,235,245,0.60);
  --t3: rgba(235,235,245,0.32);
  --red: #ff453a;
  --green: #30d158;
  --ease: cubic-bezier(0.32, 0.72, 0, 1);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Helvetica Neue", Roboto, Arial, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); }
body {
  font-family: var(--font); color: #fff; letter-spacing: -0.01em;
  -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
  overflow: hidden; -webkit-tap-highlight-color: transparent;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; touch-action: manipulation; }

.app { height: 100vh; height: 100dvh; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; }
.bar { display: flex; align-items: center; justify-content: space-between; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 12px; }
.icon-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--fill); display: flex; align-items: center; justify-content: center; transition: transform .3s var(--ease), opacity .2s ease; }
.icon-btn:active { transform: scale(0.92); }
.icon-btn:disabled { opacity: 0.3; }
.icon-btn svg { width: 18px; height: 18px; }
.count { font-size: 13px; color: var(--t2); font-variant-numeric: tabular-nums; }
.bar-gap { width: 36px; }
.progress { height: 3px; margin: 0 16px; background: var(--fill); border-radius: 2px; overflow: hidden; }
.progress i { display: block; height: 100%; width: 100%; background: #fff; transform-origin: left; transform: scaleX(0); transition: transform .5s var(--ease); }
.app.finished .bar, .app.finished .progress { display: none; }

.stage { position: relative; flex: 1; overflow: hidden; }
.step { position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 7vh 24px calc(36px + env(safe-area-inset-bottom, 0px)); }
.step-in { max-width: 440px; margin: 0 auto; }
.step.in-first { animation: rise .7s var(--ease) both; }
.step.in-fwd  { animation: inFwd .45s var(--ease) both; }
.step.in-back { animation: inBack .45s var(--ease) both; }
.step.out-fwd  { animation: outFwd .26s ease both; pointer-events: none; }
.step.out-back { animation: outBack .26s ease both; pointer-events: none; }
@keyframes rise   { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
@keyframes inFwd  { from { opacity: 0; transform: translateX(44px); }  to { opacity: 1; transform: none; } }
@keyframes inBack { from { opacity: 0; transform: translateX(-44px); } to { opacity: 1; transform: none; } }
@keyframes outFwd  { to { opacity: 0; transform: translateX(-44px); } }
@keyframes outBack { to { opacity: 0; transform: translateX(44px); } }

.q { font-size: clamp(26px, 7vw, 32px); font-weight: 700; letter-spacing: -0.035em; line-height: 1.15; }
.hint { font-size: 16px; color: var(--t2); margin-top: 8px; line-height: 1.45; }
.field { margin-top: 28px; }
.input {
  display: block; width: 100%; height: 56px; padding: 0 16px; border: 0; border-radius: 14px;
  background: var(--s1); font-size: 17px; outline: none;
  box-shadow: inset 0 0 0 1.5px transparent; transition: box-shadow .2s ease;
}
.input:focus { box-shadow: inset 0 0 0 1.5px rgba(255,255,255,0.5); }
.input::placeholder { color: var(--t3); }
.input[aria-invalid="true"] { box-shadow: inset 0 0 0 1.5px var(--red); }
textarea.input { height: auto; min-height: 132px; padding: 14px 16px; resize: none; line-height: 1.45; }
.err { color: var(--red); font-size: 14px; margin: 10px 4px 0; line-height: 1.4; }
.err:empty { display: none; }

.btn {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%; height: 54px; margin-top: 24px; border-radius: 999px;
  background: #fff; color: #000; font-size: 17px; font-weight: 600;
  transition: transform .3s var(--ease), opacity .2s ease;
}
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.35; cursor: default; transform: none; }
.btn.danger { background: var(--red); color: #fff; }
.btn.busy { opacity: 1; pointer-events: none; }
.spin { width: 18px; height: 18px; border: 2.5px solid rgba(255,255,255,0.35); border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.list { background: var(--s1); border-radius: 14px; overflow: hidden; margin-top: 28px; }
.opt { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 54px; padding: 10px 16px; font-size: 17px; text-align: left; transition: background-color .15s ease; }
.opt + .opt { border-top: 0.5px solid var(--sep); }
.opt:active { background: rgba(255,255,255,0.08); }
.opt small { display: block; font-size: 13px; color: var(--t2); margin-top: 1px; }
.opt svg { width: 20px; height: 20px; flex-shrink: 0; opacity: 0; transform: scale(0.6); transition: opacity .2s ease, transform .3s var(--ease); }
.opt[aria-checked="true"] svg { opacity: 1; transform: none; }

.rrow { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; width: 100%; padding: 13px 16px; text-align: left; transition: background-color .15s ease; }
.rrow + .rrow { border-top: 0.5px solid var(--sep); }
.rrow:active { background: rgba(255,255,255,0.08); }
.rk { font-size: 15px; color: var(--t2); flex-shrink: 0; }
.rv { font-size: 15px; text-align: right; min-width: 0; word-break: break-word; }
.warn { margin-top: 16px; padding: 13px 15px; border-radius: 14px; background: rgba(255,69,58,0.12); font-size: 14px; line-height: 1.5; color: rgba(255,255,255,0.9); }
.warn strong { color: var(--red); font-weight: 600; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 12px; padding: 13px 16px; background: var(--s1); border-radius: 14px; font-size: 15px; line-height: 1.4; cursor: pointer; }
.toggle input { position: absolute; opacity: 0; pointer-events: none; }
.sw { position: relative; width: 51px; height: 31px; flex-shrink: 0; border-radius: 999px; background: #3a3a3c; transition: background-color .25s ease; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.3); transition: transform .3s var(--ease); }
.toggle input:checked + .sw { background: var(--green); }
.toggle input:checked + .sw::after { transform: translateX(20px); }
.toggle input:focus-visible + .sw { outline: 2px solid #fff; outline-offset: 3px; }

.done { text-align: center; padding-top: 10vh; }
.tick { width: 84px; height: 84px; margin: 0 auto 26px; border-radius: 50%; background: rgba(48,209,88,0.16); display: flex; align-items: center; justify-content: center; animation: pop .6s var(--ease) both; }
.tick svg { width: 40px; height: 40px; }
.tick path { stroke-dasharray: 30; stroke-dashoffset: 30; animation: draw .5s ease .35s forwards; }
@keyframes pop  { from { opacity: 0; transform: scale(0.6); } to { opacity: 1; transform: none; } }
@keyframes draw { to { stroke-dashoffset: 0; } }
.done .hint { max-width: 320px; margin-left: auto; margin-right: auto; }

@media (hover: hover) and (pointer: fine) {
  .opt:hover, .rrow:hover { background: rgba(255,255,255,0.05); }
  .icon-btn:hover { background: rgba(120,120,128,0.36); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-delay: 0s !important; transition-duration: 0.01ms !important; }
}
</style>
</head>
<body>

<div class="app" id="app">
  <div class="bar">
    <button class="icon-btn" id="backBtn" type="button" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <span class="count" id="count" aria-live="polite"></span>
    <span class="bar-gap"></span>
  </div>
  <div class="progress" aria-hidden="true"><i id="bar"></i></div>
  <main class="stage" id="stage"></main>
</div>

<script>
/* Where requests are emailed. FormSubmit's AJAX address; once the inbox is
   confirmed you can swap the email for the private alias FormSubmit gives
   you, so the address is not visible in this file. */
var FORM_ENDPOINT = "https://formsubmit.co/ajax/fourfourfourbrand444@gmail.com";
var HOME_URL = "home.html";

var REASONS = [
  "Copyright issue or dispute",
  "Wrong version uploaded",
  "Switching distributor",
  "Agreement expired",
  "Label or management request",
  "Artist decision",
  "Other"
];

var A = { artist: "", title: "", upc: "", reason: "", scope: "", stores: "", email: "", details: "", confirm: false };

var CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';

var DEFS = {
  artist:  { q: "What’s your artist name?", hint: "The name shown on the release.", kind: "text", key: "artist", ph: "Artist name", ac: "name",
             check: function (v) { return v ? "" : "Enter your artist name."; } },
  title:   { q: "Which release should come down?", hint: "The song or album title, as it appears in stores.", kind: "text", key: "title", ph: "Release title", ac: "off",
             check: function (v) { return v ? "" : "Enter the release title."; } },
  upc:     { q: "What’s the UPC code?", hint: "Find it in My Releases, under Identifiers.", kind: "text", key: "upc", ph: "UPC code", ac: "off", mode: "numeric",
             clean: function (v) { return v.replace(/[\s-]/g, ""); },
             check: function (v) { return /^\d{12,14}$/.test(v) ? "" : "Enter the UPC code, 12 to 14 digits."; } },
  reason:  { q: "Why are you removing it?", kind: "choice", key: "reason",
             options: REASONS.map(function (r) { return { v: r, t: r }; }) },
  scope:   { q: "Where should it be removed?", kind: "choice", key: "scope",
             options: [ { v: "All stores", t: "All stores", s: "Recommended" }, { v: "Specific stores", t: "Specific stores", s: "You’ll name them next" } ] },
  stores:  { q: "Which stores?", hint: "Type the store names, separated by commas.", kind: "text", key: "stores", ph: "Spotify, Boomplay", ac: "off",
             check: function (v) { return v.length >= 2 ? "" : "Enter at least one store name."; } },
  email:   { q: "What’s your email?", hint: "We’ll contact you here about this request.", kind: "text", key: "email", ph: "name@example.com", ac: "email", type: "email", mode: "email",
             check: function (v) { return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v) ? "" : "Enter a valid email address."; } },
  details: { q: "Anything else we should know?", hint: "Optional.", kind: "area", key: "details", ph: "Add a note" },
  review:  { kind: "review" }
};

var idx = 0, editing = false, sending = false, sent = false, renderedAt = 0;
var stage = document.getElementById("stage");
var backBtn = document.getElementById("backBtn");

function stepList() {
  var s = ["artist", "title", "upc", "reason", "scope"];
  if (A.scope === "Specific stores") s.push("stores");
  s.push("email", "details", "review");
  return s;
}
function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function ready() { return Date.now() - renderedAt > 350; }   /* ignores accidental double taps right after a slide */

function render(dir) {
  var list = stepList(), name = list[idx], def = DEFS[name];
  Array.prototype.forEach.call(stage.querySelectorAll(".step[data-old]"), function (n) { n.remove(); });
  var old = stage.querySelector(".step");
  var el = document.createElement("section");
  el.className = "step in-" + (dir || "first");
  el.setAttribute("aria-live", "polite");
  el.innerHTML = '<div class="step-in">' + body(name, def) + "</div>";
  if (old) {
    old.setAttribute("data-old", "1");
    old.className = "step out-" + (dir === "back" ? "back" : "fwd");
    setTimeout(function () { if (old.parentNode) old.remove(); }, 300);
  }
  stage.appendChild(el);
  renderedAt = Date.now();
  document.getElementById("count").textContent = (idx + 1) + " of " + list.length;
  document.getElementById("bar").style.transform = "scaleX(" + ((idx + 1) / list.length) + ")";
  backBtn.disabled = sending;
  wire(el, name, def);
  if (dir) { setTimeout(function () { var f = el.querySelector("input[type=text],input[type=email],textarea"); if (f) f.focus({ preventScroll: true }); }, 380); }
}

function body(name, def) {
  if (def.kind === "text" || def.kind === "area") {
    var v = esc(A[def.key]);
    var field = def.kind === "area"
      ? '<textarea class="input" id="f" placeholder="' + esc(def.ph) + '" rows="4">' + v + "</textarea>"
      : '<input class="input" id="f" type="' + (def.type || "text") + '" value="' + v + '" placeholder="' + esc(def.ph) + '" autocomplete="' + (def.ac || "off") + '"' +
        (def.mode ? ' inputmode="' + def.mode + '"' : "") + ' autocapitalize="' + (def.type === "email" || def.mode ? "off" : "words") + '" spellcheck="false" enterkeyhint="next">';
    return '<form id="stepForm" novalidate><h1 class="q">' + def.q + "</h1>" + (def.hint ? '<p class="hint">' + def.hint + "</p>" : "") +
      '<div class="field">' + field + '<div class="err" id="err" role="alert"></div></div>' +
      '<button class="btn" id="go" type="submit">' + (def.kind === "area" && !A.details ? "Skip" : "Continue") + "</button></form>";
  }
  if (def.kind === "choice") {
    var opts = def.options.map(function (o) {
      return '<button class="opt" type="button" role="radio" aria-checked="' + (A[def.key] === o.v) + '" data-v="' + esc(o.v) + '"><span>' + esc(o.t) +
        (o.s ? "<small>" + esc(o.s) + "</small>" : "") + "</span>" + CHECK + "</button>";
    }).join("");
    return '<h1 class="q">' + def.q + '</h1><div class="list" role="radiogroup" aria-label="' + esc(def.q) + '">' + opts + "</div>";
  }
  var rows = [
    ["Artist", "artist", A.artist], ["Release", "title", A.title], ["UPC", "upc", A.upc], ["Reason", "reason", A.reason],
    ["Remove from", "scope", A.scope]
  ];
  if (A.scope === "Specific stores") rows.push(["Stores", "stores", A.stores]);
  rows.push(["Email", "email", A.email]);
  if (A.details) rows.push(["Note", "details", A.details]);
  var rr = rows.map(function (r) { return '<button class="rrow" type="button" data-edit="' + r[1] + '"><span class="rk">' + r[0] + '</span><span class="rv">' + esc(r[2]) + "</span></button>"; }).join("");
  return '<h1 class="q">Review your request</h1><div class="list">' + rr + "</div>" +
    '<div class="warn"><strong>This can’t be undone.</strong> A removed release can’t be reinstated with the same ISRC or release date.</div>' +
    '<label class="toggle"><span>I’m the owner or authorized representative of this release.</span><input type="checkbox" id="ok"' + (A.confirm ? " checked" : "") + '><span class="sw"></span></label>' +
    '<div class="err" id="sendErr" role="alert"></div>' +
    '<button class="btn danger" id="send" type="button"' + (A.confirm ? "" : " disabled") + ">Request takedown</button>";
}

function wire(el, name, def) {
  if (def.kind === "text" || def.kind === "area") {
    var f = el.querySelector("#f"), err = el.querySelector("#err"), go = el.querySelector("#go");
    if (def.kind === "area") {
      f.addEventListener("input", function () { go.textContent = f.value.trim() ? "Continue" : "Skip"; });
    } else {
      f.addEventListener("input", function () { f.removeAttribute("aria-invalid"); err.textContent = ""; });
    }
    el.querySelector("#stepForm").addEventListener("submit", function (e) {
      e.preventDefault();
      if (!ready()) return;
      var v = f.value.trim();
      if (def.clean) v = def.clean(v);
      var msg = def.check ? def.check(v) : "";
      if (msg) { f.setAttribute("aria-invalid", "true"); err.textContent = msg; f.focus(); return; }
      A[def.key] = v;
      advance();
    });
  } else if (def.kind === "choice") {
    Array.prototype.forEach.call(el.querySelectorAll(".opt"), function (b) {
      b.addEventListener("click", function () {
        if (!ready()) return;
        A[def.key] = b.getAttribute("data-v");
        if (def.key === "scope" && A.scope !== "Specific stores") A.stores = "";
        Array.prototype.forEach.call(el.querySelectorAll(".opt"), function (o) { o.setAttribute("aria-checked", o === b ? "true" : "false"); });
        setTimeout(advance, 240);
      });
    });
  } else {
    var ok = el.querySelector("#ok"), send = el.querySelector("#send");
    ok.addEventListener("change", function () { A.confirm = ok.checked; send.disabled = !ok.checked; });
    send.addEventListener("click", submit);
    Array.prototype.forEach.call(el.querySelectorAll(".rrow"), function (r) {
      r.addEventListener("click", function () {
        if (sending || !ready()) return;
        editing = true;
        idx = stepList().indexOf(r.getAttribute("data-edit"));
        render("back");
      });
    });
  }
}

function advance() {
  var list = stepList();
  if (editing) {
    if (A.scope === "Specific stores" && !A.stores) { idx = list.indexOf("stores"); render("fwd"); return; }
    editing = false;
    idx = list.length - 1;
    render("fwd");
    return;
  }
  idx = Math.min(idx + 1, list.length - 1);
  render("fwd");
}

backBtn.addEventListener("click", function () {
  if (sending || sent) return;
  if (idx === 0) { if (history.length > 1) history.back(); else location.href = HOME_URL; return; }
  editing = false;
  idx -= 1;
  render("back");
});

function submit() {
  if (sending || sent || !A.confirm) return;     /* one request only, however many times it's tapped */
  sending = true;
  var btn = document.getElementById("send"), err = document.getElementById("sendErr");
  err.textContent = "";
  btn.classList.add("busy");
  btn.innerHTML = '<span class="spin"></span>Sending…';
  backBtn.disabled = true;

  var payload = {
    _subject: "New Song Takedown Request — 444Music",
    _template: "table",
    _captcha: "false",
    "Artist name": A.artist,
    "Release title": A.title,
    "UPC code": A.upc,
    "Reason": A.reason,
    "Remove from": A.scope === "Specific stores" ? "Specific stores: " + A.stores : "All stores",
    email: A.email,
    "Details": A.details || "None",
    "Submitted": new Date().toISOString()
  };

  var ctrl = new AbortController();
  var timer = setTimeout(function () { ctrl.abort(); }, 20000);

  fetch(FORM_ENDPOINT, {
    method: "POST",
    headers: { "Content-Type": "application/json", "Accept": "application/json" },
    body: JSON.stringify(payload),
    signal: ctrl.signal
  }).then(function (res) {
    return res.json().catch(function () { return {}; }).then(function (data) {
      if (!res.ok || data.success === false || data.success === "false") {
        console.error("Takedown send failed:", res.status, data);
        throw new Error("rejected");
      }
    });
  }).then(function () {
    sent = true;
    showDone();
  }).catch(function (e) {
    sending = false;
    backBtn.disabled = false;
    btn.classList.remove("busy");
    btn.textContent = "Try again";
    err.textContent = !navigator.onLine ? "You’re offline. Check your connection and try again."
      : (e && e.name === "AbortError") ? "That took too long. Check your connection and try again."
      : "We couldn’t send your request. Please try again in a moment.";
  }).then(function () { clearTimeout(timer); });
}

function showDone() {
  document.getElementById("app").classList.add("finished");
  var old = stage.querySelector(".step");
  var el = document.createElement("section");
  el.className = "step in-first";
  el.innerHTML = '<div class="step-in done"><div class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="#30d158" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>' +
    '<h1 class="q">Request sent</h1><p class="hint" id="doneMsg"></p>' +
    '<a class="btn" href="' + HOME_URL + '" style="text-decoration:none">Done</a></div>';
  if (old) old.remove();
  stage.appendChild(el);
  document.getElementById("doneMsg").textContent = "Our team will review it within 24–72 hours and contact you at " + A.email + ".";
}

render();
</script>
</body>
</html>
