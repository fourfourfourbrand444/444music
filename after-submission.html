<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Saving Release — 444Music</title>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --bg: #000000;
  --s1: #1c1c1e;
  --sep: rgba(84,84,88,0.55);
  --fill: rgba(120,120,128,0.24);
  --t1: #ffffff;
  --t2: rgba(235,235,245,0.60);
  --t3: rgba(235,235,245,0.30);
  --yellow: #fdeb0d;
  --green: #30d158;
  --ease: cubic-bezier(0.32, 0.72, 0, 1);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Helvetica Neue", Roboto, Arial, sans-serif;
}

html { color-scheme: dark; -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font); background: var(--bg); color: var(--t1);
  min-height: 100vh; min-height: 100svh; display: flex; align-items: center; justify-content: center;
  padding: 32px 16px calc(32px + env(safe-area-inset-bottom));
  letter-spacing: -0.01em; -webkit-font-smoothing: antialiased;
}

.wrap { width: 100%; max-width: 420px; text-align: center; }

/* ring */
.ring { position: relative; width: 88px; height: 88px; margin: 0 auto 28px; }
.ring svg { width: 88px; height: 88px; transform: rotate(-90deg); display: block; }
.ring-bg { fill: none; stroke: var(--fill); stroke-width: 4; }
.ring-fill {
  fill: none; stroke: var(--yellow); stroke-width: 4; stroke-linecap: round;
  stroke-dasharray: 220; stroke-dashoffset: 220; animation: fillRing 3.5s var(--ease) forwards;
}
@keyframes fillRing { from { stroke-dashoffset: 220; } to { stroke-dashoffset: 0; } }
.ring-icon { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--t1); }
.ring-icon svg { width: 28px; height: 28px; transform: none; }

h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.15; }
.sub { margin-top: 6px; font-size: 17px; line-height: 1.4; color: var(--t2); }

/* steps */
.group { margin-top: 32px; background: var(--s1); border-radius: 16px; overflow: hidden; text-align: left; }
.step { position: relative; display: flex; align-items: center; gap: 14px; min-height: 54px; padding: 0 16px; }
.step + .step::before { content: ''; position: absolute; top: 0; left: 54px; right: 0; height: 0.5px; background: var(--sep); }
.step-dot {
  width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0;
  border: 1.5px solid var(--t3); display: flex; align-items: center; justify-content: center;
  transition: background-color .3s ease, border-color .3s ease;
}
.step-dot svg { width: 13px; height: 13px; color: #000; }
.step-label { font-size: 17px; color: var(--t3); transition: color .3s ease; }

.step.active .step-dot { border-color: var(--fill); border-top-color: var(--yellow); animation: spin .8s linear infinite; }
.step.active .step-label { color: var(--t1); }
.step.done .step-dot { background: var(--green); border-color: var(--green); animation: none; }
.step.done .step-label { color: var(--t1); }

@keyframes spin { to { transform: rotate(360deg); } }

@media (prefers-reduced-motion: reduce) { .step.active .step-dot { animation: none; } .ring-fill { animation-duration: .001ms; } }
</style>
</head>
<body>

<div class="wrap">

  <div class="ring">
    <svg viewBox="0 0 80 80">
      <circle class="ring-bg"   cx="40" cy="40" r="35"/>
      <circle class="ring-fill" cx="40" cy="40" r="35"/>
    </svg>
    <div class="ring-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/>
        <path d="M12 12v9"/>
        <path d="m16 16-4-4-4 4"/>
      </svg>
    </div>
  </div>

  <h1>Saving your release</h1>
  <p class="sub">This only takes a moment.</p>

  <div class="group">
    <div class="step active" id="s1"><div class="step-dot" id="s1-dot"></div><span class="step-label">Uploading release files</span></div>
    <div class="step" id="s2"><div class="step-dot" id="s2-dot"></div><span class="step-label">Checking metadata</span></div>
    <div class="step" id="s3"><div class="step-dot" id="s3-dot"></div><span class="step-label">Preparing distribution</span></div>
    <div class="step" id="s4"><div class="step-dot" id="s4-dot"></div><span class="step-label">Finalizing submission</span></div>
  </div>

</div>

<script type="module">

import { initializeApp }        from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
import { getFirestore, addDoc, collection } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey:            "AIzaSyBzUD7avh7vJfeSMRl2o9F09_qd-pl0dSg",
  authDomain:        "usersubmissionsportal.firebaseapp.com",
  projectId:         "usersubmissionsportal",
  storageBucket:     "usersubmissionsportal.firebasestorage.app",
  messagingSenderId: "734783502459",
  appId:             "1:734783502459:web:cfa2cc5de6976003b24ade"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

const allSteps = ['s1','s2','s3','s4'];
const checkIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';

function setStep(id) {
  allSteps.forEach(sid => {
    const el = document.getElementById(sid);
    const idx = allSteps.indexOf(sid);
    const active = allSteps.indexOf(id);
    if (idx < active) {
      el.classList.remove('active');
      el.classList.add('done');
      document.getElementById(sid + '-dot').innerHTML = checkIcon;
    } else if (sid === id) {
      el.classList.add('active');
      el.classList.remove('done');
    }
  });
}

const submission = {
  title: "Test Release"
};

onAuthStateChanged(auth, async (user) => {

  if (!user) {
    window.location.href = "login.html";
    return;
  }

  try {

    setStep("s1");
    await new Promise(r => setTimeout(r, 1000));

    setStep("s2");
    await new Promise(r => setTimeout(r, 1000));

    setStep("s3");
    await new Promise(r => setTimeout(r, 1000));

    await addDoc(collection(db, "sharp"), {
      ...submission,
      userId:    user.uid,
      status:    "Pending",
      createdAt: Date.now()
    });

    setStep("s4");

    setTimeout(() => {
      window.location.href = "a.html";
    }, 1200);

  } catch (err) {
    console.error(err);
    alert("Submission failed. Please try again.");
  }

});

</script>
</body>
</html>
