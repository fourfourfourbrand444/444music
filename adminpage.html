<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analytics • 444Music Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:     #000000;
  --card:   #0a0a0a;
  --field:  #111111;
  --line:   rgba(255,255,255,0.09);
  --line-2: rgba(255,255,255,0.18);
  --text:   #f5f5f5;
  --muted:  #969696;
  --faint:  #5c5c5c;
  --green:  #7fcf8e;
  --head:   'Outfit', sans-serif;
  --body:   'Plus Jakarta Sans', system-ui, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--body); background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; }
button:disabled { cursor: not-allowed; }

/* ── sign in ── */
#gate { max-width: 340px; margin: 18vh auto 0; padding: 0 20px; }
.gate-box { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 26px; display: flex; flex-direction: column; gap: 10px; }
.gate-box h2 { font-family: var(--head); font-size: 20px; font-weight: 700; }
.gate-box p { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
#gerr { font-size: 12.5px; min-height: 16px; color: var(--muted); }

/* ── shell ── */
#app { display: none; }
.top { display: flex; align-items: center; justify-content: space-between; padding: 0 28px; height: 60px; border-bottom: 1px solid var(--line); }
.brand { font-family: var(--head); font-weight: 800; font-size: 19px; letter-spacing: -0.4px; display: flex; align-items: center; gap: 10px; }
.brand span { font-family: var(--body); font-size: 11px; font-weight: 600; letter-spacing: 0; color: var(--muted); border: 1px solid var(--line-2); border-radius: 999px; padding: 2px 10px; }
.wrap { max-width: 1040px; margin: 0 auto; padding: 34px 24px 80px; }
.title h1 { font-family: var(--head); font-size: 28px; font-weight: 700; letter-spacing: -0.6px; }
.title p { color: var(--muted); margin-top: 4px; font-size: 13.5px; }

/* ── controls ── */
.search { display: flex; gap: 10px; margin: 24px 0 16px; }
.search input { flex: 1; min-width: 0; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; outline: none; }
.search input::placeholder { color: var(--faint); }
.search input:focus { border-color: var(--line-2); }

.btn { background: #fff; color: #000; border-radius: 10px; padding: 10px 20px; font-weight: 600; font-size: 13px; white-space: nowrap; transition: opacity .15s; }
.btn:hover:not(:disabled) { opacity: .86; }
.btn:disabled { opacity: .28; }
.btn.ok { background: transparent; color: var(--green); opacity: 1; }
.ghost { border: 1px solid var(--line-2); border-radius: 10px; padding: 9px 16px; font-weight: 600; font-size: 13px; color: var(--text); background: transparent; transition: background .15s; }
.ghost:hover:not(:disabled) { background: var(--field); }
.ghost:disabled { opacity: .4; }

/* ── table ── */
.table { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.row, .thead { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1.6fr) 130px 130px 92px; gap: 18px; align-items: center; padding: 14px 20px; }
.thead { font-size: 12px; font-weight: 600; color: var(--muted); border-bottom: 1px solid var(--line); padding-top: 12px; padding-bottom: 12px; }
.row + .row { border-top: 1px solid var(--line); }
.who b { display: block; font-weight: 600; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.songs { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell { display: block; }
.cell span { display: none; font-size: 11.5px; color: var(--muted); margin-bottom: 4px; }
.cell input { width: 100%; background: var(--field); border: 1px solid transparent; border-radius: 9px; padding: 9px 11px; outline: none; font-variant-numeric: tabular-nums; }
.cell input:focus { border-color: var(--line-2); }
.cell input::-webkit-outer-spin-button, .cell input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.cell input[type=number] { -moz-appearance: textfield; }
.act { text-align: right; }

.foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 14px; color: var(--muted); font-size: 12.5px; min-height: 36px; }
.note { text-align: center; padding: 60px 20px; color: var(--muted); }
.note b { display: block; color: var(--text); font-family: var(--head); font-size: 16px; font-weight: 600; margin-bottom: 4px; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 140%); background: #fff; color: #000; padding: 10px 18px; border-radius: 999px; font-weight: 600; font-size: 13px; transition: transform .25s ease; z-index: 50; max-width: calc(100% - 32px); text-align: center; }
.toast.show { transform: translate(-50%, 0); }

@media (max-width: 760px) {
  .top { padding: 0 16px; }
  .wrap { padding: 24px 14px 64px; }
  .thead { display: none; }
  .row { grid-template-columns: 1fr 1fr; gap: 12px 12px; padding: 16px; }
  .who, .songs, .act { grid-column: 1 / -1; }
  .act { text-align: left; }
  .cell span { display: block; }
  .search { flex-wrap: wrap; }
  .search input { flex-basis: 100%; }
}
</style>
</head>
<body>

<div id="gate">
  <div class="gate-box">
    <h2>Admin sign in</h2>
    <p>Use your admin account.</p>
    <input id="ge" type="email" placeholder="Email" autocomplete="username" style="background:var(--field);border:1px solid transparent;border-radius:10px;padding:11px 13px;outline:none;">
    <input id="gp" type="password" placeholder="Password" autocomplete="current-password" style="background:var(--field);border:1px solid transparent;border-radius:10px;padding:11px 13px;outline:none;">
    <button class="btn" id="gb">Sign in</button>
    <div id="gerr"></div>
  </div>
</div>

<div id="app">
  <header class="top">
    <div class="brand">444Music <span>Admin</span></div>
    <button class="ghost" id="out">Sign out</button>
  </header>

  <main class="wrap">
    <div class="title">
      <h1>Analytics</h1>
      <p>YouTube and total streams for artists with approved songs.</p>
    </div>

    <form class="search" id="sf" autocomplete="off">
      <input id="q" type="text" placeholder="Search song, artist, email or user ID" spellcheck="false">
      <button class="btn" type="submit">Search</button>
      <button class="ghost" type="button" id="clear" style="display:none">Clear</button>
    </form>

    <div class="table">
      <div class="thead">
        <div>Artist</div><div>Approved songs</div><div>YouTube</div><div>Total</div><div></div>
      </div>
      <div id="list"></div>
    </div>

    <div class="foot">
      <span id="count"></span>
      <button class="ghost" id="more" style="display:none">Load more</button>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut }
  from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
import { getFirestore, collection, doc, getDocs, setDoc, query, where, limit, startAfter, documentId, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

const app  = initializeApp({
  apiKey: "AIzaSyBzUD7avh7vJfeSMRl2o9F09_qd-pl0dSg",
  authDomain: "usersubmissionsportal.firebaseapp.com",
  projectId: "usersubmissionsportal",
  storageBucket: "usersubmissionsportal.firebasestorage.app",
  messagingSenderId: "734783502459",
  appId: "1:734783502459:web:cfa2cc5de6976003b24ade"
});
const auth = getAuth(app);
const db   = getFirestore(app);

const ADMINS   = ['444musicdistro@gmail.com'];   // accounts allowed on this page
const APPROVED = ['Approved', 'approved'];
const PAGE = 10;           // approved songs per page
const SEARCH_LIMIT = 15;   // max documents per search query

const $  = id => document.getElementById(id);
const lc = s => String(s || '').toLowerCase().trim();
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const isApproved = d => lc(d.status) === 'approved';
const titleCase = s => s.replace(/\b\w/g, c => c.toUpperCase());

function toast(msg) {
  const t = $('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 3000);
}

/* ── state (all in memory, nothing is re-read unless needed) ── */
const stats = new Map();          // uid -> { youtube, total, exists }
const searchCache = new Map();    // search text -> Map(uid -> row)
let browse = { rows: new Map(), cursor: null, more: false, loaded: false };
let searchRows = new Map();
let view = 'browse';              // 'browse' | 'search'
let busy = false;

/* One row per artist. Several approved songs by the same artist share one analytics record. */
function addSong(map, d) {
  const s = d.data();
  if (!isApproved(s) || !s.userId) return;
  let r = map.get(s.userId);
  if (!r) { r = { uid: s.userId, name: s.artistName || '', email: s.email || '', songs: [], ids: new Set() }; map.set(s.userId, r); }
  if (r.ids.has(d.id)) return;
  r.ids.add(d.id);
  r.songs.push(s.releaseTitle || 'Untitled');
}

/* Analytics docs for the artists on screen; only ones we have not read yet. */
async function fetchStats(uids) {
  const need = uids.filter(u => !stats.has(u));
  for (let i = 0; i < need.length; i += 30) {
    const chunk = need.slice(i, i + 30);
    const snap = await getDocs(query(collection(db, 'analytics'), where(documentId(), 'in', chunk)));
    snap.forEach(d => {
      const a = d.data();
      stats.set(d.id, { youtube: Number(a.youtubeStreams ?? a.youtube ?? 0) || 0, total: Number(a.totalStreams ?? a.total ?? 0) || 0, exists: true });
    });
    chunk.forEach(u => { if (!stats.has(u)) stats.set(u, { youtube: 0, total: 0, exists: false }); });
  }
}

/* ── browse: approved songs, 10 at a time ── */
async function loadMore() {
  if (busy) return;
  busy = true; $('more').disabled = true;
  if (!browse.loaded) $('list').innerHTML = '<div class="note">Loading…</div>';
  try {
    const q = query(collection(db, 'submissions'), where('status', 'in', APPROVED),
      ...(browse.cursor ? [startAfter(browse.cursor)] : []), limit(PAGE));
    const docs = (await getDocs(q)).docs;
    const before = new Set(browse.rows.keys());
    docs.forEach(d => addSong(browse.rows, d));
    if (docs.length) browse.cursor = docs[docs.length - 1];
    browse.more = docs.length === PAGE;
    browse.loaded = true;
    await fetchStats([...browse.rows.keys()].filter(u => !before.has(u)));
  } catch (e) {
    console.error(e);
    if (!browse.loaded) $('list').innerHTML = `<div class="note"><b>Couldn't load</b>${esc(e.message)}</div>`;
    else toast('Could not load more.');
  }
  busy = false; $('more').disabled = false;
  if (view === 'browse') render();
}

/* ── search: reads only what matches, across all submissions ── */
async function runSearch() {
  const q = $('q').value.trim();
  if (!q) return clearSearch();
  if (q.length < 2) { toast('Type at least 2 characters.'); return; }
  if (busy) return;
  const key = lc(q);
  if (searchCache.has(key)) { searchRows = searchCache.get(key); view = 'search'; render(); return; }
  busy = true;
  try {
    const subs = collection(db, 'submissions');
    const jobs = [];
    if (q.includes('@')) {
      // exact email
      new Set([q, key]).forEach(v => jobs.push(getDocs(query(subs, where('email', '==', v), limit(SEARCH_LIMIT)))));
    } else if (/^[A-Za-z0-9]{20,}$/.test(q)) {
      // exact user ID
      jobs.push(getDocs(query(subs, where('userId', '==', q), limit(SEARCH_LIMIT))));
    } else {
      // song title or artist name, by start of the text (case variants because Firestore is case sensitive)
      const variants = [...new Set([q, key, q.toUpperCase(), titleCase(q)])];
      ['releaseTitle', 'artistName'].forEach(f => variants.forEach(v =>
        jobs.push(getDocs(query(subs, where(f, '>=', v), where(f, '<=', v + '\uf8ff'), limit(SEARCH_LIMIT))))));
    }
    const rows = new Map();
    (await Promise.all(jobs)).forEach(sn => sn.docs.forEach(d => addSong(rows, d)));
    await fetchStats([...rows.keys()]);
    searchCache.set(key, rows);
    searchRows = rows; view = 'search';
  } catch (e) {
    console.error(e);
    toast('Search failed. Try again.');
  }
  busy = false;
  render();
}

function clearSearch() {
  $('q').value = '';
  view = 'browse';
  render();
}

/* ── render ── */
function rowHtml(r) {
  const s = stats.get(r.uid) || { youtube: 0, total: 0 };
  const label = r.songs.slice(0, 3).join(', ') + (r.songs.length > 3 ? ` +${r.songs.length - 3}` : '');
  return `
    <div class="row" data-uid="${esc(r.uid)}">
      <div class="who"><b title="${esc(r.name)}">${esc(r.name || 'Unknown artist')}</b><small title="${esc(r.uid)}">${esc(r.email || r.uid)}</small></div>
      <div class="songs" title="${esc(r.songs.join(', '))}">${esc(label)}</div>
      <label class="cell"><span>YouTube</span><input data-f="yt" type="number" inputmode="numeric" min="0" step="1" value="${s.youtube}"></label>
      <label class="cell"><span>Total</span><input data-f="total" type="number" inputmode="numeric" min="0" step="1" value="${s.total}"></label>
      <div class="act"><button class="btn" data-act="save" disabled>Save</button></div>
    </div>`;
}

function render() {
  const map = view === 'search' ? searchRows : browse.rows;
  const rows = [...map.values()];
  $('list').innerHTML = rows.length ? rows.map(rowHtml).join('')
    : `<div class="note"><b>${view === 'search' ? 'No approved songs found' : 'No approved songs yet'}</b>${view === 'search' ? 'Search matches the start of a song title or artist name.' : ''}</div>`;
  $('count').textContent = rows.length ? `${rows.length} artist${rows.length === 1 ? '' : 's'}` : '';
  $('more').style.display = view === 'browse' && browse.more ? '' : 'none';
  $('clear').style.display = view === 'search' ? '' : 'none';
}

/* ── edit + save: one small write, only when something changed ── */
function readRow(rowEl) {
  const yt = rowEl.querySelector('[data-f="yt"]').value.trim();
  const tt = rowEl.querySelector('[data-f="total"]').value.trim();
  const y = Number(yt), t = Number(tt);
  const ok = yt !== '' && tt !== '' && Number.isInteger(y) && Number.isInteger(t) && y >= 0 && t >= 0;
  return { ok, y, t };
}

function syncButton(rowEl) {
  const cur = stats.get(rowEl.dataset.uid) || { youtube: 0, total: 0 };
  const v = readRow(rowEl);
  const btn = rowEl.querySelector('[data-act="save"]');
  btn.disabled = !v.ok || (v.y === cur.youtube && v.t === cur.total);
  btn.textContent = 'Save';
  btn.classList.remove('ok');
}

$('list').addEventListener('input', e => {
  const rowEl = e.target.closest('.row');
  if (rowEl) syncButton(rowEl);
});

$('list').addEventListener('click', async e => {
  const btn = e.target.closest('[data-act="save"]');
  if (!btn || btn.disabled) return;
  const rowEl = btn.closest('.row'), uid = rowEl.dataset.uid;
  const v = readRow(rowEl);
  if (!v.ok) { toast('Enter whole numbers, 0 or more.'); return; }
  const cur = stats.get(uid) || { youtube: 0, total: 0, exists: false };
  // New record: write both fields so the app always finds them. Existing record: only what changed.
  const patch = {};
  if (!cur.exists || v.y !== cur.youtube) patch.youtubeStreams = v.y;
  if (!cur.exists || v.t !== cur.total)   patch.totalStreams = v.t;
  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    await setDoc(doc(db, 'analytics', uid), { ...patch, updatedAt: serverTimestamp() }, { merge: true });
    stats.set(uid, { youtube: v.y, total: v.t, exists: true });
    btn.textContent = 'Saved'; btn.classList.add('ok');
    setTimeout(() => { if (btn.textContent === 'Saved') syncButton(rowEl); }, 2200);
  } catch (err) {
    console.error(err);
    toast('Save failed: ' + err.message);
    syncButton(rowEl);
  }
});

/* ── controls ── */
$('sf').addEventListener('submit', e => { e.preventDefault(); runSearch(); });
$('clear').onclick = clearSearch;
$('more').onclick = loadMore;
$('q').addEventListener('input', e => { if (!e.target.value && view === 'search') clearSearch(); });
$('out').onclick = () => signOut(auth);

/* ── auth ── */
$('gb').onclick = async () => {
  $('gerr').textContent = '';
  try { await signInWithEmailAndPassword(auth, $('ge').value.trim(), $('gp').value); }
  catch (e) { $('gerr').textContent = 'Sign in failed.'; }
};
$('gp').addEventListener('keydown', e => { if (e.key === 'Enter') $('gb').click(); });

onAuthStateChanged(auth, u => {
  const ok = u && ADMINS.includes(lc(u.email));
  $('gate').style.display = ok ? 'none' : 'block';
  $('app').style.display  = ok ? 'block' : 'none';
  if (ok && !browse.loaded) loadMore();
  else if (u && !ok) { $('gerr').textContent = 'This account is not an admin.'; signOut(auth); }
});
</script>
</body>
</html>
