<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analytics • 444Music Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:     #000000;
  --card:   #0b0b0b;
  --field:  #141414;
  --line:   rgba(255,255,255,0.08);
  --line-2: rgba(255,255,255,0.18);
  --text:   #f2f0ec;
  --muted:  #9a9791;
  --faint:  #5f5d59;
  --green:  #8fd19e;
  --head:   'Outfit', sans-serif;
  --body:   'Plus Jakarta Sans', system-ui, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--body); background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--line-2); outline-offset: 2px; }

/* sign in */
#gate { max-width: 340px; margin: 18vh auto 0; padding: 0 20px; }
.gate-box { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 26px; display: flex; flex-direction: column; gap: 10px; }
.gate-box h2 { font-family: var(--head); font-size: 20px; font-weight: 700; }
.gate-box p { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
.gate-box input { background: var(--field); border: 1px solid transparent; border-radius: 10px; padding: 11px 13px; outline: none; }
.gate-box input:focus { border-color: var(--line-2); }
#gerr { font-size: 12.5px; min-height: 16px; color: var(--muted); }

/* shell */
#app { display: none; }
.top { display: flex; align-items: center; justify-content: space-between; padding: 0 28px; height: 60px; border-bottom: 1px solid var(--line); }
.brand { font-family: var(--head); font-weight: 800; font-size: 19px; letter-spacing: -0.4px; display: flex; align-items: center; gap: 10px; }
.brand span { font-family: var(--body); font-size: 11px; font-weight: 600; letter-spacing: 0; color: var(--muted); border: 1px solid var(--line-2); border-radius: 999px; padding: 2px 10px; }
.wrap { max-width: 1040px; margin: 0 auto; padding: 34px 24px 80px; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.head h1 { font-family: var(--head); font-size: 28px; font-weight: 700; letter-spacing: -0.6px; }
.head p { color: var(--muted); margin-top: 4px; font-size: 13.5px; max-width: 52ch; }

/* controls */
.search { display: flex; gap: 10px; margin: 24px 0 18px; }
.search input { flex: 1; min-width: 0; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; outline: none; }
.search input::placeholder { color: var(--faint); }
.search input:focus { border-color: var(--line-2); }

.btn { background: var(--text); color: #000; border-radius: 10px; padding: 10px 20px; font-weight: 600; font-size: 13px; white-space: nowrap; transition: opacity .15s; }
.btn:hover:not(:disabled) { opacity: .86; }
.btn:disabled { opacity: .26; }
.btn.ok { background: transparent; color: var(--green); opacity: 1; }
.ghost { border: 1px solid var(--line-2); border-radius: 10px; padding: 9px 16px; font-weight: 600; font-size: 13px; color: var(--text); background: transparent; transition: background .15s; white-space: nowrap; }
.ghost:hover:not(:disabled) { background: var(--field); }
.ghost:disabled { opacity: .4; }

/* artist cards */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; align-items: start; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 20px 20px 18px; }
.who b { display: block; font-family: var(--head); font-weight: 600; font-size: 17px; letter-spacing: -0.2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.songs { margin-top: 14px; }
.song { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 10px 0; border-top: 1px solid var(--line); }
.sname { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.sname span { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sname em { font-style: normal; font-size: 12px; color: var(--green); }
.sname em.ed { color: var(--muted); }
.n { width: 104px; flex: none; background: var(--field); border: 1px solid transparent; border-radius: 9px; padding: 8px 11px; outline: none; text-align: right; font-variant-numeric: tabular-nums; }
.n::placeholder { color: var(--faint); }
.n:focus { border-color: var(--line-2); }
.n::-webkit-outer-spin-button, .n::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.n[type=number] { -moz-appearance: textfield; }

.more { display: block; width: 100%; padding: 9px 0 4px; color: var(--muted); font-size: 12.5px; font-weight: 600; text-align: center; border-top: 1px solid var(--line); }
.more:hover:not(:disabled) { color: var(--text); }

.cfoot { display: flex; align-items: flex-end; gap: 14px; margin-top: 14px; padding-top: 16px; border-top: 1px solid var(--line); }
.cfoot label, .tot { display: flex; flex-direction: column; gap: 4px; }
.cfoot span, .tot span { font-size: 11.5px; color: var(--muted); }
.cfoot label .n { width: 96px; text-align: left; }
.tot { flex: 1; min-width: 0; }
.tot b { font-family: var(--head); font-size: 22px; font-weight: 600; letter-spacing: -0.4px; font-variant-numeric: tabular-nums; line-height: 1.1; }

.foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 18px; color: var(--muted); font-size: 12.5px; min-height: 36px; }
.note { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--muted); }
.note b { display: block; color: var(--text); font-family: var(--head); font-size: 16px; font-weight: 600; margin-bottom: 4px; }

/* confirm dialog */
.veil { position: fixed; inset: 0; background: rgba(0,0,0,.66); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 40; }
.veil.show { display: flex; }
.dialog { background: var(--card); border: 1px solid var(--line-2); border-radius: 18px; padding: 24px; width: 100%; max-width: 380px; }
.dialog h3 { font-family: var(--head); font-size: 19px; font-weight: 600; }
.dialog p { color: var(--muted); margin-top: 8px; font-size: 13.5px; }
.dact { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 140%); background: var(--text); color: #000; padding: 10px 18px; border-radius: 999px; font-weight: 600; font-size: 13px; transition: transform .25s ease; z-index: 50; max-width: calc(100% - 32px); text-align: center; }
.toast.show { transform: translate(-50%, 0); }

@media (max-width: 760px) {
  .top { padding: 0 16px; }
  .wrap { padding: 24px 14px 64px; }
  .grid { grid-template-columns: minmax(0, 1fr); }
  .search { flex-wrap: wrap; }
  .search input { flex-basis: 100%; }
}
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>

<div id="gate">
  <div class="gate-box">
    <h2>Admin sign in</h2>
    <p>Use your admin account.</p>
    <input id="ge" type="email" placeholder="Email" autocomplete="username">
    <input id="gp" type="password" placeholder="Password" autocomplete="current-password">
    <button class="btn" id="gb">Sign in</button>
    <div id="gerr"></div>
  </div>
</div>

<div id="app">
  <header class="top">
    <div class="brand">444Music <span>Admin</span></div>
    <button class="ghost" id="out">Sign out</button>
  </header>

  <main class="wrap">
    <div class="head">
      <div>
        <h1>Analytics</h1>
        <p>Streams for every approved song. Download the report when it's time to pay.</p>
      </div>
      <button class="ghost" id="report">Download report</button>
    </div>

    <form class="search" id="sf" autocomplete="off">
      <input id="q" type="text" placeholder="Search song, artist, email or user ID" spellcheck="false">
      <button class="btn" type="submit">Search</button>
      <button class="ghost" type="button" id="clear" style="display:none">Clear</button>
    </form>

    <div class="grid" id="list"></div>

    <div class="foot">
      <span id="count"></span>
      <button class="ghost" id="more" style="display:none">Load more artists</button>
    </div>
  </main>
</div>

<div class="veil" id="veil">
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dt">
    <h3 id="dt"></h3>
    <p id="dp"></p>
    <div class="dact">
      <button class="ghost" id="dno">Cancel</button>
      <button class="btn" id="dyes">Download and reset</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut }
  from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
import { getFirestore, collection, doc, getDocs, query, where, orderBy, limit, startAfter, documentId, serverTimestamp, increment, writeBatch }
  from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

const app  = initializeApp({
  apiKey: "AIzaSyBzUD7avh7vJfeSMRl2o9F09_qd-pl0dSg",
  authDomain: "usersubmissionsportal.firebaseapp.com",
  projectId: "usersubmissionsportal",
  storageBucket: "usersubmissionsportal.firebasestorage.app",
  messagingSenderId: "734783502459",
  appId: "1:734783502459:web:cfa2cc5de6976003b24ade"
});
const auth = getAuth(app);
const db   = getFirestore(app);

const ADMINS   = ['444musicdistro@gmail.com'];   // accounts allowed on this page
const APPROVED = ['Approved', 'approved'];
const PAGE = 10;            // approved releases read per page of artists
const SEARCH_LIMIT = 15;    // max documents per search query
const SONGS_SHOWN = 5;      // songs shown on a card before "See more"
const MIN_STREAMS = 50;     // a song needs this many new streams to land in the report

const $  = id => document.getElementById(id);
const lc = s => String(s || '').toLowerCase().trim();
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const isApproved = d => lc(d.status) === 'approved';
const titleCase = s => s.replace(/\b\w/g, c => c.toUpperCase());
const fmt = n => Number(n).toLocaleString('en-US');
const num = v => { const t = String(v).trim(); if (t === '') return null; const n = Number(t); return Number.isInteger(n) && n >= 0 ? n : null; };
/* song box: empty is allowed (means "use the synced number") */
const val = v => { const t = String(v).trim(); if (t === '') return { ok: true, v: null }; const n = Number(t); return Number.isInteger(n) && n >= 0 ? { ok: true, v: n } : { ok: false }; };

function toast(msg) {
  const t = $('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 3200);
}

/* ---------- state (kept in memory, nothing is read twice unless needed) ---------- */
const stats = new Map();        // uid -> { youtube, total, exists }
const songById = new Map();     // "releaseId:trackNo" -> song (one shared object per track)
const subById = new Map();      // release id -> { id, last:{trackNo:streams}, edits:{trackNo:streams} }
const searchCache = new Map();  // search text -> Map(uid -> artist row)
let browse = { rows: new Map(), cursor: null, more: false, loaded: false };
let searchRows = new Map();
let view = 'browse';            // 'browse' | 'search'
let busy = false;

const currentRows = () => view === 'search' ? searchRows : browse.rows;
const getRow = uid => currentRows().get(uid);
const sortedSongs = r => [...r.songs.values()].sort((a, b) => a.sub.id < b.sub.id ? -1 : a.sub.id > b.sub.id ? 1 : a.idx - b.idx);

/* ---------- reading tracks from a release (same fields the artist page reads) ----------
   multi-track: audioFiles[i].title + youtubeTrackMatches[i].views (status 'matched')
   single/legacy: youtubeViews
   no match yet = null (shown as "Pending", never as 0) */
function readTracks(s) {
  const list = Array.isArray(s.audioFiles) && s.audioFiles.length ? s.audioFiles : null;
  if (list) {
    const m = s.youtubeTrackMatches || {};
    return list.map((t, i) => {
      const x = m[String(i)];
      const ok = x && x.status === 'matched' && typeof x.views === 'number';
      const title = list.length === 1 ? (s.releaseTitle || (t && t.title) || 'Untitled') : ((t && t.title) || `Track ${i + 1}`);
      return { idx: i, title, synced: ok ? x.views : null };
    });
  }
  return [{ idx: 0, title: s.releaseTitle || s.songTitle || s.title || 'Untitled', synced: typeof s.youtubeViews === 'number' ? s.youtubeViews : null }];
}
const mapOf = v => (v && typeof v === 'object') ? Object.fromEntries(Object.entries(v).map(([k, n]) => [k, Number(n) || 0])) : {};
const lastMapOf = v => typeof v === 'number' ? { '0': v } : mapOf(v);

const effOf = sg => sg.edit !== null ? sg.edit : sg.synced;     // what the page shows (null = pending)
const effNum = sg => effOf(sg) ?? 0;
const lastOf = sg => Number(sg.sub.last[sg.idx]) || 0;
/* typed value -> the edit to store (empty or same as synced = no edit) */
const nextEdit = (sg, v) => (v === null || v === sg.synced) ? null : v;

/* One card per artist. Every track keeps its own streams and its own "streams at last report". */
function addSong(map, d) {
  const s = d.data();
  if (!isApproved(s) || !s.userId) return;
  let r = map.get(s.userId);
  if (!r) { r = { uid: s.userId, name: s.artistName || '', email: s.email || '', songs: new Map(), shown: SONGS_SHOWN, done: false }; map.set(s.userId, r); }
  let sub = subById.get(d.id);
  if (!sub) { sub = { id: d.id, last: lastMapOf(s.lastExport), edits: mapOf(s.streamEdits) }; subById.set(d.id, sub); }
  readTracks(s).forEach(t => {
    const key = `${d.id}:${t.idx}`;
    let song = songById.get(key);
    if (!song) {
      const e = sub.edits[t.idx];
      song = { key, sub, idx: t.idx, title: t.title, synced: t.synced, edit: e === undefined ? null : e };
      songById.set(key, song);
    }
    r.songs.set(key, song);
  });
}

/* Artist totals (analytics docs) for the cards on screen, only the ones not read yet. */
async function fetchStats(uids) {
  const need = uids.filter(u => !stats.has(u));
  for (let i = 0; i < need.length; i += 30) {
    const chunk = need.slice(i, i + 30);
    const snap = await getDocs(query(collection(db, 'analytics'), where(documentId(), 'in', chunk)));
    snap.forEach(d => {
      const a = d.data();
      stats.set(d.id, { youtube: Number(a.youtubeStreams ?? a.youtube ?? 0) || 0, total: Number(a.totalStreams ?? a.total ?? 0) || 0, exists: true });
    });
    chunk.forEach(u => { if (!stats.has(u)) stats.set(u, { youtube: 0, total: 0, exists: false }); });
  }
}

/* ---------- browse ---------- */
async function loadMore() {
  if (busy) return;
  busy = true; $('more').disabled = true;
  if (!browse.loaded) $('list').innerHTML = '<div class="note">Loading…</div>';
  try {
    const q = query(collection(db, 'submissions'), where('status', 'in', APPROVED),
      ...(browse.cursor ? [startAfter(browse.cursor)] : []), limit(PAGE));
    const docs = (await getDocs(q)).docs;
    const before = new Set(browse.rows.keys());
    docs.forEach(d => addSong(browse.rows, d));
    if (docs.length) browse.cursor = docs[docs.length - 1];
    browse.more = docs.length === PAGE;
    browse.loaded = true;
    await fetchStats([...browse.rows.keys()].filter(u => !before.has(u)));
  } catch (e) {
    console.error(e);
    if (!browse.loaded) $('list').innerHTML = `<div class="note"><b>Couldn't load</b>${esc(e.message)}</div>`;
    else toast('Could not load more.');
  }
  busy = false; $('more').disabled = false;
  if (view === 'browse') render();
}

/* ---------- search ---------- */
async function runSearch() {
  const q = $('q').value.trim();
  if (!q) return clearSearch();
  if (q.length < 2) { toast('Type at least 2 characters.'); return; }
  if (busy) return;
  const key = lc(q);
  if (searchCache.has(key)) { searchRows = searchCache.get(key); view = 'search'; render(); return; }
  busy = true;
  try {
    const subs = collection(db, 'submissions');
    const jobs = [];
    if (q.includes('@')) {
      new Set([q, key]).forEach(v => jobs.push(getDocs(query(subs, where('email', '==', v), limit(SEARCH_LIMIT)))));
    } else if (/^[A-Za-z0-9]{20,}$/.test(q)) {
      jobs.push(getDocs(query(subs, where('userId', '==', q), limit(SEARCH_LIMIT))));
    } else {
      const variants = [...new Set([q, key, q.toUpperCase(), titleCase(q)])];
      ['releaseTitle', 'artistName'].forEach(f => variants.forEach(v =>
        jobs.push(getDocs(query(subs, where(f, '>=', v), where(f, '<=', v + '\uf8ff'), limit(SEARCH_LIMIT))))));
    }
    const rows = new Map();
    (await Promise.all(jobs)).forEach(sn => sn.docs.forEach(d => addSong(rows, d)));
    await fetchStats([...rows.keys()]);
    searchCache.set(key, rows);
    searchRows = rows; view = 'search';
  } catch (e) {
    console.error(e);
    toast('Search failed. Try again.');
  }
  busy = false;
  render();
}

function clearSearch() {
  $('q').value = '';
  view = 'browse';
  render();
}

/* ---------- drawing the cards ---------- */
function moreLabel(r) {
  const hidden = r.songs.size - r.shown;
  if (hidden > 0) return `See more (${hidden} more)`;
  // all loaded songs are showing; in browse we can still ask for the next few
  const exhausted = browse.loaded && !browse.more;
  if (view === 'browse' && !r.done && !exhausted && r.songs.size >= r.shown) return 'See more';
  return '';
}

function cardHtml(r) {
  const s = stats.get(r.uid) || { youtube: 0, total: 0 };
  const songs = sortedSongs(r).slice(0, r.shown).map(sg => {
    const eff = effOf(sg);
    const added = (eff ?? 0) - lastOf(sg);
    const bits = [];
    if (added > 0) bits.push(`+${fmt(added)} since last report`);
    if (sg.edit !== null) bits.push('edited');
    return `
      <div class="song">
        <div class="sname"><span title="${esc(sg.title)}">${esc(sg.title)}</span>${bits.length ? `<em class="${added > 0 ? '' : 'ed'}">${bits.join(' · ')}</em>` : ''}</div>
        <input class="n" type="number" inputmode="numeric" min="0" step="1" value="${eff === null ? '' : eff}" placeholder="Pending"
          data-s="${esc(sg.key)}" data-k="${esc(r.uid)}:${esc(sg.key)}" aria-label="Streams for ${esc(sg.title)}">
      </div>`;
  }).join('');
  const more = moreLabel(r);
  return `
    <article class="card" data-uid="${esc(r.uid)}">
      <div class="who"><b title="${esc(r.name)}">${esc(r.name || 'Unknown artist')}</b><small title="${esc(r.uid)}">${esc(r.email || r.uid)}</small></div>
      <div class="songs">${songs}</div>
      ${more ? `<button class="more" data-act="more">${more}</button>` : ''}
      <div class="cfoot">
        <label><span>YouTube</span><input class="n" type="number" inputmode="numeric" min="0" step="1" value="${s.youtube}" data-yt data-k="${esc(r.uid)}:yt"></label>
        <div class="tot"><span>Total streams</span><b>${fmt(s.total)}</b></div>
        <button class="btn" data-act="save" disabled>Save</button>
      </div>
    </article>`;
}

/* keep whatever is typed but not saved yet when the list is redrawn */
function snapshotDirty() {
  const m = {};
  document.querySelectorAll('#list input[data-k]').forEach(i => { if (i.value !== i.defaultValue) m[i.dataset.k] = i.value; });
  return m;
}
function restoreDirty(m) {
  document.querySelectorAll('#list input[data-k]').forEach(i => { if (m[i.dataset.k] !== undefined) i.value = m[i.dataset.k]; });
  document.querySelectorAll('#list .card').forEach(updateCard);
}

function render() {
  const dirty = snapshotDirty();
  const rows = [...currentRows().values()];
  $('list').innerHTML = rows.length ? rows.map(cardHtml).join('')
    : `<div class="note"><b>${view === 'search' ? 'No approved songs found' : 'No approved songs yet'}</b>${view === 'search' ? 'Search matches the start of a song title or artist name.' : ''}</div>`;
  restoreDirty(dirty);
  $('count').textContent = rows.length ? `${rows.length} artist${rows.length === 1 ? '' : 's'}` : '';
  $('more').style.display = view === 'browse' && browse.more ? '' : 'none';
  $('clear').style.display = view === 'search' ? '' : 'none';
}

function renderCard(uid) {
  const el = $('list').querySelector(`.card[data-uid="${CSS.escape(uid)}"]`);
  const r = getRow(uid);
  if (!el || !r) return;
  const dirty = snapshotDirty();
  const tmp = document.createElement('div');
  tmp.innerHTML = cardHtml(r);
  el.replaceWith(tmp.firstElementChild);
  restoreDirty(dirty);
}

/* ---------- editing: total follows the songs, save is one small batch ---------- */
function updateCard(card) {
  const cur = stats.get(card.dataset.uid) || { youtube: 0, total: 0 };
  let delta = 0, valid = true, dirty = false;
  card.querySelectorAll('input[data-s]').forEach(i => {
    const p = val(i.value), sg = songById.get(i.dataset.s);
    if (!p.ok) { valid = false; return; }
    const ne = nextEdit(sg, p.v);
    if (ne !== sg.edit) { dirty = true; delta += (ne !== null ? ne : (sg.synced ?? 0)) - effNum(sg); }
  });
  const y = num(card.querySelector('[data-yt]').value);
  if (y === null) valid = false; else if (y !== cur.youtube) dirty = true;
  card.querySelector('.tot b').textContent = fmt(cur.total + delta);
  const btn = card.querySelector('[data-act="save"]');
  btn.disabled = !(valid && dirty);
  btn.textContent = 'Save';
  btn.classList.remove('ok');
}

async function saveCard(uid) {
  const card = $('list').querySelector(`.card[data-uid="${CSS.escape(uid)}"]`);
  const btn = card.querySelector('[data-act="save"]');
  const cur = stats.get(uid) || { youtube: 0, total: 0, exists: false };
  const changes = [];
  let delta = 0;
  for (const i of card.querySelectorAll('input[data-s]')) {
    const p = val(i.value), sg = songById.get(i.dataset.s);
    if (!p.ok) { toast('Use whole numbers, 0 or more.'); return; }
    const ne = nextEdit(sg, p.v);
    if (ne !== sg.edit) { changes.push({ sg, ne }); delta += (ne !== null ? ne : (sg.synced ?? 0)) - effNum(sg); }
  }
  const y = num(card.querySelector('[data-yt]').value);
  if (y === null) { toast('Use whole numbers, 0 or more.'); return; }

  const patch = {};
  if (!cur.exists || y !== cur.youtube) patch.youtubeStreams = y;
  if (changes.length || !cur.exists) patch.totalStreams = increment(delta);

  // one write per release that changed (all its edited tracks go in the same write)
  const bySub = new Map();
  changes.forEach(c => {
    if (!bySub.has(c.sg.sub.id)) bySub.set(c.sg.sub.id, { ...c.sg.sub.edits });
    const m = bySub.get(c.sg.sub.id);
    if (c.ne === null) delete m[c.sg.idx]; else m[c.sg.idx] = c.ne;
  });

  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    const batch = writeBatch(db);
    bySub.forEach((m, id) => batch.update(doc(db, 'submissions', id), { streamEdits: m }));
    batch.set(doc(db, 'analytics', uid), { ...patch, updatedAt: serverTimestamp() }, { merge: true });
    await batch.commit();
    changes.forEach(c => { c.sg.edit = c.ne; });
    bySub.forEach((m, id) => { subById.get(id).edits = m; });
    stats.set(uid, { youtube: y, total: cur.total + delta, exists: true });
    renderCard(uid);
    const fresh = $('list').querySelector(`.card[data-uid="${CSS.escape(uid)}"] [data-act="save"]`);
    if (fresh) {
      fresh.textContent = 'Saved'; fresh.classList.add('ok');
      setTimeout(() => { if (fresh.textContent === 'Saved' && fresh.isConnected) { fresh.textContent = 'Save'; fresh.classList.remove('ok'); } }, 2200);
    }
  } catch (err) {
    console.error(err);
    toast('Save failed: ' + err.message);
    updateCard(card);
  }
}

/* ---------- see more songs on one card ---------- */
async function seeMore(uid, btn) {
  const r = getRow(uid);
  if (!r) return;
  if (r.songs.size > r.shown) {                       // already loaded, just show them
    r.shown = Math.min(r.shown + SONGS_SHOWN, r.songs.size);
    return renderCard(uid);
  }
  if (busy) return;
  busy = true; btn.disabled = true; btn.textContent = 'Loading…';
  try {
    const last = sortedSongs(r).pop().sub.id;
    const docs = (await getDocs(query(collection(db, 'submissions'),
      where('userId', '==', uid), where('status', 'in', APPROVED),
      orderBy(documentId()), startAfter(last), limit(SONGS_SHOWN)))).docs;
    docs.forEach(d => addSong(currentRows(), d));
    if (docs.length < SONGS_SHOWN) r.done = true;
    r.shown = Math.min(r.shown + SONGS_SHOWN, r.songs.size);
  } catch (e) {
    console.error(e);
    toast('Could not load more songs.');
  }
  busy = false;
  renderCard(uid);
}

/* ---------- the report ---------- */
let pending = [];
let pendingLast = new Map();   // release id -> its saved "last report" numbers

function csvText(items) {
  const cell = v => { let t = String(v == null ? '' : v); if (/^[=+\-@\t\r]/.test(t)) t = "'" + t; return '"' + t.replace(/"/g, '""') + '"'; };
  const today = new Date().toISOString().slice(0, 10);
  const lines = [['Artist', 'Email', 'Song', 'New streams', 'Total streams', 'Report date'].map(cell).join(',')];
  items.forEach(it => lines.push([cell(it.artist), cell(it.email), cell(it.song), it.added, it.streams, today].join(',')));
  return '\ufeff' + lines.join('\r\n');
}

function saveFile(text) {
  const url = URL.createObjectURL(new Blob([text], { type: 'text/csv;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url; a.download = `444music-streams-${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

async function prepareReport() {
  if (busy) return;
  if ([...document.querySelectorAll('[data-act="save"]')].some(b => !b.disabled)) { toast('Save your changes first.'); return; }
  busy = true; $('report').disabled = true; $('report').textContent = 'Checking…';
  try {
    // streams live inside each release, so approved releases are read once (1 read each)
    const snap = await getDocs(query(collection(db, 'submissions'), where('status', 'in', APPROVED)));
    const items = [];
    const lasts = new Map();
    snap.forEach(d => {
      const s = d.data();
      if (!isApproved(s)) return;
      const edits = mapOf(s.streamEdits), last = lastMapOf(s.lastExport);
      readTracks(s).forEach(t => {
        const eff = edits[t.idx] !== undefined ? edits[t.idx] : t.synced;
        if (eff === null || eff === undefined) return;
        const added = eff - (Number(last[t.idx]) || 0);
        if (added >= MIN_STREAMS) {
          items.push({ sub: d.id, idx: t.idx, artist: s.artistName || '', email: s.email || '', song: t.title, added, streams: eff });
          lasts.set(d.id, last);
        }
      });
    });
    items.sort((a, b) => a.artist.localeCompare(b.artist) || a.song.localeCompare(b.song));
    if (!items.length) {
      toast(`No songs have ${MIN_STREAMS}+ new streams yet.`);
    } else {
      pending = items; pendingLast = lasts;
      const total = items.reduce((n, it) => n + it.added, 0);
      $('dt').textContent = `${items.length} song${items.length === 1 ? '' : 's'} ready`;
      $('dp').textContent = `${fmt(total)} new streams across songs with ${MIN_STREAMS}+ since the last report. Downloading starts these songs from 0 again. Songs under ${MIN_STREAMS} keep adding up.`;
      $('veil').classList.add('show');
    }
  } catch (e) {
    console.error(e);
    toast('Could not build the report: ' + e.message);
  }
  busy = false; $('report').disabled = false; $('report').textContent = 'Download report';
}

$('dno').onclick = () => { $('veil').classList.remove('show'); pending = []; pendingLast = new Map(); };

$('dyes').onclick = async () => {
  if (!pending.length) return;
  const btn = $('dyes');
  btn.disabled = true; btn.textContent = 'Working…';
  const items = pending;
  const text = csvText(items);
  try {
    // one write per release; all its exported tracks are reset together
    const bySub = new Map();
    items.forEach(it => {
      if (!bySub.has(it.sub)) bySub.set(it.sub, { ...(pendingLast.get(it.sub) || {}) });
      bySub.get(it.sub)[it.idx] = it.streams;
    });
    const entries = [...bySub.entries()];
    // reset first; the file is only handed over once the reset has gone through
    for (let i = 0; i < entries.length; i += 400) {
      const batch = writeBatch(db);
      entries.slice(i, i + 400).forEach(([id, m]) => batch.update(doc(db, 'submissions', id), { lastExport: m, lastExportAt: serverTimestamp() }));
      await batch.commit();
    }
    saveFile(text);
    bySub.forEach((m, id) => { const sub = subById.get(id); if (sub) sub.last = m; });
    pending = []; pendingLast = new Map();
    $('veil').classList.remove('show');
    render();
    toast('Report downloaded');
  } catch (e) {
    console.error(e);
    toast('Something went wrong, no file was downloaded. Try again.');
  }
  btn.disabled = false; btn.textContent = 'Download and reset';
};

/* ---------- wiring ---------- */
$('list').addEventListener('input', e => {
  const c = e.target.closest('.card');
  if (c) updateCard(c);
});
$('list').addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const uid = b.closest('.card').dataset.uid;
  if (b.dataset.act === 'save') saveCard(uid);
  else if (b.dataset.act === 'more') seeMore(uid, b);
});

$('sf').addEventListener('submit', e => { e.preventDefault(); runSearch(); });
$('clear').onclick = clearSearch;
$('more').onclick = loadMore;
$('report').onclick = prepareReport;
$('q').addEventListener('input', e => { if (!e.target.value && view === 'search') clearSearch(); });
$('out').onclick = () => signOut(auth);

/* ---------- auth ---------- */
$('gb').onclick = async () => {
  $('gerr').textContent = '';
  try { await signInWithEmailAndPassword(auth, $('ge').value.trim(), $('gp').value); }
  catch (e) { $('gerr').textContent = 'Sign in failed.'; }
};
$('gp').addEventListener('keydown', e => { if (e.key === 'Enter') $('gb').click(); });

onAuthStateChanged(auth, u => {
  const ok = u && ADMINS.includes(lc(u.email));
  $('gate').style.display = ok ? 'none' : 'block';
  $('app').style.display  = ok ? 'block' : 'none';
  if (ok && !browse.loaded) loadMore();
  else if (u && !ok) { $('gerr').textContent = 'This account is not an admin.'; signOut(auth); }
});
</script>
