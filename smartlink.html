<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>444Music — Smart Link</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --text: #ffffff; --text-sec: rgba(255,255,255,0.75); --text-mut: rgba(255,255,255,0.45);
    --ff-display: 'Poppins', sans-serif; --ff-body: 'Inter', sans-serif;
  }
  html, body { height: 100%; }
  html { -webkit-font-smoothing: antialiased; }
  body {
    background: #050505; color: var(--text); font-family: var(--ff-body);
    min-height: 100vh; overflow-x: hidden; position: relative;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }

  /* ── Blurred artwork backdrop — same image, heavily blurred and
       scaled so its own dominant color fills the whole screen ── */
  .bg-blur {
    position: fixed; inset: -10%; z-index: 0;
    background-size: cover; background-position: center;
    filter: blur(70px) saturate(1.3) brightness(0.6);
    transform: scale(1.15);
  }
  .bg-scrim {
    position: fixed; inset: 0; z-index: 1;
    background: linear-gradient(180deg, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0.55) 100%);
  }

  .card {
    position: relative; z-index: 2;
    width: 100%; max-width: 380px; text-align: center;
  }
  .artwork {
    width: 200px; height: 200px; border-radius: 18px; object-fit: cover;
    margin: 0 auto 22px; box-shadow: 0 25px 60px rgba(0,0,0,0.45);
  }
  .artwork.placeholder {
    display: flex; align-items: center; justify-content: center;
    font-family: var(--ff-display); font-weight: 800; font-size: 3rem;
    color: var(--text-mut); background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
  }
  .title { font-family: var(--ff-display); font-weight: 700; font-size: 1.3rem; margin-bottom: 3px; }
  .artist { color: var(--text-sec); font-size: 0.95rem; margin-bottom: 26px; }

  .stores { display: flex; flex-direction: column; gap: 12px; }
  .store-btn {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: rgba(255,255,255,0.92);
    -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
    border-radius: 999px; padding: 14px 8px 14px 22px;
    text-decoration: none; color: #0a0a0a;
    font-weight: 700; font-size: 0.95rem; font-family: var(--ff-body);
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .store-btn:active { transform: scale(0.97); }
  .store-btn:hover { background: #ffffff; }
  .store-btn .play-label { flex-shrink: 0; }
  .store-btn .store-right {
    display: flex; align-items: center; gap: 8px;
    color: rgba(0,0,0,0.45); font-weight: 600; font-size: 0.85rem;
  }
  .store-icon {
    width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .store-icon svg { width: 18px; height: 18px; }

  .footer-mark {
    margin-top: 28px; color: var(--text-mut); font-size: 0.72rem;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .footer-mark b { color: var(--text-sec); }
  .state { color: var(--text-sec); font-size: 0.9rem; padding: 60px 0; }
  .loader {
    width: 26px; height: 26px; border: 2px solid rgba(255,255,255,0.2); border-top-color: #fff;
    border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="bg-blur" id="bgBlur"></div>
<div class="bg-scrim"></div>

<div class="card" id="card">
  <div class="state"><div class="loader"></div>Loading…</div>
</div>

const DEFAULT_ICON = { bg: 'rgba(0,0,0,0.55)', svg: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>' };

function escHtml(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function getSlugFromUrl() {
  const path = window.location.pathname;
  const parts = path.split('/').filter(Boolean);
  const fromPath = parts[parts.length - 1];
  if (fromPath && fromPath !== 'smartlink.html' && fromPath !== 'smartlink' && fromPath !== 'l' && fromPath !== 'go') return fromPath;
  return new URLSearchParams(window.location.search).get('slug');
}

function renderState(html) {
  document.getElementById('card').innerHTML = `<div class="state">${html}</div>`;
}

function renderRelease(item) {
  const sl = item.smartLink || {};
  const stores = sl.stores || {};
  const title = sl.title || item.releaseTitle || 'Untitled';
  const artist = sl.artistName || item.artistName || 'Unknown Artist';
  const initial = artist.charAt(0).toUpperCase();
  const artworkUrl = sl.thumbnailUrl || item.coverURL || '';

  if (artworkUrl) {
    document.getElementById('bgBlur').style.backgroundImage = `url("${artworkUrl.replace(/"/g,'')}")`;
  }

  const artworkHtml = artworkUrl
    ? `<img class="artwork" src="${escHtml(artworkUrl)}" alt="${escHtml(title)}">`
    : `<div class="artwork placeholder">${escHtml(initial)}</div>`;

  const orderedKeys = [
    ...STORE_ORDER.filter(k => stores[k]),
    ...Object.keys(stores).filter(k => !STORE_ORDER.includes(k) && stores[k])
  ];

  const storeButtons = orderedKeys.map(key => {
    const label = STORE_LABELS[key] || key;
    const icon = STORE_ICONS[key] || DEFAULT_ICON;
    return `<a class="store-btn" href="${escHtml(stores[key])}" target="_blank" rel="noopener">
      <span class="play-label">Play</span>
      <span class="store-right">
        ${label}
        <span class="store-icon" style="background:${icon.bg}">${icon.svg}</span>
      </span>
    </a>`;
  }).join('');

  const fallback = (!sl.resolved && sl.pageUrl)
    ? `<a class="store-btn" href="${escHtml(sl.pageUrl)}" target="_blank" rel="noopener"><span class="play-label">More</span><span class="store-right">All platforms</span></a>`
    : '';

  document.getElementById('card').innerHTML = `
    ${artworkHtml}
    <div class="title">${escHtml(title)}</div>
    <div class="artist">${escHtml(artist)}</div>
    <div class="stores">
      ${storeButtons || '<div class="state" style="padding:20px 0;">Still gathering store links — check back soon.</div>'}
      ${fallback}
    </div>
    <div class="footer-mark">Distributed by <a href="https://www.444musicdistro.com" target="_blank" rel="noopener" style="color: var(--text-sec); font-weight: 700; text-decoration: none;">444Music</a></div>
  `;
}

async function load() {
  const slug = getSlugFromUrl();
  if (!slug) { renderState('No release specified.'); return; }

  try {
    const q = query(collection(db, 'submissions'), where('smartLinkSlug', '==', slug), limit(1));
    const snap = await getDocs(q);
    if (snap.empty) {
      renderState('Release not found.');
      return;
    }
    const item = snap.docs[0].data();
    renderRelease(item);
  } catch (e) {
    console.error(e);
    renderState('Something went wrong loading this release.');
  }
}

load();
</script>
