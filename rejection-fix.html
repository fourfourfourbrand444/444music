<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Fix &amp; Resubmit — 444Music</title>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --bg: #000000;
  --s1: #1c1c1e;
  --s2: #2c2c2e;
  --s3: #636366;
  --sep: rgba(84,84,88,0.55);
  --fill: rgba(120,120,128,0.24);
  --t1: #ffffff;
  --t2: rgba(235,235,245,0.60);
  --t3: rgba(235,235,245,0.30);
  --blue: #0a84ff;
  --yellow: #fdeb0d;
  --green: #30d158;
  --rose: #ff453a;
  --ease: cubic-bezier(0.32, 0.72, 0, 1);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Helvetica Neue", Roboto, Arial, sans-serif;
}

html { color-scheme: dark; -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body { font-family: var(--font); background: var(--bg); color: var(--t1); min-height: 100vh; letter-spacing: -0.01em; -webkit-font-smoothing: antialiased; }
button { font-family: inherit; color: inherit; background: none; border: none; cursor: pointer; }
input[type="file"] { display: none !important; }

.shell { max-width: 640px; margin: 0 auto; padding: 0 16px calc(150px + env(safe-area-inset-bottom)); }

/* top bar */
.bar {
  position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  height: 56px; margin: 0 -16px; padding: 0 16px; background: rgba(0,0,0,0.72);
  -webkit-backdrop-filter: saturate(180%) blur(24px); backdrop-filter: saturate(180%) blur(24px);
}
.back { width: 36px; height: 36px; border-radius: 50%; background: var(--fill); display: flex; align-items: center; justify-content: center; transition: transform .3s var(--ease); }
.back:active { transform: scale(0.92); }
.back svg { width: 16px; height: 16px; }
.bar-title { font-size: 17px; font-weight: 600; }
.bar-spacer { width: 36px; }

.hero { padding: 14px 4px 6px; }
.hero h1 { font-size: 34px; font-weight: 700; letter-spacing: -0.04em; line-height: 1.1; }
.hero p { font-size: 17px; color: var(--t2); margin-top: 6px; overflow-wrap: anywhere; }

/* reason */
.reason { margin-top: 20px; padding: 16px; border-radius: 16px; background: rgba(255,69,58,0.12); }
.reason-top { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: var(--rose); }
.reason-top svg { width: 18px; height: 18px; flex-shrink: 0; }
.reason p { margin-top: 8px; font-size: 16px; line-height: 1.45; color: var(--t1); overflow-wrap: anywhere; }

/* sections */
.sh { display: flex; align-items: baseline; justify-content: space-between; margin: 30px 16px 8px; }
.sh h2 { font-size: 13px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; color: var(--t2); }
.sh span { font-size: 13px; color: var(--t3); }
.sh span.req { color: var(--yellow); }
.sf { margin: 8px 16px 0; font-size: 13px; line-height: 1.4; color: var(--t2); }
.sf.warn { color: var(--rose); }

.group { background: var(--s1); border-radius: 16px; overflow: hidden; transition: box-shadow .25s ease; }
.group.invalid { box-shadow: 0 0 0 1.5px var(--rose); }

.row { position: relative; display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 16px; transition: background-color .2s ease; }
.row + .row::before { content: ''; position: absolute; top: 0; left: 16px; right: 0; height: 0.5px; background: var(--sep); }
.row .l { flex: 0 0 126px; font-size: 16px; color: var(--t1); }
.row.invalid { background: rgba(255,69,58,0.12); }
.row.invalid .l { color: var(--rose); }
.row input, .row select {
  flex: 1; min-width: 0; width: 100%; padding: 15px 0; background: none; border: 0; outline: 0; color: var(--t1);
  font: inherit; font-size: 16px; text-align: right; appearance: none; -webkit-appearance: none; border-radius: 0;
}
.row input::placeholder { color: var(--t3); }
.row input[type="date"] { min-height: 52px; }
.row select { text-align-last: right; padding-right: 20px; cursor: pointer; }
.row select.empty { color: var(--t3); }
option { background: var(--s2); color: var(--t1); }
.sel { position: relative; flex: 1; min-width: 0; display: flex; }
.sel::after { content: ''; position: absolute; right: 3px; top: 50%; width: 7px; height: 7px; pointer-events: none; border-right: 2px solid var(--t3); border-bottom: 2px solid var(--t3); transform: translateY(-70%) rotate(45deg); }
#confirmRow { display: none; }
#confirmRow.visible { display: flex; animation: rowIn .35s var(--ease) both; }

.ferr { display: flex; align-items: center; gap: 6px; padding: 8px 16px 10px; font-size: 13px; font-weight: 500; line-height: 1.35; color: var(--rose); }
.ferr svg { width: 14px; height: 14px; flex-shrink: 0; }
#coverErr { display: none; justify-content: center; padding-top: 12px; }

/* cover */
.cover-hero {
  position: relative; width: min(100%, 300px); aspect-ratio: 1 / 1; margin: 6px auto 0; border-radius: 22px; background: var(--s1); overflow: hidden; cursor: pointer;
  box-shadow: 0 18px 50px rgba(0,0,0,0.5), 0 0 0 0.5px rgba(255,255,255,0.08); transition: transform .3s var(--ease), box-shadow .25s ease;
}
.cover-hero:active { transform: scale(0.98); }
.cover-hero.invalid { box-shadow: 0 0 0 2px var(--rose), 0 18px 50px rgba(0,0,0,0.5); }
.cover-hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.cover-empty { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-align: center; padding: 20px; }
.cover-empty-icon { width: 44px; height: 44px; border-radius: 50%; background: var(--yellow); color: #000; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
.cover-empty-icon svg { width: 20px; height: 20px; }
.cover-empty-title { font-size: 17px; font-weight: 600; }
.cover-empty-sub { font-size: 13px; color: var(--t2); }
.cover-badge { position: absolute; top: 12px; right: 12px; padding: 4px 10px; border-radius: 999px; background: rgba(0,0,0,0.55); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); font-size: 12px; font-weight: 600; color: var(--t2); }
.cover-badge.req { color: var(--yellow); }
.cover-badge.new { color: var(--green); }
.cover-change { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); padding: 7px 16px; border-radius: 999px; background: rgba(28,28,30,0.7); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); font-size: 14px; font-weight: 600; }

/* tracks, audio */
.track { margin-bottom: 12px; }
.player { position: relative; padding: 12px 16px 14px; }
.player.has-err { background: rgba(255,69,58,0.12); }
.player.sep::before, .zone.sep::before { content: ''; position: absolute; top: 0; left: 16px; right: 0; height: 0.5px; background: var(--sep); }
.player-top { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.player-top:last-child { margin-bottom: 0; }
.player-meta { flex: 1; min-width: 0; }
.player-name { font-size: 16px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.player-sub { font-size: 13px; color: var(--t2); margin-top: 2px; line-height: 1.35; }
.player-replace { flex-shrink: 0; height: 32px; padding: 0 14px; border-radius: 999px; background: var(--fill); color: var(--blue); font-size: 14px; font-weight: 600; transition: transform .3s var(--ease); }
.player-replace:active { transform: scale(0.94); }
.player-replace.req { background: var(--yellow); color: #000; }
.player audio { width: 100%; height: 36px; color-scheme: dark; display: block; }
.zone { position: relative; display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 10px 16px; cursor: pointer; transition: background-color .2s ease; }
.zone:active { background: rgba(255,255,255,0.06); }
.zone.has-err { background: rgba(255,69,58,0.12); }
.zone-icon { width: 40px; height: 40px; border-radius: 10px; background: var(--s2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--t2); }
.zone.has-file .zone-icon { color: var(--yellow); }
.zone-icon svg { width: 20px; height: 20px; }
.zone-meta { flex: 1; min-width: 0; }
.zone-title { font-size: 16px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--blue); }
.zone-title.req { color: var(--yellow); }
.zone-title.has { color: var(--t1); }
.zone-sub { font-size: 13px; color: var(--t2); margin-top: 2px; line-height: 1.35; }
.zone-swap { font-size: 14px; font-weight: 500; color: var(--blue); flex-shrink: 0; }

/* credits */
details.fold { margin-bottom: 12px; }
details.fold summary { list-style: none; cursor: pointer; }
details.fold summary::-webkit-details-marker { display: none; }
details.fold summary .l { flex: 1; }
details.fold summary .opt { font-size: 14px; color: var(--t3); }
details.fold summary .opt.req { color: var(--yellow); }
details.fold summary::after { content: ''; width: 8px; height: 8px; margin-left: 4px; flex-shrink: 0; border-right: 2px solid var(--t3); border-bottom: 2px solid var(--t3); transform: rotate(-45deg); transition: transform .35s var(--ease); }
details.fold[open] summary::after { transform: rotate(45deg); }
.credit-row { position: relative; display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 14px 16px; }
.credit-row::before, .add-credit-btn::before { content: ''; position: absolute; top: 0; left: 16px; right: 0; height: 0.5px; background: var(--sep); }
.credit-row-num { font-size: 13px; font-weight: 500; color: var(--t2); align-self: center; }
.credit-remove { width: 26px; height: 26px; border-radius: 50%; background: var(--fill); display: flex; align-items: center; justify-content: center; color: var(--t2); transition: transform .3s var(--ease); }
.credit-remove:active { transform: scale(0.9); }
.credit-remove svg { width: 10px; height: 10px; }
.cr-full { grid-column: 1 / -1; }
.credit-input { width: 100%; padding: 11px 13px; border: 0; outline: 0; border-radius: 10px; background: var(--s2); color: var(--t1); font: inherit; font-size: 16px; appearance: none; -webkit-appearance: none; }
.credit-input::placeholder { color: var(--t3); }
.credit-input:focus { background: #3a3a3c; }
select.credit-input { padding-right: 32px; cursor: pointer; }
select.credit-input.empty { color: var(--t3); }
.csel-wrap { position: relative; }
.csel-wrap::after { content: ''; position: absolute; right: 14px; top: 50%; width: 7px; height: 7px; pointer-events: none; border-right: 2px solid var(--t3); border-bottom: 2px solid var(--t3); transform: translateY(-70%) rotate(45deg); }
.add-credit-btn { position: relative; display: flex; align-items: center; gap: 10px; width: 100%; min-height: 50px; padding: 0 16px; font-size: 16px; font-weight: 500; color: var(--yellow); text-align: left; transition: background-color .2s ease; }
.add-credit-btn:active { background: rgba(255,255,255,0.06); }
.add-credit-btn .plus { width: 22px; height: 22px; border-radius: 50%; background: var(--yellow); color: #000; display: flex; align-items: center; justify-content: center; }
.add-credit-btn .plus svg { width: 12px; height: 12px; }

/* dock */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 200; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: rgba(0,0,0,0.72); border-top: 0.5px solid var(--sep); -webkit-backdrop-filter: saturate(180%) blur(24px); backdrop-filter: saturate(180%) blur(24px); }
.dock-in { max-width: 640px; margin: 0 auto; }
#statusMsg { margin-bottom: 10px; text-align: center; font-size: 14px; font-weight: 500; line-height: 1.35; color: var(--t2); }
#statusMsg:empty { display: none; }
#statusMsg.error { color: var(--rose); }
.submit-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 52px; border-radius: 999px; background: var(--yellow); color: #000; font-size: 17px; font-weight: 600; transition: transform .3s var(--ease), opacity .2s ease; }
.submit-btn:active:not(:disabled) { transform: scale(0.98); }
.submit-btn:disabled { opacity: 0.5; cursor: default; }
.submit-btn svg { width: 17px; height: 17px; flex-shrink: 0; }
.spin { width: 17px; height: 17px; border: 2.5px solid rgba(0,0,0,0.2); border-top-color: #000; border-radius: 50%; animation: sp .7s linear infinite; }

/* states */
.loading { display: flex; align-items: center; justify-content: center; min-height: 60vh; }
.spinner { width: 28px; height: 28px; border: 3px solid var(--fill); border-top-color: var(--t1); border-radius: 50%; animation: sp .8s linear infinite; }
.state { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; min-height: 64vh; padding: 20px; }
.state-ico { width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 18px; background: var(--fill); }
.state-ico.ok { background: rgba(48,209,88,0.16); color: var(--green); }
.state-ico svg { width: 30px; height: 30px; }
.state-title { font-size: 22px; font-weight: 700; letter-spacing: -0.03em; }
.state-sub { font-size: 15px; line-height: 1.4; color: var(--t2); margin-top: 6px; max-width: 300px; }
.state-btn { margin-top: 22px; height: 44px; padding: 0 22px; border-radius: 999px; background: var(--fill); font-size: 16px; font-weight: 600; }

@keyframes sp { to { transform: rotate(360deg); } }
@keyframes rowIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
@media (max-width: 420px) { .row .l { flex-basis: 108px; font-size: 15px; } .hero h1 { font-size: 30px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>

const $ = (id) => document.getElementById(id);

const ymd = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');

const pick = (list, v) => { const s = String(v || '').trim().toLowerCase(); return list.find(o => o.toLowerCase() === s) || ''; };
const meetsAudio = (u) => /\.wav(\?|#|$)/i.test(String(u || ''));

const isCopyright = (c) => { const s = String(c || '').toLowerCase(); return s.includes('copyright') || s.includes('license'); };

  return isNaN(d.getTime()) ? '' : d.toISOString().slice(0, 10);
};
const toIsoOrEmpty = (v) => { if (!v) return ''; try { return new Date(v).toISOString(); } catch (e) { return v; } };

/* ───────── file checks (same rules as Upload Files) ───────── */
async function checkCover(file) {
  if (!/\.jpe?g$/i.test(file.name)) return 'Cover art must be a JPG file.';
  const v = new DataView(await file.arrayBuffer());
  if (v.byteLength < 4 || v.getUint16(0) !== 0xFFD8) return 'This is not a valid JPG file.';
  let p = 2;
  while (p + 4 <= v.byteLength) {
    if (v.getUint8(p) !== 0xFF) { p++; continue; }
    const m = v.getUint8(p + 1);
    if (m === 0xFF) { p++; continue; }
    if (m === 0xDA) break;
    if (m === 0xD8 || m === 0x01 || (m >= 0xD0 && m <= 0xD7)) { p += 2; continue; }
    const len = v.getUint16(p + 2);
    if (m >= 0xC0 && m <= 0xCF && m !== 0xC4 && m !== 0xC8 && m !== 0xCC) {
      const h = v.getUint16(p + 5), w = v.getUint16(p + 7), comps = v.getUint8(p + 9);
      if (w !== 4000 || h !== 4000) return `Cover art must be exactly 4000 × 4000 px. Yours is ${w} × ${h}.`;
      if (comps !== 3) return 'Cover art must be RGB. CMYK and grayscale images are not accepted.';
      return '';
    }
    p += 2 + len;
  }
  return 'Could not read this image. Please export it again as a JPG.';
}

async function checkWav(file) {
  const buf = await file.slice(0, 65536).arrayBuffer();
  const v = new DataView(buf);
  const tag = o => String.fromCharCode(v.getUint8(o), v.getUint8(o + 1), v.getUint8(o + 2), v.getUint8(o + 3));
  if (buf.byteLength < 12 || tag(0) !== 'RIFF' || tag(8) !== 'WAVE') return 'This is not a valid WAV file.';
  let pos = 12;
  while (pos + 8 <= buf.byteLength) {
    const id = tag(pos), size = v.getUint32(pos + 4, true);
    if (id === 'fmt ' && pos + 24 <= buf.byteLength) {
      const channels = v.getUint16(pos + 10, true);
      const rate = v.getUint32(pos + 12, true);
      const bits = v.getUint16(pos + 22, true);
      if (bits < 16) return 'Audio must be 16-bit or higher. Re-export at 16-bit or 24-bit.';
      if (rate < 44100) return 'Audio must be 44.1 kHz or higher. Re-export at 44.1 kHz or 48 kHz.';
      if (channels !== 2) return 'Audio must be stereo. Mono files are not accepted.';
      return '';
    }
    pos += 8 + size + (size % 2);
  }
  return 'Could not read this WAV file. Please re-export it and try again.';
}

function uploadToCloudinary(file, folder, onProgress) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open("POST", CLOUDINARY_URL, true);
    xhr.upload.onprogress = e => { if (e.lengthComputable && onProgress) onProgress(Math.round((e.loaded / e.total) * 100)); };
    xhr.onload = () => {
      try {
        const res = JSON.parse(xhr.responseText);
        if (xhr.status >= 200 && xhr.status < 300 && res.secure_url) resolve(res.secure_url);
        else reject(new Error(res.error?.message || "Upload failed. Check your connection and try again."));
      } catch (e) { reject(new Error("Upload failed. Check your connection and try again.")); }
    };
    xhr.onerror = () => reject(new Error("Network error during upload. Check your connection and try again."));
    const fd = new FormData();
    fd.append("file", file);
    fd.append("upload_preset", CLOUDINARY_PRESET);
    fd.append("folder", folder);
    xhr.send(fd);
  });
}

/* ───────── R2 AUDIO (private bucket, links come from our backend) ───────── */
const BACKEND_URL = "https://four44music-broadcast-backend.onrender.com";

async function uploadWavToR2(file, onProgress) {
  const user = auth.currentUser;
  if (!user) throw new Error("Please sign in again.");
  const token = await user.getIdToken();
  const res = await fetch(`${BACKEND_URL}/api/audio/upload-url`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
    body: JSON.stringify({ contentType: 'audio/wav', size: file.size })
  });
  const out = await res.json().catch(() => ({}));
  if (!res.ok || !out.success) throw new Error(out.message || 'Could not start the upload.');
  await new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('PUT', out.uploadUrl, true);
    xhr.setRequestHeader('Content-Type', 'audio/wav');
    xhr.upload.onprogress = e => { if (e.lengthComputable && onProgress) onProgress(Math.round((e.loaded / e.total) * 100)); };
    xhr.onload = () => (xhr.status >= 200 && xhr.status < 300) ? resolve() : reject(new Error(`Upload was refused (HTTP ${xhr.status}).`));
    xhr.onerror = () => reject(new Error('Network error during upload. Check your connection and try again.'));
    xhr.send(file);
  });
  return out.key;
}

// "r2:audio/..." files are private, so playing one needs a short-lived link from the backend.
const playUrlCache = {};
async function resolvePlayUrl(url) {
  if (!String(url).startsWith('r2:')) return url;
  if (playUrlCache[url]) return playUrlCache[url];
  const user = auth.currentUser;
  if (!user) return '';
  const token = await user.getIdToken();
  const res = await fetch(`${BACKEND_URL}/api/audio/play-url?key=${encodeURIComponent(url.slice(3))}`, {
    headers: { 'Authorization': `Bearer ${token}` }
  });
  const out = await res.json().catch(() => ({}));
  if (!res.ok || !out.success) return '';
  playUrlCache[url] = out.url;
  return out.url;
}

function clearMarks() { document.querySelectorAll('.invalid').forEach(x => x.classList.remove('invalid')); }

function wireView() {
  const view = $('view');

  view.addEventListener('click', (e) => {
    if (busy) return;
    clearMarks();
    const add = e.target.closest('[data-add]');
    if (add) {
      const type = add.dataset.add;
      S.credits[type].push({ name: '', role: '', ipi: '' });
      drawCredits(type);
      const rows = $('list-' + type).querySelectorAll('.credit-row');
      const inp = rows[rows.length - 1].querySelector('input');
      if (inp) inp.focus();
      return;
    }
    const rm = e.target.closest('[data-rm]');
    if (rm) {
      const [type, i] = rm.dataset.rm.split(':');
      S.credits[type].splice(Number(i), 1);
      drawCredits(type);
      return;
    }
    if (e.target.closest('#coverHero')) { coverInput.value = ''; coverInput.click(); return; }
    const zone = e.target.closest('[data-zone]');
    if (zone) {
      const key = zone.dataset.zone;
      if (key === 'license') { licenseInput.value = ''; licenseInput.click(); }
      else { audioTarget = Number(key.split(':')[1]); audioInput.value = ''; audioInput.click(); }
    }
  });

  const onEdit = (e) => {
    const t = e.target;
    if (e.type === 'input') { clearMarks(); setStatus(''); }
    if (t.tagName === 'SELECT' && t.id) t.classList.toggle('empty', t.value === '');
    if (t.id === 'copyright') {
      const changed = t.value.trim() !== (data.copyright || '').trim();
      $('confirmRow').classList.toggle('visible', changed);
      if (!changed) $('copyrightConfirm').value = '';
    }
    if (t.id === 'releaseDate' && e.type === 'change' && t.value && t.value < S.minDate) t.value = '';
    const row = t.closest && t.closest('.credit-row');
    if (row && t.dataset.f) {
      const type = row.dataset.type, i = Number(row.dataset.i);
      if (S.credits[type][i]) S.credits[type][i][t.dataset.f] = t.value;
      if (t.tagName === 'SELECT') t.classList.toggle('empty', t.value === '');
      updateCount(type);
    }
  };
  view.addEventListener('input', onEdit);
  view.addEventListener('change', onEdit);
}

async function pickAudio(i, file) {
  const t = S.tracks[i];
  const ext = file.name.split('.').pop().toLowerCase();
  let problem = '';
  if (ext !== 'wav') problem = `.${ext} files are not accepted. Please select a WAV file only.`;
  else if (file.size > 100 * 1024 * 1024) problem = 'File exceeds the 100 MB limit.';
  else problem = await checkWav(file);
  if (problem) { t.error = problem; drawTrackAudio(i); return; }
  if (t.preview) URL.revokeObjectURL(t.preview);
  t.file = file; t.preview = URL.createObjectURL(file); t.error = ''; t.newUrl = null;
  drawTrackAudio(i);
}

async function pickCover(file) {
  const c = S.cover;
  let problem = await checkCover(file);
  if (!problem && file.size > 40 * 1024 * 1024) problem = 'Cover art is too large. Keep it under 40 MB.';
  if (problem) { c.error = problem; drawCover(); return; }
  if (c.preview) URL.revokeObjectURL(c.preview);
  c.file = file; c.preview = URL.createObjectURL(file); c.error = ''; c.newUrl = null;
  drawCover();
}

function pickLicense(file) {
  if (!/\.pdf$/i.test(file.name)) { S.license.error = 'Only PDF files are accepted.'; drawLicense(); return; }
  S.license.file = file; S.license.error = ''; S.license.newUrl = null;
  drawLicense();
}

  return {
    artistName: val('artistName').trim(), releaseTitle: val('releaseTitle').trim(),
    genre: val('genre'), language: val('language'), explicit: val('explicit'), releaseDate: val('releaseDate'),

// Renaming the artist also renames the Main artist on every track,
// because the track data is what gets sent to the distributor.
function computeRename(newName) {
  if (newName === (data.artistName || '').trim()) return { map: {} };
  const mains = [];
  S.tracks.forEach(t => (Array.isArray(t.orig.artists) ? t.orig.artists : []).forEach(a => {
    if (a && a.type === 'main' && a.name && !mains.some(n => n.toLowerCase() === a.name.toLowerCase())) mains.push(a.name);
  }));
  if (!mains.length) return { map: {} };
  if (mains.length === 1) return { map: { [mains[0].toLowerCase()]: newName } };
  const parts = newName.split(',').map(s => s.trim()).filter(Boolean);
  if (parts.length !== mains.length) return { error: `This release has ${mains.length} main artists. Keep ${mains.length} names separated by commas.` };
  const map = {};
  mains.forEach((n, i) => { map[n.toLowerCase()] = parts[i]; });
  return { map };
}

const named = (arr) => arr.filter(c => c.name.trim());

function validateFix() {
  if (S.cover.required && !S.cover.file) return { msg: S.cover.url ? "Your current cover isn't a JPG. Please upload a 4000 × 4000 JPG." : 'Cover art is required.', el: 'coverHero' };
  for (let i = 0; i < S.tracks.length; i++) {
    if (S.tracks[i].required && !S.tracks[i].file) return { msg: S.isSingle ? 'Please choose a WAV file.' : `Please choose a WAV file for track ${i + 1}.`, el: 'trkAudio-' + i };
  }
  const f = readFields();
  if (!S.isSingle) {
    const bad = f.trackTitles.findIndex(t => !t);
    if (bad >= 0) return { msg: `Track ${bad + 1} needs a title.`, el: 'trkTitle-' + bad };
  }
  if (!f.artistName) return { msg: 'Artist name is required.', el: 'artistName' };
  const rename = computeRename(f.artistName);
  if (rename.error) return { msg: rename.error, el: 'artistName' };
  if (!f.releaseTitle) return { msg: 'Release title is required.', el: 'releaseTitle' };
  if (!f.genre) return { msg: 'Please select a genre.', el: 'genre' };
  if (!f.language) return { msg: 'Please select a language.', el: 'language' };
  if (!f.releaseDate) return { msg: 'Please choose a release date.', el: 'releaseDate' };
  if (f.releaseDate < S.minDate) return { msg: 'The earliest release date is 3 days from today.', el: 'releaseDate' };
  if (!f.copyright) return { msg: 'Please enter the copyright holder.', el: 'copyright' };
  if (f.copyright !== (data.copyright || '').trim()) {
    if (!f.copyrightConfirm) return { msg: 'Please type the copyright holder again to confirm it.', el: 'copyrightConfirm' };
    if (f.copyright !== f.copyrightConfirm) return { msg: "The two copyright holder entries don't match.", el: 'copyrightConfirm' };
  }
  if (!named(S.credits.producer).length) return { msg: 'Please add at least one producer.', el: 'fold-producer', fold: 'producer' };
  const writers = named(S.credits.writer);
  if (!writers.length) return { msg: 'Please add at least one songwriter.', el: 'fold-writer', fold: 'writer' };
  const isLyric = w => /lyric|author|word/.test((w.role || '').toLowerCase());
  const isComp  = w => /compos|music|melod/.test((w.role || '').toLowerCase());
  if (!writers.some(w => isLyric(w) || !isComp(w))) return { msg: 'Add at least one lyricist or songwriter.', el: 'fold-writer', fold: 'writer' };
  if (!writers.some(w => isComp(w) || !isLyric(w))) return { msg: 'Add at least one composer or songwriter.', el: 'fold-writer', fold: 'writer' };
  if (!named(S.credits.publishing).length) return { msg: 'Please add at least one publisher.', el: 'fold-publishing', fold: 'publishing' };
  return null;
}

function validateLicense() {
  if (!S.license.file) return { msg: 'Please upload your license / proof document.', el: 'licenseGroup' };
  return null;
}

function showProblem(p) {
  setStatus(p.msg);
  if (p.fold) $('fold-' + p.fold).open = true;
  const el = $(p.el);
  if (!el) return;
  clearMarks();
  const host = el.closest('.row') || el.closest('.group') || el;
  host.classList.add('invalid');
  host.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

/* ───────── admin email (same endpoint and field names as before) ───────── */
function fmtCreditList(list) {
  if (!Array.isArray(list)) return "None";
  const filtered = list.filter(c => c && c.name && c.name.trim());
  if (!filtered.length) return "None";
  return filtered.map(c => {
    let line = `• ${c.name}`;
    if (c.role) line += ` — ${c.role}`;
    if (c.ipi)  line += ` (IPI: ${c.ipi})`;
    return line;
  }).join("\n");
}

function featuringText(d) {
  const label = { featured: 'Featured', secondary: 'Secondary' };
  const lines = [];
  (Array.isArray(d.audioFiles) ? d.audioFiles : []).forEach((t, i) => {
    const others = (Array.isArray(t.artists) ? t.artists : []).filter(a => a && a.type !== 'main' && a.name);
    if (others.length) lines.push(`Track ${i + 1}${t.title ? ' — ' + t.title : ''}: ` + others.map(a => `${a.name} (${label[a.type] || a.type})`).join(', '));
  });
  if (lines.length) return lines.join('\n');
  if (Array.isArray(d.featuredArtists) && d.featuredArtists.some(f => f && f.name)) {
    return d.featuredArtists.filter(f => f && f.name).map(f => `${f.name}${f.role ? ' (' + f.role + ')' : ''}${f.url && f.url.trim() ? ' — ' + f.url : ''}`).join("\n");
  }
  return d.featuring && String(d.featuring).trim() ? String(d.featuring).trim() : "None";
}

async function notifyAdmin(d, kind, licenseUrl) {
  const credits = d.credits || {};
  const audioFiles = (Array.isArray(d.audioFiles) ? d.audioFiles : [])
    .map(m => ({ title: m.title || d.releaseTitle || "", url: m.url || "" })).filter(m => m.url);
  const body = {
    type: "resubmission",
    submissionId: d._id,
    is_resend: true,
    email: d.email || "",
    artist_name: d.artistName || "",
    release_title: d.releaseTitle || "",
    featuring: featuringText(d),
    release_type: d.releaseType || "",
    genre: d.genre || "",
    language: d.language || "Not specified",
    release_date: d.releaseDate || "Not set",
    explicit: d.explicit || "",
    country: d.country || "",
    phone: d.phone || "Not provided",
    label: d.label || "Independent",
    copyright: d.copyright || "Not provided",
    isrc: d.isrc || "Not provided",
    upc: d.upc || "Auto-assign",
    catalog_number: d.catalogNumber || "Not provided",
    version: d.version || "",
    previously_released: d.previouslyReleased || "",
    previous_release_date: d.previousReleaseDate || "N/A",
    vocal_type: d.vocalType || "",
    ownership_confirmed: d.ownershipConfirmed === true ? "Yes — confirmed original work" : "Not confirmed",
    producers: fmtCreditList(credits.producer),
    musicians: fmtCreditList(credits.musician),
    songwriters: fmtCreditList(credits.writer),
    publishers: fmtCreditList(credits.publishing),
    lyrics: d.lyrics || "Not provided",
    payment_status: String(d.paid || '').toLowerCase() === 'paid' ? 'Paid' : 'Not confirmed',
    category: (d.rejectionCategory || "Other").toString().trim(),
    previous_reason: (d.rejectionReason || "").toString().trim(),
    fix_kind: kind,
    ...(licenseUrl ? { fix_license_url: licenseUrl } : {}),
    cover_url: d.officialCoverURL || d.coverURL || "",
    audio_files: audioFiles,
    status: "Review",
    submitted_at: new Date().toString(),
  };
  try {
    const res = await fetch(NOTIFY_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-app-secret": APP_SECRET },
      body: JSON.stringify(body),
    });
    const text = await res.text();
    console.log("[Notify resubmit] status=", res.status, "body=", text);
    return { ok: res.ok, status: res.status };
  } catch (e) {
    console.error("[Notify resubmit] ERROR:", e);
    return { ok: false, status: 0 };
  }
}

/* ───────── submit ───────── */
async function submitLicense() {
  const L = S.license;
  if (!L.newUrl) {
    setBtn('Uploading…');
    L.newUrl = await uploadToCloudinary(L.file, 'license-proofs', p => setBtn(`Uploading… ${p}%`));
  }
  await updateDoc(doc(db, "submissions", data._id), {
    status: "Review",
    rejectionReason: deleteField(),
    rejectionCategory: deleteField(),
    resubmittedAt: serverTimestamp(),
    licenseURL: L.newUrl,
  });
  return notifyAdmin(data, "license", L.newUrl);
}

async function submitFix() {
  const f = readFields();
  const rename = computeRename(f.artistName).map;

  // Upload only what was replaced. Finished uploads are kept, so a retry doesn't repeat them.
  if (S.cover.file && !S.cover.newUrl) {
    setBtn('Uploading cover…');
    S.cover.newUrl = await uploadToCloudinary(S.cover.file, 'covers', p => setBtn(`Uploading cover… ${p}%`));
  }
  for (let i = 0; i < S.tracks.length; i++) {
    const t = S.tracks[i];
    if (t.file && !t.newUrl) {
      const label = S.isSingle ? 'audio' : `track ${i + 1}`;
      setBtn(`Uploading ${label}…`);
      t.newUrl = 'r2:' + await uploadWavToR2(t.file, p => setBtn(`Uploading ${label}… ${p}%`));
    }
  }

  // audioFiles is what gets sent to the distributor, so the new files and edits must land here.
  const audioFiles = S.tracks.map((t, i) => {
    const o = { ...t.orig };
    o.title = S.isSingle ? f.releaseTitle : f.trackTitles[i];
       o.url = t.newUrl || t.url;
    if (String(o.url).startsWith('r2:')) o.key = o.url.slice(3); else delete o.key;
    if (Array.isArray(t.orig.artists)) {
      o.artists = t.orig.artists.filter(Boolean).map(a => {
        const n = a.type === 'main' && a.name ? rename[a.name.toLowerCase()] : null;
        return n ? { ...a, name: n } : { ...a };
      });
    }
    return o;
  });

  const trim = (arr, withIpi) => named(arr).map(c => withIpi ? { name: c.name.trim(), role: c.role || '', ipi: (c.ipi || '').trim() } : { name: c.name.trim(), role: c.role || '' });
  const old = data.credits || {};
  const credits = {
    ...old,
    producer: trim(S.credits.producer),
    musician: Array.isArray(old.musician) ? old.musician : [],
    writer: trim(S.credits.writer, true),
    publishing: trim(S.credits.publishing),
  };

  const payload = {
    status: "Review",
    rejectionReason: deleteField(),
    rejectionCategory: deleteField(),
    resubmittedAt: serverTimestamp(),
    artistName: f.artistName, releaseTitle: f.releaseTitle,
    genre: f.genre, language: f.language, explicit: f.explicit,
    copyright: f.copyright, credits, audioFiles,
  };
  if (f.releaseDate !== S.origDate) payload.releaseDate = toIsoOrEmpty(f.releaseDate);
  if (S.cover.newUrl) Object.assign(payload, { resubmittedCoverURL: S.cover.newUrl, coverURL: S.cover.newUrl, officialCoverURL: S.cover.newUrl });
  const firstNew = S.tracks.find(t => t.newUrl);
  if (firstNew) payload.resubmittedAudioURL = firstNew.newUrl;

  setBtn('Saving…');
  await updateDoc(doc(db, "submissions", data._id), payload);

  const merged = { ...data, artistName: f.artistName, releaseTitle: f.releaseTitle, genre: f.genre, language: f.language, explicit: f.explicit, copyright: f.copyright, credits, audioFiles };
  if (payload.releaseDate) merged.releaseDate = payload.releaseDate;
  if (S.cover.newUrl) { merged.coverURL = S.cover.newUrl; merged.officialCoverURL = S.cover.newUrl; }
  return notifyAdmin(merged, "audio_and_cover");
}

async function submit() {
  if (busy) return;
  setStatus('');
  const problem = S.copyrightMode ? validateLicense() : validateFix();
  if (problem) { showProblem(problem); return; }

  busy = true;
  const btn = $('submitBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span><span id="submitLabel">Submitting…</span>';
  try {
    const result = S.copyrightMode ? await submitLicense() : await submitFix();
    sessionStorage.removeItem("rejectionFixData");
    $('view').style.display = 'none';
    $('dock').style.display = 'none';
    $('successState').style.display = 'flex';
    if (!result.ok) {
      $('successSub').textContent = `Your fix was saved, but we couldn't reach the admin notification service (status ${result.status}). The team may not see it until that's checked.`;
    }
    setTimeout(() => { window.location.href = "releases.html"; }, result.ok ? 1400 : 3200);
  } catch (e) {
    console.error("[Resubmit] ERROR:", e);
    busy = false;
    btn.disabled = false;
    btn.innerHTML = SUBMIT_HTML;
    setStatus(e.message || 'Something went wrong saving your fix. Please try again.');
  }
}

$('submitBtn').addEventListener('click', submit);

/* ───────── start ───────── */
onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href = "login.html"; return; }
  await loadData();
  if (!data || !data._id) { showState('Release not found', "We couldn't find this release. Go back and try again."); return; }
  const status = String(data.status || '').trim().toLowerCase();
  if (status && status !== 'rejected') { showState('Nothing to fix', "This release isn't waiting for changes right now."); return; }
  buildState();
  renderPage();
  if (!$('view').dataset.wired) { wireView(); $('view').dataset.wired = '1'; }
});
</script>
