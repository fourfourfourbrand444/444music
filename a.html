<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Release Submitted — 444Music</title>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --bg: #000000;
  --s1: #1c1c1e;
  --s2: #2c2c2e;
  --sep: rgba(84,84,88,0.55);
  --fill: rgba(120,120,128,0.24);
  --t1: #ffffff;
  --t2: rgba(235,235,245,0.60);
  --t3: rgba(235,235,245,0.30);
  --blue: #0a84ff;
  --yellow: #fdeb0d;
  --green: #30d158;
  --ease: cubic-bezier(0.32, 0.72, 0, 1);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Helvetica Neue", Roboto, Arial, sans-serif;
}

html { color-scheme: dark; -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font); background: var(--bg); color: var(--t1);
  min-height: 100vh; letter-spacing: -0.01em; -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; color: inherit; background: none; border: none; cursor: pointer; }
a { color: var(--blue); text-decoration: none; }

.shell { max-width: 480px; margin: 0 auto; padding: 56px 16px calc(170px + env(safe-area-inset-bottom)); text-align: center; }

/* status */
.status { display: inline-flex; align-items: center; gap: 8px; animation: rise .6s var(--ease) both; }
.status-dot { width: 26px; height: 26px; border-radius: 50%; background: var(--green); color: #000; display: flex; align-items: center; justify-content: center; }
.status-dot svg { width: 14px; height: 14px; }
.status span { font-size: 17px; font-weight: 600; color: var(--green); }

/* cover */
.cover-frame {
  width: min(220px, 62vw); aspect-ratio: 1 / 1; margin: 28px auto 26px; border-radius: 20px; overflow: hidden;
  background: var(--s1); display: flex; align-items: center; justify-content: center;
  box-shadow: 0 22px 60px rgba(0,0,0,0.6), 0 0 0 0.5px rgba(255,255,255,0.08);
  animation: rise .7s .08s var(--ease) both;
}
.cover-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cover-frame svg { width: 40px; height: 40px; color: var(--t3); }
.skeleton { background: linear-gradient(90deg, var(--s1) 25%, var(--s2) 50%, var(--s1) 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

/* titles */
h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.15; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; animation: rise .7s .14s var(--ease) both; }
.artist-line { margin-top: 4px; min-height: 22px; font-size: 17px; color: var(--t2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; animation: rise .7s .18s var(--ease) both; }

/* date row */
.group { margin-top: 28px; background: var(--s1); border-radius: 16px; overflow: hidden; text-align: left; animation: rise .7s .24s var(--ease) both; }
.date-row { display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 10px 16px; }
.date-text { flex: 1; min-width: 0; }
.date-label { font-size: 13px; color: var(--t2); }
.date-value { margin-top: 1px; font-size: 17px; font-weight: 500; }
.date-chip { flex-shrink: 0; padding: 4px 12px; border-radius: 999px; background: rgba(253,235,13,0.14); color: var(--yellow); font-size: 14px; font-weight: 600; }

.note { margin: 18px 16px 0; font-size: 15px; line-height: 1.45; color: var(--t2); animation: rise .7s .3s var(--ease) both; }

/* dock */
.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 200;
  padding: 12px 16px calc(10px + env(safe-area-inset-bottom));
  background: rgba(0,0,0,0.72); border-top: 0.5px solid var(--sep);
  -webkit-backdrop-filter: saturate(180%) blur(24px); backdrop-filter: saturate(180%) blur(24px);
}
.dock-in { max-width: 480px; margin: 0 auto; }
.btn {
  display: flex; align-items: center; justify-content: center; width: 100%; height: 52px;
  border-radius: 999px; background: var(--yellow); color: #000; font-size: 17px; font-weight: 600;
  transition: transform .3s var(--ease);
}
.btn:active { transform: scale(0.98); }
.link-row { display: block; margin-top: 2px; padding: 11px 0; text-align: center; font-size: 17px; }
.link-row:active { opacity: 0.6; }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<div class="shell">

  <div class="status">
    <div class="status-dot">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <span>Submitted</span>
  </div>

  <div class="cover-frame skeleton" id="coverFrame"></div>

  <h1 id="releaseTitleEl">Loading…</h1>
  <p class="artist-line" id="artistLineEl">&nbsp;</p>

  <div class="group">
    <div class="date-row">
      <div class="date-text">
        <div class="date-label">Release date</div>
        <div class="date-value" id="releaseDateEl">—</div>
      </div>
      <div class="date-chip" id="countdownChip" style="display:none;"></div>
    </div>
  </div>

  <p class="note">Your release is in and under review. We'll notify you once it goes live.</p>

</div>

<div class="dock">
  <div class="dock-in">
    <button class="btn" type="button" onclick="window.location.href='wey.html'">Go to dashboard</button>
    <a class="link-row" href="wey.html">View all my releases</a>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
import { getFirestore, collection, query, where, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey:            "AIzaSyBzUD7avh7vJfeSMRl2o9F09_qd-pl0dSg",
  authDomain:        "usersubmissionsportal.firebaseapp.com",
  projectId:         "usersubmissionsportal",
  storageBucket:     "usersubmissionsportal.firebasestorage.app",
  messagingSenderId: "734783502459",
  appId:             "1:734783502459:web:cfa2cc5de6976003b24ade"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

function escHtml(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

const COVER_PLACEHOLDER = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>`;

// Pulls the release this person just submitted — cover art comes from
// the upload step, title/artist/date come from the release-info step;
// both were saved together on the same Firestore submission doc.
async function fetchLatestSubmission(uid) {
  try {
    const q = query(
      collection(db, "submissions"),
      where("userId", "==", uid),
      orderBy("createdAt", "desc"),
      limit(1)
    );
    const snap = await getDocs(q);
    if (!snap.empty) return snap.docs[0].data();
    return null;
  } catch (e) {
    // Fallback if a composite index isn't available yet — pick the
    // most recent one client-side instead.
    try {
      const q2 = query(collection(db, "submissions"), where("userId", "==", uid));
      const snap2 = await getDocs(q2);
      if (snap2.empty) return null;
      let latest = null;
      snap2.forEach(d => {
        const v = d.data();
        if (!latest || (v.createdAt || 0) > (latest.createdAt || 0)) latest = v;
      });
      return latest;
    } catch (e2) {
      console.error(e2);
      return null;
    }
  }
}

function countdownLabel(releaseDateStr) {
  if (!releaseDateStr) return null;
  const releaseDate = new Date(releaseDateStr);
  if (isNaN(releaseDate.getTime())) return null;
  const now = new Date();
  const startOfToday   = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const startOfRelease = new Date(releaseDate.getFullYear(), releaseDate.getMonth(), releaseDate.getDate());
  const diffDays = Math.round((startOfRelease - startOfToday) / (1000 * 60 * 60 * 24));
  if (diffDays > 1) return `In ${diffDays} days`;
  if (diffDays === 1) return `Tomorrow`;
  if (diffDays === 0) return `Today`;
  return `Live`;
}

function renderOverview(data) {
  const coverFrame = document.getElementById('coverFrame');
  coverFrame.classList.remove('skeleton');
  coverFrame.innerHTML = data.coverURL
    ? `<img src="${escHtml(data.coverURL)}" alt="Cover art">`
    : COVER_PLACEHOLDER;

  document.getElementById('releaseTitleEl').textContent = data.releaseTitle || 'Untitled Release';
  const featuring = data.featuring && data.featuring.trim() ? ` ft. ${data.featuring}` : '';
  document.getElementById('artistLineEl').textContent = (data.artistName || 'Unknown Artist') + featuring;

  const releaseDateEl = document.getElementById('releaseDateEl');
  if (data.releaseDate) {
    const d = new Date(data.releaseDate);
    releaseDateEl.textContent = isNaN(d.getTime())
      ? 'Not set'
      : d.toLocaleDateString('en-GB', { day: '2-digit', month: 'long', year: 'numeric' });
    const cd = countdownLabel(data.releaseDate);
    if (cd) {
      const chip = document.getElementById('countdownChip');
      chip.textContent = cd;
      chip.style.display = 'inline-block';
    }
  } else {
    releaseDateEl.textContent = 'Not set';
  }
}

function renderEmptyState() {
  const coverFrame = document.getElementById('coverFrame');
  coverFrame.classList.remove('skeleton');
  coverFrame.innerHTML = COVER_PLACEHOLDER;
  document.getElementById('releaseTitleEl').textContent = 'Release Submitted';
  document.getElementById('artistLineEl').textContent = '';
  document.getElementById('releaseDateEl').textContent = '—';
}

onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href = "login.html"; return; }
  const data = await fetchLatestSubmission(user.uid);
  if (data) renderOverview(data); else renderEmptyState();
});
</script>
</body>
</html>
