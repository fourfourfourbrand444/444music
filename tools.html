<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tools</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #000; --card: #1c1c1e; --fill: rgba(118,118,128,.24); --sep: #38383a;
  --text: #f2f2f7; --text2: #98989d; --blue: #0a84ff; --red: #ff453a;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Roboto, "Segoe UI", Arial, sans-serif;
}
html { -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; }
body { font-family: var(--font); background: var(--bg); color: var(--text); line-height: 1.4; min-height: 100vh; }
a { color: inherit; text-decoration: none; }
button, input { font-family: inherit; }

/* top area */
.top { position: sticky; top: 0; z-index: 10; background: rgba(0,0,0,.78); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); }
.top-in { max-width: 960px; margin: 0 auto; padding: 14px 16px 10px; }
h1 { font-size: 34px; font-weight: 700; letter-spacing: -.02em; margin-bottom: 10px; }
.search { position: relative; }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text2); pointer-events: none; }
.search input {
  width: 100%; height: 36px; border: none; border-radius: 10px; background: var(--fill); color: var(--text);
  font-size: 17px; padding: 0 34px 0 34px; outline: none; -webkit-appearance: none; appearance: none;
}
.search input::placeholder { color: var(--text2); }
.search input::-webkit-search-cancel-button { display: none; }
.clear { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; border: none; border-radius: 50%; background: var(--text2); color: #000; font-size: 11px; line-height: 18px; cursor: pointer; display: none; padding: 0; }
.clear.on { display: block; }
.chips-row { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0 2px; scrollbar-width: none; }
.chips-row::-webkit-scrollbar { display: none; }
.pill { flex: 0 0 auto; border: none; border-radius: 999px; background: var(--card); color: var(--text); font-size: 14px; font-weight: 500; padding: 7px 15px; cursor: pointer; transition: background .2s, color .2s; }
.pill.on { background: #fff; color: #000; }

/* content */
main { max-width: 960px; margin: 0 auto; padding: 4px 16px 56px; }
section { margin-top: 22px; }
h2 { font-size: 13px; font-weight: 400; color: var(--text2); margin: 0 6px 8px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.card { background: var(--card); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; }
.head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.tile { width: 44px; height: 44px; border-radius: 11px; display: grid; place-items: center; color: #fff; font-size: 19px; flex-shrink: 0; }
.c-artwork { background: #ff375f; } .c-audio { background: #ff9f0a; } .c-growth { background: #30d158; }
.c-royalties { background: #0a84ff; } .c-management { background: #636366; } .c-danger { background: var(--red); }
.card h3 { font-size: 17px; font-weight: 600; letter-spacing: -.01em; line-height: 1.25; }
.note { font-size: 12px; color: var(--text2); margin-top: 1px; }
.card p { font-size: 14px; color: var(--text2); line-height: 1.5; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.tags span { font-size: 12px; color: var(--text2); background: var(--fill); border-radius: 999px; padding: 3px 10px; }
.foot { margin-top: auto; padding-top: 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.btn { display: inline-flex; align-items: center; justify-content: center; height: 32px; padding: 0 20px; border-radius: 999px; background: var(--blue); color: #fff; font-size: 15px; font-weight: 600; transition: opacity .15s; }
.btn:active { opacity: .7; }
.btn.red { background: rgba(255,69,58,.16); color: var(--red); }
.warn { font-size: 12px; color: var(--text2); line-height: 1.45; margin-top: 12px; }
.empty { display: none; text-align: center; color: var(--text2); font-size: 15px; padding: 70px 16px; }
.empty.on { display: block; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
@media (max-width: 640px) { .grid { grid-template-columns: 1fr; } h1 { font-size: 30px; } }
</style>
</head>
<body>

<div class="top">
  <div class="top-in">
    <h1>Tools</h1>
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search" aria-label="Search tools" autocomplete="off">
      <button class="clear" id="clear" type="button" aria-label="Clear search">&#10005;</button>
    </div>
    <div class="chips-row" id="chips"></div>
  </div>
</div>

<main>
  <div id="list"></div>
  <div class="empty" id="empty"></div>
</main>

<script>
var SECTIONS = [
  { id: 'artwork', name: 'Artwork' },
  { id: 'audio', name: 'Audio' },
  { id: 'growth', name: 'Growth' },
  { id: 'royalties', name: 'Royalties' },
  { id: 'management', name: 'Account' }
];

var TOOLS = [
  { cat: 'artwork', icon: 'fa-image', title: 'Cover Art Generator',
    desc: 'Design album and single cover art that meets streaming platform requirements. No design experience needed.',
    tags: ['3000×3000 output', 'Templates', 'PNG and JPG'],
    href: 'https://www.postermywall.com/index.php/sizes/cover-art/album-cover-maker', btn: 'Open', ext: true },
  { cat: 'artwork', icon: 'fa-expand', title: '3000px Image Resizer',
    desc: 'Convert your cover art to the 3000×3000 pixel size that streaming stores require.',
    tags: ['Exact size', 'Drag and drop'],
    href: 'https://www.imageresizer.work/resize-image-to-3000x3000', btn: 'Convert', ext: true },

  { cat: 'audio', icon: 'fa-sliders', title: 'Audio Mastering',
    desc: 'Improve loudness, clarity and balance so your track sounds right on every platform.',
    tags: ['Loudness', 'AI mastering', 'WAV output'],
    href: 'https://majordecibel.com/', btn: 'Open', ext: true },
  { cat: 'audio', icon: 'fa-arrows-rotate', title: 'Audio Format Converter',
    desc: 'Turn MP3, AAC and AIFF files into WAV or FLAC, the formats needed for distribution.',
    tags: ['MP3 to WAV', 'Batch convert'],
    href: 'https://www.freeconvert.com/mp3-converter', btn: 'Convert', ext: true },

  { cat: 'growth', icon: 'fa-calculator', title: 'Royalty Calculator',
    desc: 'Estimate what your streams could earn on Spotify, Apple Music, Tidal and YouTube Music before you release.',
    tags: ['Enter streams', 'Pick platforms', 'See estimate'],
    href: 'https://www.royalties-calculator.com/', btn: 'Calculate', ext: true },
  { cat: 'growth', icon: 'fa-calendar-days', title: 'Release Planner',
    desc: 'Plan your release with a timeline, pre-save setup and rollout schedule to get a strong first week.',
    tags: ['Pre-save', 'Checklist', 'Playlist pitching'],
    href: 'https://cyberprmusic.com/music-release-plan/', btn: 'Plan', ext: true },
  { cat: 'growth', icon: 'fa-user-plus', title: 'Referral Program',
    desc: 'Invite other artists to 444Music and earn a reward for every successful signup. There is no cap.',
    tags: ['Instant rewards', 'No cap'],
    href: 'https://wa.me/233530399523', btn: 'Join', ext: true },

  { cat: 'royalties', icon: 'fa-chart-pie', title: 'Royalty Split Dashboard',
    desc: 'See your earnings and split percentage, set your payout method and request withdrawals.',
    tags: ['Your split', 'Earnings', 'Withdrawals'],
    href: 'contributor.html', btn: 'Open', note: 'Invite only' },

  { cat: 'management', icon: 'fa-barcode', title: 'ISRC Code',
    desc: 'Get an ISRC code for your recording. Sign in or create an account to continue.',
    tags: ['Recording ID', 'Required by stores'],
    href: 'https://distrofinder.org/signin', btn: 'Get code', ext: true },
  { cat: 'management', icon: 'fa-user-check', title: 'Claim Artist Profile',
    desc: 'A step-by-step guide to claim your artist page on Spotify, Apple Music and Amazon Music.',
    tags: ['Spotify for Artists', 'Apple Music', 'Amazon Music'],
    href: 'https://wa.me/233530399523', btn: 'Get guide', ext: true },
  { cat: 'management', icon: 'fa-trash-can', title: 'Song Takedown',
    desc: 'Request removal of a release from all platforms. Full removal takes 5 to 14 business days.',
    tags: ['All platforms', 'Confirmation email'],
    href: 'takedown.html', btn: 'Request', danger: true,
    warn: 'This permanently removes your release and cannot be undone. Download your analytics and confirm pending royalties first.' }
];

var state = { q: '', cat: 'all' };
var list = document.getElementById('list');
var chipsEl = document.getElementById('chips');
var input = document.getElementById('q');
var clearBtn = document.getElementById('clear');
var emptyEl = document.getElementById('empty');

function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

function cardHtml(t) {
  var tile = t.danger ? 'c-danger' : 'c-' + t.cat;
  var link = 'href="' + esc(t.href) + '"' + (t.ext ? ' target="_blank" rel="noopener noreferrer"' : '');
  return '<article class="card" data-search="' + esc((t.title + ' ' + t.desc + ' ' + t.tags.join(' ')).toLowerCase()) + '">' +
    '<div class="head"><div class="tile ' + tile + '"><i class="fa-solid ' + t.icon + '"></i></div>' +
    '<div><h3>' + esc(t.title) + '</h3>' + (t.note ? '<div class="note">' + esc(t.note) + '</div>' : '') + '</div></div>' +
    '<p>' + esc(t.desc) + '</p>' +
    '<div class="tags">' + t.tags.map(function (g) { return '<span>' + esc(g) + '</span>'; }).join('') + '</div>' +
    (t.warn ? '<div class="warn">' + esc(t.warn) + '</div>' : '') +
    '<div class="foot"><a class="btn' + (t.danger ? ' red' : '') + '" ' + link + '>' + esc(t.btn) + '</a></div>' +
    '</article>';
}

list.innerHTML = SECTIONS.map(function (s) {
  var items = TOOLS.filter(function (t) { return t.cat === s.id; });
  return '<section data-cat="' + s.id + '"><h2>' + esc(s.name) + '</h2><div class="grid">' + items.map(cardHtml).join('') + '</div></section>';
}).join('');

chipsEl.innerHTML = [{ id: 'all', name: 'All' }].concat(SECTIONS).map(function (s) {
  return '<button type="button" class="pill' + (s.id === 'all' ? ' on' : '') + '" data-c="' + s.id + '">' + esc(s.name) + '</button>';
}).join('');

function apply() {
  var q = state.q.trim().toLowerCase();
  var total = 0;
  Array.prototype.forEach.call(list.querySelectorAll('section'), function (sec) {
    var catOk = state.cat === 'all' || sec.dataset.cat === state.cat;
    var shown = 0;
    Array.prototype.forEach.call(sec.querySelectorAll('.card'), function (c) {
      var ok = catOk && (!q || c.dataset.search.indexOf(q) !== -1);
      c.style.display = ok ? '' : 'none';
      if (ok) shown++;
    });
    sec.style.display = shown ? '' : 'none';
    total += shown;
  });
  emptyEl.textContent = total ? '' : (q ? 'No results for \u201C' + state.q.trim() + '\u201D' : 'Nothing here yet');
  emptyEl.classList.toggle('on', !total);
  clearBtn.classList.toggle('on', !!state.q);
}

input.addEventListener('input', function () { state.q = input.value; apply(); });
clearBtn.addEventListener('click', function () { input.value = ''; state.q = ''; apply(); input.focus(); });
chipsEl.addEventListener('click', function (e) {
  var b = e.target.closest('.pill'); if (!b) return;
  state.cat = b.dataset.c;
  Array.prototype.forEach.call(chipsEl.children, function (p) { p.classList.toggle('on', p === b); });
  apply();
});
apply();
</script>
</body>
</html>
