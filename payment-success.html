<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Payment — 444Music</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', sans-serif;
    position: relative;
    overflow: hidden;
    background: #070707;
  }

  .bg {
    position: fixed;
    inset: 0;
    background-image: url('https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=1400&q=80');
    background-size: cover;
    background-position: center;
    filter: grayscale(1) brightness(0.2) contrast(1.1);
    z-index: 0;
  }

  .bg-overlay {
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, rgba(7,7,7,0.7) 0%, rgba(7,7,7,0.88) 50%, rgba(3,3,3,0.95) 100%);
    z-index: 1;
  }

  .page {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 420px;
    padding: 2rem 1.5rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .logo { margin-bottom: 3rem; }
  .logo img { height: 36px; width: auto; opacity: 0.9; display: block; filter: grayscale(1) brightness(1.4); }

  .check-wrap {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    border: 1.5px solid rgba(255,255,255,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 1.75rem;
    animation: pop 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  .check-wrap svg { display: none; }
  .check-wrap.is-ok svg.ic-ok { display: block; }
  .check-wrap.is-fail { border-color: rgba(255,69,58,0.55); background: rgba(255,69,58,0.1); }
  .check-wrap.is-fail svg.ic-fail { display: block; }
  .check-wrap.is-wait .big-spin { display: block; }

  .big-spin {
    display: none;
    width: 26px; height: 26px;
    border: 2.5px solid rgba(255,255,255,0.18);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  h1 {
    font-size: 1.75rem;
    font-weight: 600;
    color: #ffffff;
    letter-spacing: -0.03em;
    margin-bottom: 0.6rem;
    line-height: 1.15;
  }

  .sub {
    font-size: 0.875rem;
    color: rgba(255,255,255,0.42);
    line-height: 1.6;
    margin-bottom: 2.25rem;
    max-width: 300px;
  }

  .divider { width: 100%; height: 1px; background: rgba(255,255,255,0.08); margin-bottom: 2.25rem; }

  .meta { width: 100%; display: flex; flex-direction: column; gap: 14px; margin-bottom: 2.5rem; }
  .meta-row { display: flex; align-items: center; justify-content: space-between; }
  .meta-label { font-size: 0.78rem; color: rgba(255,255,255,0.32); letter-spacing: 0.01em; }
  .meta-value { font-size: 0.82rem; font-weight: 500; color: rgba(255,255,255,0.75); }
  .meta-value.ok { color: #ffffff; }
  .meta-value.bad { color: #ff453a; }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 0.9rem 1.5rem;
    background: #ffffff;
    color: #080808;
    font-family: 'Inter', sans-serif;
    font-size: 0.875rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    border: none;
    border-radius: 500px;
    text-decoration: none;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease, opacity 0.2s ease;
    margin-bottom: 0.6rem;
    position: relative;
    overflow: hidden;
  }
  .btn:hover:not(.loading):not(:disabled) { background: #d9d9d9; }
  .btn:active:not(.loading):not(:disabled) { transform: scale(0.99); }
  .btn.loading { cursor: default; opacity: 0.85; }
  .btn:disabled { opacity: 0.4; cursor: default; }

  .btn-link {
    background: none; border: none; color: rgba(255,255,255,0.55);
    font-family: inherit; font-size: 0.8rem; cursor: pointer; padding: 8px; margin-bottom: 0.4rem;
    display: none;
  }
  .btn-link:hover { color: #fff; }

  .btn-progress {
    position: absolute; left: 0; top: 0; bottom: 0; width: 0%;
    background: rgba(0,0,0,0.12); border-radius: 500px; transition: width 0.3s ease;
  }
  .btn-inner { position: relative; z-index: 1; display: flex; align-items: center; gap: 8px; }

  .spinner {
    width: 15px; height: 15px;
    border: 2px solid rgba(0,0,0,0.2); border-top-color: #080808;
    border-radius: 50%; animation: spin 0.7s linear infinite;
    display: none; flex-shrink: 0;
  }

  .redirect-note {
    font-size: 0.72rem; color: rgba(255,255,255,0.5); letter-spacing: 0.01em;
    min-height: 1.1rem; margin-bottom: 0.4rem; transition: opacity 0.3s; opacity: 0;
  }
  .redirect-note.show { opacity: 1; }

  @keyframes spin { to { transform: rotate(360deg); } }

  .secure {
    font-size: 0.72rem; color: rgba(255,255,255,0.22); letter-spacing: 0.02em;
    display: flex; align-items: center; gap: 5px; justify-content: center;
  }
  .secure svg { opacity: 0.5; }

  @keyframes pop { from { opacity: 0; transform: scale(0.6); } to { opacity: 1; transform: scale(1); } }
  @media (max-width: 480px) { h1 { font-size: 1.5rem; } }
</style>
</head>
<body>

<div class="bg"></div>
<div class="bg-overlay"></div>

<div class="page">

  <div class="logo">
    <img src="https://444music-distribution.vercel.app/logo.png" alt="444Music Distribution"/>
  </div>

  <div class="check-wrap is-wait" id="iconWrap">
    <div class="big-spin"></div>
    <svg class="ic-ok" width="28" height="28" viewBox="0 0 28 28" fill="none">
      <path d="M6 14.5L11.5 20L22 9" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <svg class="ic-fail" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ff453a" stroke-width="2.4" stroke-linecap="round">
      <path d="M6 6l12 12M18 6L6 18"/>
    </svg>
  </div>

  <h1 id="title">Verifying payment…</h1>
  <p class="sub" id="sub">Please wait while we confirm your payment with Paystack.</p>

  <div class="divider"></div>

  <div class="meta">
    <div class="meta-row">
      <span class="meta-label">Status</span>
      <span class="meta-value" id="status">Checking…</span>
    </div>
    <div class="meta-row">
      <span class="meta-label">Processed</span>
      <span class="meta-value" id="ts">—</span>
    </div>
    <div class="meta-row">
      <span class="meta-label">Next step</span>
      <span class="meta-value" id="next">—</span>
    </div>
  </div>

  <div class="redirect-note" id="rNote"></div>

  <button class="btn" id="submitBtn" disabled>
    <div class="btn-progress" id="btnProgress"></div>
    <div class="btn-inner">
      <svg id="btnIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
      </svg>
      <div class="spinner" id="btnSpinner"></div>
      <span id="btnText">Please wait…</span>
    </div>
  </button>

  <button class="btn-link" id="retryBtn" type="button">Check again</button>

  <div class="secure">
    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
    </svg>
    Payment secured
  </div>

</div>

<script type="module">
  const BACKEND_BASE = 'https://four44music-broadcast-backend.onrender.com';

  const urlParams = new URLSearchParams(window.location.search);

  // Our own temp reference (used by files.html / Firestore pendingPayments doc id)
  const reference = urlParams.get('ref') || sessionStorage.getItem('pendingPaymentRef') || '';

  // Paystack reference (used to verify with the backend). Sources, in order:
  //  ?pr=  (passed from pricing.html)
  //  ?reference= / ?trxref=  (appended by Paystack when it redirects back)
  //  sessionStorage (normal flow)
  const paystackRef =
    urlParams.get('pr') ||
    urlParams.get('reference') ||
    urlParams.get('trxref') ||
    sessionStorage.getItem('pendingPaymentPaystackRef') ||
    '';

  const $ = id => document.getElementById(id);
  const iconWrap = $('iconWrap'), titleEl = $('title'), subEl = $('sub');
  const statusEl = $('status'), tsEl = $('ts'), nextEl = $('next');
  const btn = $('submitBtn'), btnText = $('btnText'), btnIcon = $('btnIcon');
  const retryBtn = $('retryBtn');

  function formatNow() {
    const d = new Date();
    const mo = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
    const h = d.getHours() % 12 || 12;
    const m = String(d.getMinutes()).padStart(2, '0');
    const ap = d.getHours() >= 12 ? 'PM' : 'AM';
    return `${mo} ${d.getDate()}, ${h}:${m} ${ap}`;
  }

  function setWaiting() {
    iconWrap.className = 'check-wrap is-wait';
    titleEl.textContent = 'Verifying payment…';
    subEl.textContent = 'Please wait while we confirm your payment with Paystack.';
    statusEl.textContent = 'Checking…'; statusEl.className = 'meta-value';
    tsEl.textContent = '—'; nextEl.textContent = '—';
    btn.disabled = true; btn.onclick = null;
    btnText.textContent = 'Please wait…';
    retryBtn.style.display = 'none';
  }

  function setPaid() {
    iconWrap.className = 'check-wrap is-ok';
    titleEl.textContent = 'Payment confirmed';
    subEl.textContent = 'Your payment went through. Submit your music below to start your distribution.';
    statusEl.textContent = 'Approved'; statusEl.className = 'meta-value ok';
    tsEl.textContent = formatNow();
    nextEl.textContent = 'Submit your music';
    btn.disabled = false;
    btnText.textContent = 'Submit your music';
    btn.onclick = startRedirect;
    retryBtn.style.display = 'none';
  }

  function setNotPaid(networkIssue) {
    iconWrap.className = 'check-wrap is-fail';
    titleEl.textContent = networkIssue ? "Couldn't verify payment" : 'Payment not completed';
    subEl.textContent = networkIssue
      ? 'We could not reach the server. Check your connection and try again.'
      : "We couldn't find a completed payment. If you haven't paid, go back to pricing to start again. If you just paid, wait a few seconds and check again.";
    statusEl.textContent = networkIssue ? 'Unverified' : 'Not paid'; statusEl.className = 'meta-value bad';
    tsEl.textContent = '—';
    nextEl.textContent = networkIssue ? 'Try again' : 'Choose a plan';
    btn.disabled = false;
    btnIcon.style.display = 'none';
    btnText.textContent = 'Back to pricing';
    btn.onclick = () => { window.location.href = 'pricing.html'; };
    retryBtn.style.display = 'block';
  }

  // 1) Ask the backend about the Paystack reference
  async function verifyWithBackend() {
    if (!paystackRef) return { paid: false, error: false };
    try {
      const res = await fetch(`${BACKEND_BASE}/api/paystack/verify-payment/${encodeURIComponent(paystackRef)}`);
      if (!res.ok) return { paid: false, error: true };
      const data = await res.json();
      return { paid: !!(data && data.paid === true), error: false };
    } catch (e) {
      return { paid: false, error: true };
    }
  }

  // 2) Fallback: the pendingPayments doc is marked paid=true server-side
  async function verifyWithFirestore() {
    if (!reference) return false;
    try {
      const { initializeApp } = await import('https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js');
      const { getAuth, onAuthStateChanged } = await import('https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js');
      const { getFirestore, doc, getDoc } = await import('https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js');

      const app = initializeApp({
        apiKey:            "AIzaSyBzUD7avh7vJfeSMRl2o9F09_qd-pl0dSg",
        authDomain:        "usersubmissionsportal.firebaseapp.com",
        projectId:         "usersubmissionsportal",
        storageBucket:     "usersubmissionsportal.firebasestorage.app",
        messagingSenderId: "734783502459",
        appId:             "1:734783502459:web:cfa2cc5de6976003b24ade"
      });
      const auth = getAuth(app);
      const db = getFirestore(app);

      const user = await new Promise(resolve => {
        const off = onAuthStateChanged(auth, u => { off(); resolve(u); });
      });
      if (!user) return false;

      const snap = await getDoc(doc(db, 'pendingPayments', reference));
      if (!snap.exists()) return false;
      const d = snap.data() || {};
      return d.paid === true && (!d.uid || d.uid === user.uid);
    } catch (e) {
      console.error('[payment-success] Firestore check failed:', e);
      return false;
    }
  }

  async function runVerification() {
    setWaiting();

    const backend = await verifyWithBackend();
    if (backend.paid) { setPaid(); return; }

    const fsPaid = await verifyWithFirestore();
    if (fsPaid) { setPaid(); return; }

    setNotPaid(backend.error);
  }

  retryBtn.addEventListener('click', runVerification);

  /* ── Redirect to the submission form, carrying the reference ── */
  const TARGET = reference
    ? `files.html?ref=${encodeURIComponent(reference)}`
    : 'files.html';

  const DURATION = 1400;
  let started = false;

  function startRedirect() {
    if (started) return;
    started = true;

    const progress = $('btnProgress'), spinner = $('btnSpinner'), note = $('rNote');

    btn.classList.add('loading');
    btnIcon.style.display = 'none';
    spinner.style.display = 'block';
    note.classList.add('show');

    [
      { at: 0,   pct: 20, msg: 'Opening submission form…' },
      { at: 400, pct: 55, msg: 'Loading your form…' },
      { at: 900, pct: 88, msg: 'Redirecting now…' }
    ].forEach(({ at, pct, msg }) => {
      setTimeout(() => {
        progress.style.width = pct + '%';
        btnText.textContent = msg;
        note.textContent = 'Please wait…';
      }, at);
    });

    setTimeout(() => {
      progress.style.width = '100%';
      btnText.textContent = 'Redirecting…';
      note.textContent = "You're being redirected now";
      setTimeout(() => { window.location.href = TARGET; }, 250);
    }, DURATION);
  }

  runVerification();
</script>

</body>
</html>
