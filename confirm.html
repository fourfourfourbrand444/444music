<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Confirmation — 444Music</title>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --bg: #000000;
  --s1: #1c1c1e;
  --s2: #2c2c2e;
  --sep: rgba(84,84,88,0.55);
  --fill: rgba(120,120,128,0.24);
  --t1: #ffffff;
  --t2: rgba(235,235,245,0.60);
  --t3: rgba(235,235,245,0.30);
  --blue: #0a84ff;
  --yellow: #fdeb0d;
  --ease: cubic-bezier(0.32, 0.72, 0, 1);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Helvetica Neue", Roboto, Arial, sans-serif;
}

html { color-scheme: dark; -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font); background: var(--bg); color: var(--t1);
  min-height: 100vh; letter-spacing: -0.01em; -webkit-font-smoothing: antialiased;
  transition: opacity .3s ease, transform .3s ease;
}
body.closing { opacity: 0; transform: translateY(10px); }
button { font-family: inherit; color: inherit; background: none; border: none; cursor: pointer; }

.shell { max-width: 640px; margin: 0 auto; padding: 0 16px calc(170px + env(safe-area-inset-bottom)); }

/* top bar */
.bar {
  position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  height: 56px; margin: 0 -16px; padding: 0 16px;
  background: rgba(0,0,0,0.72);
  -webkit-backdrop-filter: saturate(180%) blur(24px); backdrop-filter: saturate(180%) blur(24px);
}
.back { width: 36px; height: 36px; border-radius: 50%; background: var(--fill); display: flex; align-items: center; justify-content: center; transition: transform .3s var(--ease); }
.back:active { transform: scale(0.92); }
.back svg { width: 16px; height: 16px; }
.bar-title { font-size: 17px; font-weight: 600; }
.bar-spacer { width: 36px; }

/* hero */
.hero { padding: 14px 4px 6px; }
.hero h1 { font-size: 34px; font-weight: 700; letter-spacing: -0.04em; line-height: 1.1; }
.hero p { font-size: 17px; line-height: 1.4; color: var(--t2); margin-top: 6px; }

/* sections */
.sh { display: flex; align-items: baseline; justify-content: space-between; margin: 30px 16px 8px; }
.sh h2 { font-size: 13px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; color: var(--t2); }
.sh span { font-size: 13px; color: var(--t3); font-variant-numeric: tabular-nums; transition: color .25s ease; }
.sh span.done { color: var(--yellow); }
.group { background: var(--s1); border-radius: 16px; overflow: hidden; }

/* terms */
.terms-box { position: relative; display: flex; align-items: flex-start; gap: 14px; padding: 16px; cursor: pointer; user-select: none; outline: none; transition: background-color .2s ease; }
.terms-box + .terms-box::before { content: ''; position: absolute; top: 0; left: 54px; right: 0; height: 0.5px; background: var(--sep); }
.terms-box:active { background: rgba(255,255,255,0.05); }
.terms-box:focus-visible { background: rgba(255,255,255,0.06); }
.custom-check {
  width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--t3); flex-shrink: 0; margin-top: 1px;
  display: flex; align-items: center; justify-content: center;
  transition: background-color .25s ease, border-color .25s ease;
}
.check-icon { width: 13px; height: 13px; color: #000; opacity: 0; transform: scale(0.5); transition: opacity .2s ease, transform .3s var(--ease); }
.terms-box.checked .custom-check { background: var(--yellow); border-color: var(--yellow); }
.terms-box.checked .check-icon { opacity: 1; transform: scale(1); }
.term-text strong { display: block; font-size: 16px; font-weight: 600; margin-bottom: 3px; }
.term-text span { font-size: 15px; line-height: 1.45; color: var(--t2); }

.sf { margin: 10px 16px 0; font-size: 13px; line-height: 1.4; color: var(--t2); }

/* dock */
.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 200;
  padding: 12px 16px calc(10px + env(safe-area-inset-bottom));
  background: rgba(0,0,0,0.72); border-top: 0.5px solid var(--sep);
  -webkit-backdrop-filter: saturate(180%) blur(24px); backdrop-filter: saturate(180%) blur(24px);
}
.dock-in { max-width: 640px; margin: 0 auto; }
.confirm-btn {
  display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 52px;
  border-radius: 999px; background: var(--yellow); color: #000; font-size: 17px; font-weight: 600;
  transition: transform .3s var(--ease), opacity .2s ease;
}
.confirm-btn:active:not(:disabled) { transform: scale(0.98); }
.confirm-btn:disabled { opacity: 0.4; cursor: default; }
.cancel-btn { display: block; width: 100%; height: 42px; margin-top: 2px; font-size: 17px; color: var(--blue); }
.cancel-btn:active { opacity: 0.6; }

@media (max-width: 420px) { .hero h1 { font-size: 30px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>

<body>
<div class="shell">

  <header class="bar">
    <button type="button" class="back close-btn" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <span class="bar-title">Confirmation</span>
    <span class="bar-spacer"></span>
  </header>

  <div class="hero">
    <h1>Confirm your release</h1>
    <p>Read and agree to each term before you distribute.</p>
  </div>

  <div class="sh"><h2>Terms</h2><span id="progressCount">0 of 3</span></div>
  <div class="group">

    <label class="terms-box" tabindex="0">
      <input type="checkbox" class="term-checkbox" hidden>
      <div class="custom-check" aria-hidden="true">
        <svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <div class="term-text">
        <strong>Copyright ownership</strong>
        <span>I own or have legally licensed all copyrights to the sound recordings, compositions and artwork in this release, and I agree to all terms in the distribution agreement.</span>
      </div>
    </label>

    <label class="terms-box" tabindex="0">
      <input type="checkbox" class="term-checkbox" hidden>
      <div class="custom-check" aria-hidden="true">
        <svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <div class="term-text">
        <strong>Track accuracy</strong>
        <span>I confirm that I have truthfully indicated the Track Origin and Track Properties for each track, so my release meets DSP requirements.</span>
      </div>
    </label>

    <label class="terms-box" tabindex="0">
      <input type="checkbox" class="term-checkbox" hidden>
      <div class="custom-check" aria-hidden="true">
        <svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <div class="term-text">
        <strong>Streaming integrity</strong>
        <span>I understand that artificial streaming and misleading promotion break platform policies and can lead to content removal, withheld royalties or account penalties.</span>
      </div>
    </label>

  </div>
  <p class="sf">This agreement is legally binding once you confirm. Please review each term carefully.</p>

  <div class="dock">
    <div class="dock-in">
      <button class="confirm-btn" id="confirmBtn" disabled type="button">Confirm &amp; distribute</button>
      <button class="cancel-btn" type="button">Cancel</button>
    </div>
  </div>

</div>

<script>
  const checkboxes = document.querySelectorAll(".term-checkbox");
  const confirmBtn = document.getElementById("confirmBtn");
  const progressCount = document.getElementById("progressCount");
  const termBoxes = document.querySelectorAll(".terms-box");

  function updateProgress() {
    const checked = Array.from(checkboxes).filter(cb => cb.checked).length;
    const total = checkboxes.length;
    progressCount.textContent = checked + " of " + total;
    progressCount.classList.toggle("done", checked === total);
    confirmBtn.disabled = checked < total;
  }

  termBoxes.forEach((box, i) => {
    const cb = checkboxes[i];

    cb.addEventListener("change", () => {
      box.classList.toggle("checked", cb.checked);
      updateProgress();
    });

    box.addEventListener("keydown", (e) => {
      if (e.key === " " || e.key === "Enter") {
        e.preventDefault();
        cb.checked = !cb.checked;
        cb.dispatchEvent(new Event("change"));
      }
    });
  });

  confirmBtn.addEventListener("click", () => {
    if (!confirmBtn.disabled) {
      confirmBtn.textContent = "Submitting…";
      confirmBtn.disabled = true;
      setTimeout(() => {
        window.location.href = "after-submission.html";
      }, 1200);
    }
  });

  function leave() {
    document.body.classList.add("closing");
    setTimeout(() => history.back(), 300);
  }
  document.querySelector(".close-btn").addEventListener("click", leave);
  document.querySelector(".cancel-btn").addEventListener("click", leave);
</script>
</body>
</html>
