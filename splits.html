<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Royalty Splits — 444Music</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
/* Three colors only: black, white, and one soft green (used for locked splits and collaborator shares). */
:root {
  --bg:      #000000;
  --card:    #0b0b0b;
  --white:   #ffffff;
  --green:   #7fcf8e;
  --line:    rgba(255,255,255,0.09);
  --line-2:  rgba(255,255,255,0.18);
  --field:   rgba(255,255,255,0.05);
  --text-2:  rgba(255,255,255,0.62);
  --text-3:  rgba(255,255,255,0.38);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--white);
  min-height: 100vh;
  padding: 36px 20px 72px;
  font-size: 14px;
  line-height: 1.45;
}
a { color: inherit; text-decoration: none; }
button, input, select { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; }
.page { max-width: 1040px; margin: 0 auto; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 18px; align-items: start; }

/* card */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.card.locked { border-color: rgba(127,207,142,0.35); }
.head { display: flex; gap: 14px; align-items: center; padding: 18px; }
.cover { width: 56px; height: 56px; border-radius: 10px; background: var(--field); flex-shrink: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; color: var(--text-3); font-size: 20px; }
.cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.meta { min-width: 0; flex: 1; }
.title { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.artist { font-size: 13px; color: var(--text-2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tags { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
.pill { background: var(--white); color: #000; border-radius: 999px; padding: 3px 11px; font-size: 12px; font-weight: 600; }
.lock-note { font-size: 12px; color: var(--green); font-weight: 600; }

.body { padding: 0 18px 18px; }
.bar { display: flex; height: 6px; border-radius: 999px; overflow: hidden; background: var(--field); gap: 2px; margin-bottom: 14px; }
.bar span { display: block; height: 100%; }
.rows { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); }
.row:first-child { border-top: none; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--field); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; flex-shrink: 0; }
.avatar.owner { background: var(--white); color: #000; }
.who { flex: 1; min-width: 0; }
.who b { display: block; font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who small { display: block; font-size: 12px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.share { font-weight: 700; font-size: 14px; }
.x { width: 26px; height: 26px; border-radius: 50%; color: var(--text-3); font-size: 16px; line-height: 1; display: flex; align-items: center; justify-content: center; }
.x:hover { background: var(--field); color: var(--white); }

.add-btn { width: 100%; margin-top: 8px; padding: 10px; border-radius: 10px; border: 1px dashed var(--line-2); color: var(--text-2); font-weight: 500; }
.add-btn:hover { color: var(--white); border-color: var(--text-3); }

/* form */
.form { display: none; margin-top: 12px; padding: 14px; border: 1px solid var(--line); border-radius: 12px; flex-direction: column; gap: 10px; }
.form.open { display: flex; }
.two { display: flex; gap: 10px; }
.two > * { flex: 1; min-width: 0; }
.field label { display: block; font-size: 12px; color: var(--text-2); margin-bottom: 5px; }
.field input, .field select { width: 100%; background: var(--field); border: 1px solid transparent; border-radius: 9px; padding: 9px 11px; outline: none; }
.field input:focus, .field select:focus { border-color: var(--line-2); }
.field input::placeholder { color: var(--text-3); }
.field select option { background: #111; }
.hint { font-size: 12px; color: var(--text-3); margin-top: 5px; }
.hint.bad { color: var(--white); text-decoration: underline; text-underline-offset: 3px; }
.err { font-size: 12.5px; color: #000; background: var(--white); border-radius: 8px; padding: 8px 11px; display: none; }
.err.show { display: block; }
.form-actions { display: flex; gap: 8px; }

.btn { padding: 10px 18px; border-radius: 999px; font-weight: 600; transition: opacity .15s; }
.btn:disabled { opacity: 0.3; cursor: not-allowed; }
.btn-primary { background: var(--white); color: #000; }
.btn-primary:hover:not(:disabled) { opacity: 0.88; }
.btn-ghost { border: 1px solid var(--line-2); color: var(--white); }
.btn-ghost:hover { background: var(--field); }
.form-actions .btn-primary { flex: 1; }

.foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 18px; border-top: 1px solid var(--line); }
.foot span { font-size: 13px; color: var(--text-2); }
.foot .btn { padding: 8px 16px; font-size: 13px; }

/* modals */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,0.82); display: flex; align-items: center; justify-content: center; padding: 18px; opacity: 0; pointer-events: none; transition: opacity .2s; }
.overlay.open { opacity: 1; pointer-events: all; }
.modal { background: var(--card); border: 1px solid var(--line-2); border-radius: 18px; width: 100%; max-width: 440px; max-height: 88vh; overflow-y: auto; padding: 24px; }
.modal h2 { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
.modal p { color: var(--text-2); font-size: 13.5px; }
.modal .list { margin: 18px 0; display: flex; flex-direction: column; max-height: 240px; overflow-y: auto; }
.modal .btns { display: flex; gap: 10px; margin-top: 4px; }
.modal .btns .btn { flex: 1; }
.modal-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.close { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line-2); font-size: 14px; flex-shrink: 0; }
.close:hover { background: var(--field); }
.role-opt { display: block; width: 100%; text-align: left; padding: 14px 16px; border: 1px solid var(--line-2); border-radius: 12px; margin-top: 10px; }
.role-opt:hover { background: var(--field); }
.role-opt b { display: block; font-weight: 600; font-size: 14px; }
.role-opt small { color: var(--text-3); font-size: 12.5px; }
.send-state { font-size: 12px; color: var(--text-3); flex-shrink: 0; }
.send-state.sent { color: var(--green); }
.send-state.failed { color: var(--white); text-decoration: line-through; }
.chip { font-size: 12px; flex-shrink: 0; color: var(--green); }
.chip.failed { color: var(--white); text-decoration: line-through; }

/* empty + skeleton */
.empty { grid-column: 1/-1; text-align: center; padding: 90px 20px; color: var(--text-2); }
.empty h3 { color: var(--white); font-size: 16px; font-weight: 600; margin-bottom: 6px; }
.empty a { display: inline-block; margin-top: 16px; }
.skel { height: 190px; border-radius: 16px; background: linear-gradient(90deg, var(--card) 25%, rgba(255,255,255,0.04) 50%, var(--card) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border: 1px solid var(--line); }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
@keyframes spin { to { transform: rotate(360deg); } }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 140%); background: var(--white); color: #000; padding: 11px 18px; border-radius: 999px; font-weight: 600; font-size: 13px; z-index: 99; transition: transform .25s ease; max-width: calc(100% - 32px); text-align: center; }
.toast.show { transform: translate(-50%, 0); }

@media (max-width: 640px) {
  body { padding: 22px 14px 60px; }
  .grid { grid-template-columns: 1fr; }
  .two { flex-direction: column; }
}
</style>
</head>
<body>
<div class="page">
  <div class="grid" id="grid">
    <div class="skel"></div><div class="skel"></div><div class="skel"></div>
  </div>
</div>

<!-- who is signing in -->
<div class="overlay open" id="roleOverlay">
  <div class="modal">
    <h2>Who are you signing in as?</h2>
    <button class="role-opt" id="roleArtist"><b>Artist</b><small>Manage your releases and splits</small></button>
    <button class="role-opt" id="roleContributor"><b>Collaborator</b><small>See splits you've been added to</small></button>
  </div>
</div>

<!-- view locked split -->
<div class="overlay" id="viewOverlay">
  <div class="modal">
    <div class="modal-top">
      <div>
        <h2 id="viewTitle">Split</h2>
        <p id="viewSub"></p>
      </div>
      <button class="close" id="viewClose">&#x2715;</button>
    </div>
    <div class="list" id="viewList" style="margin-top:18px;max-height:none;"></div>
    <p>This split is locked and can't be edited.</p>
  </div>
</div>

<!-- confirm submit -->
<div class="overlay" id="confirmOverlay">
  <div class="modal">
    <h2>Send invites?</h2>
    <p>Each collaborator gets an email. The split can't be changed after this.</p>
    <div class="list" id="confirmList"></div>
    <div class="btns">
      <button class="btn btn-ghost" id="confirmBack">Go back</button>
      <button class="btn btn-primary" id="confirmGo">Send invites</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ═══════════════════════════════════════════════════════════════
   EMAILJS CONFIG
═══════════════════════════════════════════════════════════════ */
emailjs.init("LZhpLSIA8M2CHNc0L");
const EJ_SERVICE              = "service_e1ksnmx";
const EJ_TEMPLATE_CONTRIBUTOR = "template_w9u4esr";
const EJ_TEMPLATE_ADMIN       = "template_zxg81b9";
const ADMIN_EMAIL             = "444musicdistro@gmail.com";

const OWNER_CONFLICT_MSG = "The song owner can't be a collaborator.";

/* ── HELPERS ── */
const OWNER_COLOR = '#ffffff';
// collaborator colors are the same green at decreasing strength
const segColor = i => `rgba(127,207,142,${Math.max(0.3, 1 - i * 0.2)})`;
const r2 = n => Math.round(n * 100) / 100;
const fmt = n => r2(n) + '%';
const sumPct = list => r2((list || []).reduce((s, c) => s + (parseFloat(c.pct) || 0), 0));

function initials(n){ if(!n)return'?'; const p=n.trim().split(/\s+/); return p.length===1?p[0][0].toUpperCase():(p[0][0]+p[p.length-1][0]).toUpperCase(); }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function validEmail(e){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(e||'').trim()); }
function validPhone(p){ return /^[+\d\s\-(). ]{7,20}$/.test(String(p||'').trim()); }

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),3400);
}

/* Featured artists: read from the tracks' artist lists (type "featured"),
   fall back to featuredArtists, then to a plain `featuring` string. */
function featuredOf(rel){
  const main=(rel.artistName||'').trim().toLowerCase();
  const out=[];
  const add=n=>{
    n=String(n||'').trim();
    if(n && n.toLowerCase()!==main && !out.some(x=>x.toLowerCase()===n.toLowerCase())) out.push(n);
  };
  const scan=list=>{ (Array.isArray(list)?list:[]).forEach(a=>{ if(a && a.type==='featured') add(a.name); }); };
  (Array.isArray(rel.audioFiles)?rel.audioFiles:[]).forEach(t=>scan(t && t.artists));
  (Array.isArray(rel.featuredArtists)?rel.featuredArtists:[]).forEach(t=>scan(t && t.artists));
  if(!out.length && rel.featuring) String(rel.featuring).split(/[,&]/).forEach(add);
  return out;
}

/* Is this the release owner? (by artist name or by account email) */
function ownerConflict(rid,name,email){
  const rel=window._RM[rid]||{};
  const n=(name||'').trim().toLowerCase();
  const e=(email||'').trim().toLowerCase();
  const ownerNames=[rel.artistName].filter(Boolean).map(s=>String(s).trim().toLowerCase());
  const ownerEmails=[rel.email,window._USER_EMAIL].filter(Boolean).map(s=>String(s).trim().toLowerCase());
  return !!((n && ownerNames.includes(n)) || (e && ownerEmails.includes(e)));
}

/* ═══════════════════════════════════════════════════════════════
   FIRESTORE WRITES
   [A] submissions/{id}: royaltySplits (collaborators only), lock fields, contributorEmails
   [B] splits/{auto-id}: dedicated doc for the contributor dashboard
   The owner is never stored — their share is always 100 minus collaborators.
═══════════════════════════════════════════════════════════════ */
async function fsave(rid,collabs){
  const {doc,updateDoc}=window._FF;
  await updateDoc(doc(window._DB,'submissions',rid),{royaltySplits:collabs});
}

async function flock(rid,collabs,emailResults){
  const {doc,updateDoc,collection,addDoc}=window._FF;
  const rel=window._RM[rid]||{};
  const contributorEmails=collabs.map(c=>(c.email||'').toLowerCase().trim()).filter(Boolean);

  await updateDoc(doc(window._DB,'submissions',rid),{
    royaltySplits:    collabs,
    splitLocked:      true,
    splitLockedAt:    new Date().toISOString(),
    splitEmailResults:emailResults,
    contributorEmails:contributorEmails
  });

  const splitPayload={
    submissionId:      rid,
    ownerUserId:       rel.userId          || '',
    ownerEmail:        (rel.email||'').toLowerCase().trim(),
    songTitle:         rel.releaseTitle    || 'Untitled',
    artistName:        rel.artistName      || '',
    releaseType:       rel.releaseType     || rel.type        || '',
    genre:             rel.genre           || rel.primaryGenre || '',
    coverURL:          rel.coverURL        || '',
    lockedAt:          new Date().toISOString(),
    contributorEmails: contributorEmails,
    contributors: collabs.map(c=>{
      const res=emailResults.find(r=>r.email===c.email)||{};
      return {
        name:        c.name  || '',
        role:        c.role  || '',
        email:       (c.email||'').toLowerCase().trim(),
        phone:       c.phone || '',
        pct:         parseFloat(c.pct)||0,
        emailStatus: res.contributorStatus||'unknown',
        balance:     0
      };
    })
  };

  const existingId=window._SPLIT_DOC_IDS[rid];
  if(existingId){
    await updateDoc(doc(window._DB,'splits',existingId),splitPayload);
  } else {
    const ref=await addDoc(collection(window._DB,'splits'),splitPayload);
    window._SPLIT_DOC_IDS[rid]=ref.id;
  }
}

/* ── EMAIL ── */
async function sendAllEmails(releaseData,collabs,onProgress){
  const allStr=collabs.map(c=>`${c.name} (${c.role}) — ${parseFloat(c.pct)||0}%`).join('\n');
  const results=[];
  for(let i=0;i<collabs.length;i++){
    const c=collabs[i]; onProgress(i,'sending');
    let contributorStatus='failed',adminStatus='failed';
    try{
      await emailjs.send(EJ_SERVICE,EJ_TEMPLATE_CONTRIBUTOR,{
        email:c.email, order_id:releaseData.releaseTitle||'Untitled Release',
        reply_to:ADMIN_EMAIL, collab_name:c.name||'', collab_role:c.role||'',
        collab_pct:(parseFloat(c.pct)||0)+'%', collab_email:c.email||'',
        collab_phone:c.phone||'', release_title:releaseData.releaseTitle||'Untitled Release',
        artist_name:releaseData.artistName||'Artist', all_splits:allStr, to_email:c.email,
      });
      contributorStatus='sent';
    }catch(err){console.error('[EmailJS] Contributor failed',c.email,err);}
    try{
      await emailjs.send(EJ_SERVICE,EJ_TEMPLATE_ADMIN,{
        to_email:ADMIN_EMAIL, to_name:'444Music Admin', reply_to:c.email||ADMIN_EMAIL,
        name:c.name||'', email:c.email||'', phone:c.phone||'',
        artist_name:releaseData.artistName||'Artist',
        track_title:releaseData.releaseTitle||'Untitled Release',
        genre:releaseData.genre||releaseData.primaryGenre||'N/A',
        release_type:releaseData.releaseType||releaseData.type||'N/A',
        message:`Royalty split submitted.\n\nCollaborator: ${c.name} (${c.role}) — ${parseFloat(c.pct)||0}%\n\nFull breakdown:\n${allStr}`,
      });
      adminStatus='sent';
    }catch(err){console.error('[EmailJS] Admin send failed',err);}
    results.push({name:c.name,email:c.email,contributorStatus,adminStatus});
    onProgress(i,contributorStatus==='sent'?'sent':'failed');
  }
  return results;
}

/* ── RENDER CARD ── */
function renderCard(rel,rid,collabs,locked){
  const card=document.getElementById('sc-'+rid);
  if(!card)return;

  const used=sumPct(collabs);
  const ownerPct=r2(Math.max(0,100-used));
  const ownerName=rel.artistName||'Owner';
  const ft=featuredOf(rel);
  const artistLine=esc(rel.artistName||'Unknown artist')+(ft.length?' ft. '+esc(ft.join(', ')):'');

  const segs=[{pct:ownerPct,color:OWNER_COLOR}].concat(collabs.map((c,i)=>({pct:parseFloat(c.pct)||0,color:segColor(i)})));
  const barHtml=segs.filter(s=>s.pct>0).map(s=>`<span style="width:${s.pct}%;background:${s.color}"></span>`).join('');

  const ownerRow=`
    <div class="row">
      <div class="avatar owner">${esc(initials(ownerName))}</div>
      <div class="who"><b>${esc(ownerName)}</b><small>Owner</small></div>
      <div class="share">${fmt(ownerPct)}</div>
    </div>`;

  const collabRows=collabs.map((c,i)=>`
    <div class="row">
      <div class="avatar" style="color:${segColor(i)}">${esc(initials(c.name))}</div>
      <div class="who"><b>${esc(c.name)}</b><small>${esc(c.role)} · ${esc(c.email)}</small></div>
      <div class="share" style="color:${segColor(i)}">${fmt(parseFloat(c.pct)||0)}</div>
      ${!locked?`<button class="x" data-rid="${rid}" data-idx="${i}" title="Remove" aria-label="Remove ${esc(c.name)}">&#x2715;</button>`:''}
    </div>`).join('');

  const coverHtml=rel.coverURL?`<img src="${esc(rel.coverURL)}" alt="">`:'&#9834;';

  const formHtml=!locked?`
    <button class="add-btn" onclick="toggleForm('${rid}')">+ Add collaborator</button>
    <div class="form" id="af-${rid}">
      <div class="two">
        <div class="field"><label>Full name</label><input id="fn-${rid}" type="text" placeholder="Kwame Asante" autocomplete="off" oninput="checkOwner('${rid}')"></div>
        <div class="field"><label>Role</label>
          <select id="fr-${rid}">
            <option>Artist</option><option>Producer</option><option>Songwriter</option>
            <option>Composer</option><option>Musician</option><option>Engineer</option>
            <option>Label</option><option>Publisher</option><option>Other</option>
          </select>
        </div>
      </div>
      <div class="two">
        <div class="field"><label>Email</label><input id="fe-${rid}" type="email" placeholder="kwame@gmail.com" oninput="checkOwner('${rid}')"></div>
        <div class="field"><label>Phone</label><input id="fp-${rid}" type="tel" placeholder="+233 24 000 0000"></div>
      </div>
      <div class="field">
        <label>Share</label>
        <input id="fpc-${rid}" type="number" min="0.1" max="100" step="0.1" placeholder="25" oninput="onPct('${rid}')">
        <div class="hint" id="rp-${rid}">${fmt(ownerPct)} available</div>
      </div>
      <div class="err" id="er-${rid}"></div>
      <div class="form-actions">
        <button class="btn btn-ghost" onclick="toggleForm('${rid}',false)">Cancel</button>
        <button class="btn btn-primary" id="addBtn-${rid}" onclick="addCollab('${rid}')">Add</button>
      </div>
    </div>`:'';

  const footBtn=locked
    ?`<button class="btn btn-ghost" onclick="openView('${rid}')">View split</button>`
    :`<button class="btn btn-primary" ${collabs.length?'':'disabled'} title="${collabs.length?'':'Add a collaborator first'}" onclick="initiateSubmit('${rid}')">Send invites</button>`;

  card.className='card'+(locked?' locked':'');
  card.innerHTML=`
    <div class="head">
      <div class="cover">${coverHtml}</div>
      <div class="meta">
        <div class="title">${esc(rel.releaseTitle||'Untitled release')}</div>
        <div class="artist">${artistLine}</div>
        <div class="tags">
          <span class="pill">Approved</span>
          ${locked?'<span class="lock-note">Split locked</span>':''}
        </div>
      </div>
    </div>
    <div class="body">
      <div class="bar">${barHtml}</div>
      <div class="rows">${ownerRow}${collabRows}</div>
      ${formHtml}
    </div>
    <div class="foot">
      <span>${collabs.length?`You keep ${fmt(ownerPct)}`:'No collaborators yet'}</span>
      ${footBtn}
    </div>`;
}

function toggleForm(rid,force){
  const f=document.getElementById('af-'+rid); if(!f)return;
  const open=force!==undefined?force:!f.classList.contains('open');
  f.classList.toggle('open',open);
  if(open)document.getElementById('fn-'+rid)?.focus();
}

function setErr(rid,msg){
  const el=document.getElementById('er-'+rid); if(!el)return;
  el.textContent=msg||'';
  el.classList.toggle('show',!!msg);
}

/* live check while typing name / email */
function checkOwner(rid){
  const name=document.getElementById('fn-'+rid)?.value||'';
  const email=document.getElementById('fe-'+rid)?.value||'';
  setErr(rid, ownerConflict(rid,name,email) ? OWNER_CONFLICT_MSG : '');
}

function onPct(rid){
  const cur=sumPct(window._SD[rid]||[]);
  const np=parseFloat(document.getElementById('fpc-'+rid)?.value)||0;
  const rem=r2(100-cur-np);
  const el=document.getElementById('rp-'+rid); if(!el)return;
  el.textContent=rem>=0?`${fmt(rem)} available`:`${fmt(Math.abs(rem))} over what's available`;
  el.className='hint'+(rem<0?' bad':'');
}

async function addCollab(rid){
  const name =document.getElementById('fn-'+rid)?.value.trim();
  const role =document.getElementById('fr-'+rid)?.value;
  const email=document.getElementById('fe-'+rid)?.value.trim();
  const phone=document.getElementById('fp-'+rid)?.value.trim();
  const pct  =parseFloat(document.getElementById('fpc-'+rid)?.value);

  if(!name)              {setErr(rid,'Enter a full name.');return;}
  if(!validEmail(email)) {setErr(rid,'Enter a valid email address.');return;}
  if(ownerConflict(rid,name,email)){setErr(rid,OWNER_CONFLICT_MSG);showToast(OWNER_CONFLICT_MSG);return;}
  if(!validPhone(phone)) {setErr(rid,'Enter a valid phone number.');return;}
  if(!pct||pct<=0)       {setErr(rid,'Enter a share above 0.');return;}

  const collabs=window._SD[rid]||[];
  const cur=sumPct(collabs);
  if(r2(cur+pct)>100){setErr(rid,`Only ${fmt(100-cur)} is available.`);return;}
  if(collabs.some(c=>c.name.toLowerCase()===name.toLowerCase())){setErr(rid,'This name is already in the split.');return;}
  if(collabs.some(c=>(c.email||'').toLowerCase()===email.toLowerCase())){setErr(rid,'This email is already in the split.');return;}
  setErr(rid,'');

  const btn=document.getElementById('addBtn-'+rid);
  if(btn){btn.disabled=true;btn.textContent='Saving…';}
  try{
    const next=[...collabs,{name,role,email,phone,pct}];
    window._SD[rid]=next;
    await fsave(rid,next);
    renderCard(window._RM[rid],rid,next,false);
    showToast(name+' added');
  }catch(e){
    console.error(e);
    window._SD[rid]=collabs;
    if(btn){btn.disabled=false;btn.textContent='Add';}
    setErr(rid,'Could not save. Try again.');
  }
}

document.getElementById('grid').addEventListener('click',async e=>{
  const btn=e.target.closest('.x'); if(!btn)return;
  const rid=btn.dataset.rid,idx=parseInt(btn.dataset.idx);
  const c=(window._SD[rid]||[])[idx]; if(!c)return;
  if(!confirm(`Remove ${c.name} from this split?`))return;
  const prev=window._SD[rid]||[];
  try{
    const next=prev.filter((_,i)=>i!==idx);
    window._SD[rid]=next;
    await fsave(rid,next);
    renderCard(window._RM[rid],rid,next,false);
    showToast(c.name+' removed');
  }catch(err){
    console.error(err);
    window._SD[rid]=prev;
    showToast('Could not remove. Try again.');
  }
});

/* ── SUBMIT FLOW ── */
let _pRid=null;
function initiateSubmit(rid){
  const collabs=window._SD[rid]||[];
  if(!collabs.length){showToast('Add a collaborator first.');return;}
  _pRid=rid;
  document.getElementById('confirmList').innerHTML=collabs.map((c,i)=>`
    <div class="row">
      <div class="avatar" style="color:${segColor(i)}">${esc(initials(c.name))}</div>
      <div class="who"><b>${esc(c.name)}</b><small>${esc(c.email)}</small></div>
      <div class="share">${fmt(parseFloat(c.pct)||0)}</div>
    </div>`).join('');
  const go=document.getElementById('confirmGo');
  go.disabled=false; go.textContent='Send invites';
  document.getElementById('confirmBack').style.display='';
  document.getElementById('confirmOverlay').classList.add('open');
  document.body.style.overflow='hidden';
}

function closeConfirm(){
  document.getElementById('confirmOverlay').classList.remove('open');
  document.body.style.overflow=''; _pRid=null;
}
document.getElementById('confirmBack').onclick=closeConfirm;

document.getElementById('confirmGo').onclick=async()=>{
  if(!_pRid)return;
  const rid=_pRid, btn=document.getElementById('confirmGo');
  const collabs=window._SD[rid]||[];
  if(!collabs.length)return;
  const states=collabs.map(()=>'queued');
  const label={queued:'Queued',sending:'Sending…',sent:'Sent',failed:'Failed'};
  const renderProgress=()=>{
    document.getElementById('confirmList').innerHTML=collabs.map((c,i)=>`
      <div class="row">
        <div class="who"><b>${esc(c.name)}</b><small>${esc(c.email)}</small></div>
        <span class="send-state ${states[i]}">${label[states[i]]}</span>
      </div>`).join('');
  };
  btn.disabled=true; btn.textContent='Sending…';
  document.getElementById('confirmBack').style.display='none';
  renderProgress();
  try{
    const results=await sendAllEmails(window._RM[rid],collabs,(idx,status)=>{states[idx]=status;renderProgress();});
    await flock(rid,collabs,results);
    window._LK.add(rid);
    if(window._RM[rid])window._RM[rid].splitEmailResults=results;
    renderCard(window._RM[rid],rid,collabs,true);
    const failed=results.filter(r=>r.contributorStatus!=='sent').length;
    closeConfirm();
    showToast(failed===0
      ?`Split locked. ${collabs.length} invite${collabs.length>1?'s':''} sent.`
      :`Split locked. ${failed} invite${failed>1?'s':''} may have failed.`);
  }catch(e){
    console.error('[Submit error]',e);
    showToast('Something went wrong. Try again.');
    btn.disabled=false; btn.textContent='Send invites';
    document.getElementById('confirmBack').style.display='';
  }
};

/* ── VIEW LOCKED SPLIT ── */
function openView(rid){
  const collabs=window._SD[rid]||[],rel=window._RM[rid]||{};
  const emailResults=Array.isArray(rel.splitEmailResults)?rel.splitEmailResults:[];
  const statusOf=email=>(emailResults.find(r=>r.email===email)||{}).contributorStatus;
  const ownerPct=r2(Math.max(0,100-sumPct(collabs)));
  const ft=featuredOf(rel);

  document.getElementById('viewTitle').textContent=rel.releaseTitle||'Untitled release';
  document.getElementById('viewSub').textContent=(rel.artistName||'')+(ft.length?' ft. '+ft.join(', '):'');

  const ownerRow=`
    <div class="row">
      <div class="avatar owner">${esc(initials(rel.artistName||'Owner'))}</div>
      <div class="who"><b>${esc(rel.artistName||'Owner')}</b><small>Owner</small></div>
      <div class="share">${fmt(ownerPct)}</div>
    </div>`;
  const rows=collabs.map((c,i)=>{
    const ok=statusOf(c.email)==='sent';
    return `
    <div class="row">
      <div class="avatar" style="color:${segColor(i)}">${esc(initials(c.name))}</div>
      <div class="who"><b>${esc(c.name)}</b><small>${esc(c.role)} · ${esc(c.email)}</small></div>
      <span class="chip ${ok?'':'failed'}">${ok?'Invited':'Not sent'}</span>
      <div class="share" style="color:${segColor(i)}">${fmt(parseFloat(c.pct)||0)}</div>
    </div>`;
  }).join('');
  document.getElementById('viewList').innerHTML=ownerRow+rows;
  document.getElementById('viewOverlay').classList.add('open');
  document.body.style.overflow='hidden';
}

function closeView(){document.getElementById('viewOverlay').classList.remove('open');document.body.style.overflow='';}
document.getElementById('viewClose').onclick=closeView;
document.getElementById('viewOverlay').addEventListener('click',e=>{if(e.target===e.currentTarget)closeView();});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    closeView();
    if(!document.getElementById('confirmGo').disabled)closeConfirm();
  }
});

/* ── ROLE SELECT ── */
document.getElementById('roleArtist').onclick=()=>{
  document.getElementById('roleOverlay').classList.remove('open');
  document.body.style.overflow='';
};
document.getElementById('roleContributor').onclick=()=>{ window.location.href='contributor.html'; };
document.body.style.overflow='hidden';

window._SD={}; window._RM={}; window._DB=null; window._FF={}; window._LK=new Set(); window._SPLIT_DOC_IDS={}; window._USER_EMAIL='';
</script>

<script type="module">
import { initializeApp }               from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
import { getFirestore, collection, query, where, getDocs, doc, updateDoc, addDoc }
  from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey:            "AIzaSyBzUD7avh7vJfeSMRl2o9F09_qd-pl0dSg",
  authDomain:        "usersubmissionsportal.firebaseapp.com",
  projectId:         "usersubmissionsportal",
  storageBucket:     "usersubmissionsportal.firebasestorage.app",
  messagingSenderId: "734783502459",
  appId:             "1:734783502459:web:cfa2cc5de6976003b24ade"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);
window._DB = db;
window._FF = { doc, updateDoc, collection, addDoc };

const isApproved = d => String(d.status || '').trim().toLowerCase() === 'approved';

onAuthStateChanged(auth, async user => {
  if (!user) { window.location.href='login.html'; return; }
  window._USER_EMAIL = (user.email || '').toLowerCase().trim();
  const grid = document.getElementById('grid');
  try {
    const snap = await getDocs(query(collection(db,'submissions'), where('userId','==',user.uid)));

    // Only approved releases can be split. Review, pending, rejected and taken-down are skipped.
    const approved = [];
    snap.forEach(ds => { const data = ds.data(); if (isApproved(data)) approved.push({ id: ds.id, data }); });

    grid.innerHTML = '';
    if (!approved.length) {
      grid.innerHTML = `<div class="empty"><h3>No approved releases yet</h3><p>Splits open once a release is approved.</p></div>`;
      return;
    }

    // Reuse existing splits docs so we never create duplicates
    const existingSplits = await getDocs(query(collection(db,'splits'), where('ownerUserId','==',user.uid)));
    existingSplits.forEach(ds => {
      const sid = ds.data().submissionId;
      if (sid) window._SPLIT_DOC_IDS[sid] = ds.id;
    });

    approved.forEach(({ id, data }) => {
      const locked = data.splitLocked === true;
      window._RM[id] = { ...data, _id: id };
      // royaltySplits holds real collaborators only; the owner share is derived at render time
      window._SD[id] = Array.isArray(data.royaltySplits) ? data.royaltySplits : [];
      if (locked) window._LK.add(id);
      const card = document.createElement('div');
      card.className = 'card'; card.id = 'sc-' + id;
      grid.appendChild(card);
      renderCard(data, id, window._SD[id], locked);
    });
  } catch(e){
    console.error(e);
    grid.innerHTML = `<div class="empty"><h3>Couldn't load releases</h3><p>Refresh the page to try again.</p></div>`;
  }
});
</script>
