<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Earnings • 444Music</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
/* ═══════════════════════════════════════════════════
   444MUSIC — EARNINGS  ·  Deep black / true white
═══════════════════════════════════════════════════ */

:root {
  --page:          #000000;
  --blk:           #0a0a0a;
  --blk-2:         #111111;
  --blk-border:    rgba(255,255,255,0.09);
  --blk-border-h:  rgba(255,255,255,0.18);

  --wht:           #ffffff;
  --wht-border:    rgba(0,0,0,0.08);

  --text-1:        #f5f5f5;
  --text-2:        #969696;
  --text-3:        #4a4a4a;

  --ink-1:         #0d0d0d;
  --ink-2:         #6e6e6e;

  --radius:        18px;
  --pill:          999px;

  --font-head:     'Outfit', sans-serif;
  --font-body:     'Plus Jakarta Sans', sans-serif;

  --ease:          cubic-bezier(0.4,0,0.2,1);
  --t:             0.22s;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--font-body);
  background:var(--page);
  color:var(--text-1);
  min-height:100vh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:var(--page)}
::-webkit-scrollbar-thumb{background:#333;border-radius:99px}

/* ===== CONTAINER ===== */
.container{max-width:1080px;margin:0 auto;padding:28px 20px 80px;}

/* ===== CARDS ===== */
.card-blk{
  background:var(--blk);border:1px solid var(--blk-border);border-radius:var(--radius);
  padding:24px;position:relative;overflow:hidden;
  transition:border-color var(--t) var(--ease);
}
.card-blk:hover{border-color:var(--blk-border-h);}
.card-wht{
  background:var(--wht);border:1px solid var(--wht-border);border-radius:var(--radius);
  padding:24px;position:relative;overflow:hidden;color:var(--ink-1);
}
.card-title{font-family:var(--font-head);font-size:0.98rem;font-weight:800;letter-spacing:-0.3px;margin-bottom:18px;color:#fff;}
.card-wht .card-title{color:var(--ink-1);}
.card-title i{margin-right:8px;color:inherit;}

/* ===== STAT ROW ===== */
.stats{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:16px;margin-bottom:20px;animation:revealUp 0.5s var(--ease) both;}
@keyframes revealUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

.stat-card{border-radius:var(--radius);padding:22px 20px 20px;position:relative;overflow:hidden;}
.stat-card.hero{background:var(--blk);border:1px solid var(--blk-border-h);}
.stat-card.plain{background:var(--wht);border:1px solid var(--wht-border);color:var(--ink-1);}

.hero-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;}
.stat-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:0.9rem;flex-shrink:0;}
.stat-card.hero .stat-icon{background:rgba(255,255,255,0.1);color:#fff;}
.stat-card.plain .stat-icon{background:rgba(0,0,0,0.06);color:var(--ink-1);margin-bottom:14px;}

/* simple currency select, sits inside the balance card */
.cur-select select{
  appearance:none;-webkit-appearance:none;outline:none;
  background-color:rgba(255,255,255,0.08);border:1px solid var(--blk-border-h);border-radius:var(--pill);
  color:#fff;font-family:var(--font-body);font-size:0.78rem;font-weight:700;
  padding:7px 30px 7px 14px;cursor:pointer;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%23969696' stroke-width='1.5' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center;
}
.cur-select select:hover{border-color:rgba(255,255,255,0.32);}
.cur-select select option{background:#111;color:#fff;}
.cur-note{font-size:0.7rem;color:var(--text-2);margin-top:10px;}
.cur-note:empty{display:none;}

.stat-card h2{font-family:var(--font-head);font-size:2.05rem;font-weight:900;letter-spacing:-1px;line-height:1;margin-bottom:6px;word-break:break-all;}
.stat-card.hero h2{color:#fff;}
.stat-card.plain h2{font-size:1.5rem;color:var(--ink-1);}
.stat-card p{font-size:0.7rem;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;}
.stat-card.hero p{color:var(--text-2);}
.stat-card.plain p{color:var(--ink-2);}
.stat-sub{font-size:0.74rem;color:var(--ink-2);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.stat-sub:empty{display:none;}

/* ===== WITHDRAW ===== */
.withdraw-card{margin-bottom:20px;animation:revealUp 0.5s var(--ease) 0.06s both;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;}
.withdraw-left{flex:1;min-width:240px;}
.withdraw-left .card-title{margin-bottom:8px;}
.withdraw-left p{font-size:0.84rem;color:var(--ink-2);line-height:1.55;margin-bottom:14px;}
.thresh-track{height:6px;background:rgba(0,0,0,0.08);border-radius:var(--pill);overflow:hidden;max-width:340px;}
.thresh-fill{height:100%;border-radius:var(--pill);width:0%;background:#000;transition:width 1s var(--ease);}
.thresh-label{display:flex;justify-content:space-between;font-size:0.72rem;color:var(--ink-2);font-weight:600;margin-top:8px;max-width:340px;}
.thresh-label strong{color:var(--ink-1);}
.btn-withdraw{
  display:inline-flex;align-items:center;gap:9px;
  background:#000;color:#fff;border:none;border-radius:12px;
  padding:15px 26px;font-size:0.9rem;font-weight:700;
  white-space:nowrap;flex-shrink:0;transition:opacity var(--t);
}
.btn-withdraw:hover{opacity:.85;}

/* ===== SONGS ===== */
.songs{animation:revealUp 0.5s var(--ease) 0.12s both;}
.songs-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
.songs-head .card-title{margin-bottom:0;}
.search-wrap{display:none;flex:1 1 220px;max-width:300px;}
.search-wrap.show{display:block;}
.search-wrap input{
  width:100%;background:var(--blk-2);border:1px solid var(--blk-border-h);border-radius:var(--pill);
  padding:9px 16px;color:#fff;font-family:var(--font-body);font-size:0.85rem;outline:none;
}
.search-wrap input::placeholder{color:var(--text-2);}
.search-wrap input:focus{border-color:rgba(255,255,255,0.4);}

.song-list{display:flex;flex-direction:column;gap:10px;}
.song-row{display:flex;align-items:center;gap:14px;padding:12px 14px;background:var(--blk-2);border:1px solid var(--blk-border);border-radius:12px;}
.song-cover{width:44px;height:44px;border-radius:10px;background:#000;border:1px solid var(--blk-border);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--text-3);font-size:0.9rem;}
.song-cover img{width:100%;height:100%;object-fit:cover;display:block;}
.song-info{flex:1;min-width:0;}
.song-title{font-size:0.9rem;font-weight:700;color:var(--text-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.song-meta{font-size:0.72rem;color:var(--text-2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.song-amt{font-family:var(--font-head);font-size:0.98rem;font-weight:800;color:#fff;flex-shrink:0;}
.song-amt.zero{color:var(--text-2);font-weight:600;}
.song-empty{text-align:center;padding:34px 10px;font-size:0.85rem;color:var(--text-2);}
.song-row.sk{height:70px;background:linear-gradient(90deg,#111 25%,#1a1a1a 50%,#111 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-color:transparent;}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}

.songs-foot{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:16px;}
.songs-foot.between{justify-content:space-between;}
.songs-foot:empty{display:none;}
.pill-btn{background:transparent;border:1px solid var(--blk-border-h);color:#fff;border-radius:var(--pill);padding:9px 22px;font-size:0.82rem;font-weight:700;transition:background var(--t);}
.pill-btn:hover:not(:disabled){background:var(--blk-2);}
.pill-btn.sm{padding:7px 14px;font-size:0.78rem;}
.link-btn{background:none;border:none;color:var(--text-2);font-size:0.8rem;font-weight:600;padding:6px 2px;}
.link-btn:hover{color:#fff;}
.pager{display:flex;align-items:center;gap:10px;font-size:0.78rem;color:var(--text-2);font-weight:600;}

/* ===== POPUP ===== */
.popup-overlay{position:fixed;inset:0;z-index:5000;background:rgba(0,0,0,0.82);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.3s;padding:20px;}
.popup-overlay.active{opacity:1;pointer-events:auto;}
.popup-box{background:var(--wht);color:var(--ink-1);border-radius:20px;padding:30px 26px;max-width:380px;width:100%;text-align:center;box-shadow:0 30px 70px rgba(0,0,0,0.6);animation:popIn 0.3s var(--ease) both;}
@keyframes popIn{from{opacity:0;transform:scale(0.92) translateY(12px)}to{opacity:1;transform:scale(1) translateY(0)}}
.popup-icon{width:52px;height:52px;border-radius:14px;background:rgba(0,0,0,0.06);display:flex;align-items:center;justify-content:center;color:var(--ink-1);font-size:22px;margin:0 auto 16px;}
.popup-box h2{font-family:var(--font-head);font-size:1.1rem;font-weight:800;margin-bottom:8px;}
.popup-box p{font-size:0.85rem;color:var(--ink-2);line-height:1.6;margin-bottom:8px;}
.popup-threshold{display:flex;align-items:center;justify-content:center;gap:8px;background:rgba(0,0,0,0.04);border-radius:10px;padding:12px;margin:14px 0;font-size:0.85rem;color:var(--ink-2);flex-wrap:wrap;}
.popup-threshold strong{font-family:var(--font-head);font-size:1.05rem;color:var(--ink-1);}
.popup-btn{width:100%;padding:13px;border:none;border-radius:11px;background:#000;color:#fff;font-size:0.9rem;font-weight:700;margin-top:4px;}

@media(max-width:900px){
  .stats{grid-template-columns:1fr 1fr}
  .stats .stat-card.hero{grid-column:1/-1}
}
@media(max-width:640px){
  .container{padding:18px 14px 64px}
  .stats{gap:10px}
  .stat-card.hero h2{font-size:1.9rem}
  .stat-card.plain h2{font-size:1.25rem}
  .withdraw-card{flex-direction:column;align-items:stretch;}
  .btn-withdraw{justify-content:center;width:100%;}
  .search-wrap{max-width:none;flex-basis:100%;}
}
</style>
</head>
<body>

<div class="container">

  <!-- BALANCE + TWO LIVE CARDS -->
  <section class="stats">
    <div class="stat-card hero">
      <div class="hero-top">
        <div class="stat-icon"><i class="fa-solid fa-wallet"></i></div>
        <div class="cur-select"><select id="currencySelect" aria-label="Currency"></select></div>
      </div>
      <h2 id="balanceValue">$0.00</h2>
      <p>Available Balance</p>
      <div class="cur-note" id="curNote"></div>
    </div>

    <div class="stat-card plain">
      <div class="stat-icon"><i class="fa-solid fa-clock-rotate-left"></i></div>
      <h2 id="payoutValue">—</h2>
      <p>Last payout</p>
      <div class="stat-sub" id="payoutSub"></div>
    </div>

    <div class="stat-card plain">
      <div class="stat-icon"><i class="fa-solid fa-music"></i></div>
      <h2 id="earningValue">—</h2>
      <p>Songs earning</p>
      <div class="stat-sub" id="earningSub"></div>
    </div>
  </section>

  <!-- WITHDRAW -->
  <section class="card-wht withdraw-card">
    <div class="withdraw-left">
      <div class="card-title"><i class="fa-solid fa-arrow-up-from-bracket"></i> Ready to withdraw</div>
      <p id="withdrawCopy">Minimum withdrawal is $50.00.</p>
      <div class="thresh-track"><div class="thresh-fill" id="threshFill"></div></div>
      <div class="thresh-label"><span>Progress to payout</span><strong id="threshText">$0 / $50</strong></div>
    </div>
    <button class="btn-withdraw" id="withdrawBtn">
      <i class="fa-solid fa-arrow-up-from-bracket"></i> Withdraw Earnings
    </button>
  </section>

  <!-- EARNINGS BY SONG -->
  <section class="card-blk songs">
    <div class="songs-head">
      <div class="card-title"><i class="fa-solid fa-compact-disc"></i> Earnings by song</div>
      <div class="search-wrap" id="searchWrap">
        <input id="songSearch" type="search" placeholder="Search a song, press Enter" autocomplete="off">
      </div>
    </div>
    <div class="song-list" id="songList"></div>
    <div class="songs-foot" id="songFoot"></div>
  </section>

</div>

<!-- WITHDRAW GUARD POPUP -->
<div id="withdrawPopup" class="popup-overlay">
  <div class="popup-box">
    <div class="popup-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
    <h2>Minimum Not Reached</h2>
    <p>Your balance is below the minimum withdrawal threshold.</p>
    <div class="popup-threshold">
      Your balance must reach <strong id="popupThreshold">$50.00</strong> to withdraw
    </div>
    <button id="closePopup" class="popup-btn">Got it</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, getDocs, collection, query, where, orderBy, limit, startAfter, getCountFromServer }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBzUD7avh7vJfeSMRl2o9F09_qd-pl0dSg",
  authDomain: "usersubmissionsportal.firebaseapp.com",
  projectId: "usersubmissionsportal",
  storageBucket: "usersubmissionsportal.firebasestorage.app",
  messagingSenderId: "734783502459",
  appId: "1:734783502459:web:cfa2cc5de6976003b24ade"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const r2 = x => Math.round(x * 100) / 100;

const MIN_WITHDRAWAL = 50;
const APPROVED = ['Approved', 'approved'];
const COMPACT_COUNT = 4;   // songs shown first
const PAGE_SIZE = 10;      // songs per page after "See more"

let uid = null;
let userBalance = 0;       // real USD, used for eligibility checks

/* ── CURRENCY (display only; balance is always tracked in USD) ──
   Keep in sync with _currencyRates in earnings_screen.dart */
const CURRENCY_RATES = {
  USD: { symbol: '$',    rate: 1 },
  GHS: { symbol: 'GHC',  rate: 11.454 },
  NGN: { symbol: '₦',    rate: 1500.5 },
  EUR: { symbol: '€',    rate: 0.9198 },
  GBP: { symbol: '£',    rate: 0.7903 },
  ZAR: { symbol: 'R',    rate: 18.50 },
  KES: { symbol: 'KSh',  rate: 128.98 },
  CAD: { symbol: 'CA$',  rate: 1.360 },
  XOF: { symbol: 'CFA',  rate: 602.5 },
};
let selectedCurrency = 'USD';

const currencySelect = $('currencySelect');
Object.keys(CURRENCY_RATES).forEach(code => {
  const opt = document.createElement('option');
  opt.value = code; opt.textContent = code;
  currencySelect.appendChild(opt);
});
currencySelect.value = selectedCurrency;

function formatSelected(usdValue, decimals) {
  const info = CURRENCY_RATES[selectedCurrency] || CURRENCY_RATES.USD;
  const d = decimals !== undefined ? decimals : (selectedCurrency === 'XOF' ? 0 : 2);
  const n = (Number(usdValue) || 0) * info.rate;
  return info.symbol + n.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
}

function fmtDate(d) {
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
}

/* ── STATE ── */
let loading = true;
let errorMsg = '';
let busy = false;
let mode = 'compact';          // 'compact' | 'paged' | 'search'
let compact = { rows: [], earnerRows: [], cursor: null, more: false };
let pages = [];                // paged mode: [{ rows, cursor, more }]
let pg = 0;
let results = [];
let searchEnabled = false;     // shown once the user has more than 10 earning songs
let stats = { earning: null, total: null, lastPayout: undefined };

/* Fallback mode: if the indexed queries fail (index not created yet), the page loads this
   user's own releases once and does the sorting, paging and search in the browser. */
let useMem = false;
let searchMem = false;
let memRows = null;

/* ── DATA ── */
const subs = () => collection(db, 'submissions');
const approvedFilters = () => [where('userId', '==', uid), where('status', 'in', APPROVED)];
const isApproved = s => String(s.status || '').trim().toLowerCase() === 'approved';

function toRow(d) {
  const s = d.data();
  // Owner share is only shown when a locked split exists. royaltySplits holds collaborators only.
  const collabs = s.splitLocked === true && Array.isArray(s.royaltySplits) ? s.royaltySplits : [];
  const cp = collabs.reduce((a, c) => a + (parseFloat(c.pct) || 0), 0);
  const share = cp > 0 ? Math.max(0, r2(100 - cp)) : null;
  return {
    id: d.id,
    title: s.releaseTitle || 'Untitled',
    cover: s.coverURL || s.officialCoverURL || '',
    earned: Number(s.earningsBalance) || 0,
    share,
    paidAt: s.lastPayoutAt && typeof s.lastPayoutAt.toDate === 'function' ? s.lastPayoutAt.toDate() : null
  };
}

/* All approved songs of this user, biggest earners first (fallback mode only). */
async function ensureMem() {
  if (memRows) return memRows;
  const sn = await getDocs(query(subs(), where('userId', '==', uid)));
  const rows = [];
  sn.docs.forEach(d => { if (isApproved(d.data())) rows.push(toRow(d)); });
  rows.sort((a, b) => b.earned - a.earned);
  memRows = rows;
  return rows;
}

/* One page of approved songs that have earned something, biggest first.
   Fast path needs index: submissions → userId ↑, status ↑, earningsBalance ↓ */
async function earnersPage(after, n) {
  if (useMem) {
    const earners = (await ensureMem()).filter(r => r.earned > 0);
    const start = after == null ? 0 : after;
    const shown = earners.slice(start, start + n);
    return { rows: shown, cursor: start + shown.length, more: earners.length > start + n };
  }
  const q = query(subs(), ...approvedFilters(), where('earningsBalance', '>', 0), orderBy('earningsBalance', 'desc'),
    ...(after ? [startAfter(after)] : []), limit(n + 1));
  const docs = (await getDocs(q)).docs;
  const shown = docs.slice(0, n);
  return { rows: shown.map(toRow), cursor: shown.length ? shown[shown.length - 1] : null, more: docs.length > n };
}

async function fetchFirst() {
  const r = await earnersPage(null, COMPACT_COUNT);
  const rows = [...r.rows];
  // Fewer than 4 earning songs: fill the first view with approved songs so it's never empty.
  if (!r.more && rows.length < COMPACT_COUNT) {
    const have = new Set(rows.map(x => x.id));
    const extra = useMem
      ? (await ensureMem()).filter(x => !have.has(x.id))
      : (await getDocs(query(subs(), ...approvedFilters(), limit(COMPACT_COUNT)))).docs.map(toRow).filter(x => !have.has(x.id));
    extra.forEach(x => { if (rows.length < COMPACT_COUNT) rows.push(x); });
  }
  return { rows, earnerRows: r.rows, cursor: r.cursor, more: r.more };
}

async function loadSongs() {
  loading = true; errorMsg = ''; renderSongs();
  try {
    try {
      compact = await fetchFirst();
    } catch (e) {
      console.warn('Indexed songs query failed, using fallback. Create the index from this link:', e);
      useMem = true;
      compact = await fetchFirst();
    }
  } catch (e) {
    console.error('Songs load failed:', e);
    errorMsg = "Couldn't load your songs. Please refresh.";
  }
  loading = false; renderSongs();
}

async function loadStats() {
  let done = false;
  if (!useMem) {
    const [tot, earn, last] = await Promise.allSettled([
      getCountFromServer(query(subs(), ...approvedFilters())),
      getCountFromServer(query(subs(), ...approvedFilters(), where('earningsBalance', '>', 0))),
      // Fast path needs index: submissions → userId ↑, lastPayoutAt ↓
      getDocs(query(subs(), where('userId', '==', uid), orderBy('lastPayoutAt', 'desc'), limit(1)))
    ]);
    [tot, earn, last].forEach(x => { if (x.status === 'rejected') console.warn('Stat query failed:', x.reason); });
    if (tot.status === 'fulfilled' && earn.status === 'fulfilled' && last.status === 'fulfilled') {
      stats.total = tot.value.data().count;
      stats.earning = earn.value.data().count;
      const d = last.value.docs[0];
      const ts = d && d.data().lastPayoutAt;
      stats.lastPayout = ts && typeof ts.toDate === 'function'
        ? { date: ts.toDate(), title: d.data().releaseTitle || 'Untitled' } : null;
      done = true;
    }
  }
  if (!done) {
    try {
      const rows = await ensureMem();
      stats.total = rows.length;
      stats.earning = rows.filter(r => r.earned > 0).length;
      const paid = rows.filter(r => r.paidAt).sort((a, b) => b.paidAt - a.paidAt)[0];
      stats.lastPayout = paid ? { date: paid.paidAt, title: paid.title } : null;
    } catch (e) { console.error('Stats failed:', e); }
  }
  renderStats();
}

/* ── RENDER ── */
function renderStats() {
  const lp = stats.lastPayout;
  $('payoutValue').textContent = lp ? fmtDate(lp.date) : '—';
  $('payoutSub').textContent   = lp ? lp.title : (lp === null ? 'No payouts yet' : '');
  $('earningValue').textContent = stats.earning == null ? '—' : stats.earning;
  $('earningSub').textContent   = stats.total == null ? '' : `of ${stats.total} approved`;
}

function renderMoney() {
  $('balanceValue').textContent = formatSelected(userBalance);
  $('curNote').textContent = selectedCurrency === 'USD' ? '' : 'Approximate. Paid out in USD.';
  $('withdrawCopy').textContent = `Minimum withdrawal is ${formatSelected(MIN_WITHDRAWAL)}.`;
  const pct = Math.min((userBalance / MIN_WITHDRAWAL) * 100, 100);
  $('threshFill').style.width = pct + '%';
  $('threshText').textContent = `${formatSelected(userBalance, 0)} / ${formatSelected(MIN_WITHDRAWAL, 0)}`;
  $('popupThreshold').textContent = formatSelected(MIN_WITHDRAWAL);
  renderSongs();
}

function rowHtml(r) {
  const meta = [];
  if (r.share !== null) meta.push(`Your share ${r.share}%`);
  if (r.earned > 0 && r.paidAt) meta.push(`Updated ${fmtDate(r.paidAt)}`);
  const cover = r.cover ? `<img src="${esc(r.cover)}" alt="" loading="lazy">` : '<i class="fa-solid fa-music"></i>';
  return `
    <div class="song-row">
      <div class="song-cover">${cover}</div>
      <div class="song-info">
        <div class="song-title">${esc(r.title)}</div>
        ${meta.length ? `<div class="song-meta">${esc(meta.join(' · '))}</div>` : ''}
      </div>
      <div class="song-amt${r.earned > 0 ? '' : ' zero'}">${formatSelected(r.earned)}</div>
    </div>`;
}

function footHtml() {
  if (mode === 'compact') {
    return compact.more ? `<button class="pill-btn" data-act="more" ${busy ? 'disabled' : ''}>${busy ? 'Loading…' : 'See more'}</button>` : '';
  }
  if (mode === 'search') return `<button class="link-btn" data-act="clear">Clear search</button>`;
  const p = pages[pg]; if (!p) return '';
  const paged = pages.length > 1 || p.more;
  return `<button class="link-btn" data-act="less">Show less</button>` + (paged ? `
    <div class="pager">
      <button class="pill-btn sm" data-act="prev" ${pg === 0 || busy ? 'disabled' : ''}>‹ Prev</button>
      <span>Page ${pg + 1}</span>
      <button class="pill-btn sm" data-act="next" ${!p.more || busy ? 'disabled' : ''}>Next ›</button>
    </div>` : '');
}

function renderSongs() {
  const list = $('songList'), foot = $('songFoot');
  $('searchWrap').classList.toggle('show', searchEnabled);
  $('songSearch').disabled = busy;
  if (loading) { list.innerHTML = '<div class="song-row sk"></div>'.repeat(COMPACT_COUNT); foot.innerHTML = ''; return; }
  if (errorMsg) { list.innerHTML = `<div class="song-empty">${esc(errorMsg)}</div>`; foot.innerHTML = ''; return; }
  const rows = mode === 'compact' ? compact.rows : mode === 'paged' ? ((pages[pg] && pages[pg].rows) || []) : results;
  list.innerHTML = rows.length
    ? rows.map(rowHtml).join('')
    : `<div class="song-empty">${mode === 'search' ? 'No songs found.' : 'No approved songs yet.'}</div>`;
  foot.className = 'songs-foot' + (mode === 'paged' ? ' between' : '');
  foot.innerHTML = footHtml();
}

/* ── ACTIONS ── */
async function seeMore() {
  if (busy || !compact.more) return;
  busy = true; renderSongs();
  try {
    // songs 5–10 (only songs that have earned)
    const r = await earnersPage(compact.cursor, PAGE_SIZE - compact.earnerRows.length);
    pages = [{ rows: compact.earnerRows.concat(r.rows), cursor: r.cursor == null ? compact.cursor : r.cursor, more: r.more }];
    pg = 0; mode = 'paged'; searchEnabled = r.more;
  } catch (e) { console.error(e); errorMsg = "Couldn't load more songs. Please refresh."; }
  busy = false; renderSongs();
}

async function goPage(i) {
  if (busy || i < 0) return;
  if (pages[i]) { pg = i; renderSongs(); return; }
  busy = true; renderSongs();
  try {
    const r = await earnersPage(pages[i - 1].cursor, PAGE_SIZE);
    if (r.rows.length) { pages[i] = { rows: r.rows, cursor: r.cursor, more: r.more }; pg = i; }
    else pages[i - 1].more = false;
  } catch (e) { console.error(e); errorMsg = "Couldn't load that page. Please refresh."; }
  busy = false; renderSongs();
}

/* Search by title across the user's own approved songs (earned or not).
   Fast path needs index: submissions → userId ↑, releaseTitle ↑ */
async function runSearch() {
  const q = $('songSearch').value.trim();
  if (!q) { mode = 'paged'; renderSongs(); return; }
  if (busy) return;
  busy = true; renderSongs();
  try {
    let list = null;
    if (!useMem && !searchMem) {
      try {
        const variants = [...new Set([q, q.toLowerCase(), q.toUpperCase(), q.replace(/\b\w/g, c => c.toUpperCase())])];
        const snaps = await Promise.all(variants.map(v => getDocs(query(subs(),
          where('userId', '==', uid), where('releaseTitle', '>=', v), where('releaseTitle', '<=', v + '\uf8ff'), limit(10)))));
        const found = new Map();
        snaps.forEach(sn => sn.docs.forEach(d => { if (isApproved(d.data())) found.set(d.id, toRow(d)); }));
        list = [...found.values()];
      } catch (e) {
        console.warn('Indexed search failed, using fallback. Create the index from this link:', e);
        searchMem = true;
      }
    }
    if (list === null) {
      const ql = q.toLowerCase();
      list = (await ensureMem()).filter(r => r.title.toLowerCase().includes(ql));
    }
    results = list.sort((a, b) => b.earned - a.earned);
    mode = 'search';
  } catch (e) { console.error(e); errorMsg = 'Search failed. Please try again.'; }
  busy = false; renderSongs();
}

$('songFoot').addEventListener('click', e => {
  const b = e.target.closest('button[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'more') seeMore();
  else if (a === 'next') goPage(pg + 1);
  else if (a === 'prev') goPage(pg - 1);
  else if (a === 'less') { mode = 'compact'; $('songSearch').value = ''; renderSongs(); }
  else if (a === 'clear') { $('songSearch').value = ''; mode = 'paged'; renderSongs(); }
});
$('songSearch').addEventListener('keydown', e => { if (e.key === 'Enter') runSearch(); });
$('songSearch').addEventListener('input', e => { if (!e.target.value && mode === 'search') { mode = 'paged'; renderSongs(); } });

currencySelect.addEventListener('change', e => { selectedCurrency = e.target.value; renderMoney(); });

/* ── WITHDRAW GUARD — eligibility is always checked in real USD ── */
const popup = $('withdrawPopup');
$('withdrawBtn').addEventListener('click', () => {
  if (userBalance < MIN_WITHDRAWAL) {
    $('popupThreshold').textContent = formatSelected(MIN_WITHDRAWAL);
    popup.classList.add('active');
  } else {
    window.location.href = 'withdrawal.html';
  }
});
$('closePopup').addEventListener('click', () => popup.classList.remove('active'));
popup.addEventListener('click', e => { if (e.target === popup) popup.classList.remove('active'); });

/* ── AUTH + INITIAL LOAD ── */
onAuthStateChanged(auth, async user => {
  if (!user) { window.location.href = 'login.html'; return; }
  uid = user.uid;
  try {
    const snap = await getDoc(doc(db, 'users', uid));
    userBalance = snap.exists() ? Number(snap.data().earnings) || 0 : 0;
  } catch (err) {
    console.error('Balance read failed:', err);
    userBalance = 0;
  }
  renderMoney();
  await loadSongs();
  loadStats();
});

renderMoney();
renderStats();
</script>
</body>
</html>
