<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Stores — 444Music</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --bg: #000000;
  --s1: #1c1c1e;
  --s2: #2c2c2e;
  --sep: rgba(84,84,88,0.55);
  --fill: rgba(120,120,128,0.24);
  --t1: #ffffff;
  --t2: rgba(235,235,245,0.60);
  --t3: rgba(235,235,245,0.30);
  --yellow: #fdeb0d;
  --ease: cubic-bezier(0.32, 0.72, 0, 1);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Helvetica Neue", Roboto, Arial, sans-serif;
}

html { color-scheme: dark; -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  font-family: var(--font); background: var(--bg); color: var(--t1);
  min-height: 100vh; letter-spacing: -0.01em; -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; color: inherit; background: none; border: none; cursor: pointer; }

.shell { max-width: 640px; margin: 0 auto; padding: 0 16px calc(130px + env(safe-area-inset-bottom)); }

/* top bar */
.bar {
  position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  height: 56px; margin: 0 -16px; padding: 0 16px;
  background: rgba(0,0,0,0.72);
  -webkit-backdrop-filter: saturate(180%) blur(24px); backdrop-filter: saturate(180%) blur(24px);
}
.back { width: 36px; height: 36px; border-radius: 50%; background: var(--fill); display: flex; align-items: center; justify-content: center; transition: transform .3s var(--ease); }
.back:active { transform: scale(0.92); }
.back svg { width: 16px; height: 16px; }
.bar-title { font-size: 17px; font-weight: 600; }
.bar-spacer { width: 36px; }

/* hero */
.hero { padding: 14px 4px 6px; }
.hero h1 { font-size: 34px; font-weight: 700; letter-spacing: -0.04em; line-height: 1.1; }
.hero p { font-size: 17px; line-height: 1.4; color: var(--t2); margin-top: 6px; }

/* search */
.search { position: relative; margin-top: 20px; }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--t2); pointer-events: none; }
#searchInput {
  width: 100%; height: 40px; padding: 0 14px 0 36px; border: 0; outline: 0; border-radius: 12px;
  background: var(--fill); color: var(--t1); font: inherit; font-size: 17px;
  appearance: none; -webkit-appearance: none;
}
#searchInput::placeholder { color: var(--t2); }

/* sections */
.sec { display: block; }
.sh { display: flex; align-items: baseline; justify-content: space-between; margin: 30px 16px 8px; }
.sh h2 { font-size: 13px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; color: var(--t2); }
.sh span { font-size: 13px; color: var(--t3); font-variant-numeric: tabular-nums; }
.group { background: var(--s1); border-radius: 16px; overflow: hidden; }

/* platform rows (locked: every store is selected) */
.platform { position: relative; display: flex; align-items: center; gap: 14px; min-height: 56px; padding: 8px 16px; cursor: default; user-select: none; }
.platform + .platform::before { content: ''; position: absolute; top: 0; left: 70px; right: 0; height: 0.5px; background: var(--sep); }
.platform-icon { width: 36px; height: 36px; border-radius: 9px; background: var(--s2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden; }
.platform-icon img { width: 56%; height: 56%; object-fit: contain; display: block; }
.platform-icon i { font-size: 16px; color: var(--t2); }
.pname { flex: 1; min-width: 0; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ptag { font-size: 13px; color: var(--t3); flex-shrink: 0; }
.tick { width: 22px; height: 22px; border-radius: 50%; background: var(--yellow); color: #000; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.tick svg { width: 12px; height: 12px; }

/* more stores row */
.more { display: flex; align-items: center; gap: 14px; padding: 16px; }
.more .platform-icon i { color: var(--yellow); }
.more strong { display: block; font-size: 17px; font-weight: 600; }
.more span { display: block; margin-top: 2px; font-size: 14px; line-height: 1.4; color: var(--t2); }

/* empty */
.empty-state { display: none; flex-direction: column; align-items: center; gap: 10px; padding: 70px 20px; color: var(--t2); font-size: 17px; }
.empty-state svg { width: 36px; height: 36px; opacity: 0.4; }
.empty-state.visible { display: flex; }

/* dock */
.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 200;
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  background: rgba(0,0,0,0.72); border-top: 0.5px solid var(--sep);
  -webkit-backdrop-filter: saturate(180%) blur(24px); backdrop-filter: saturate(180%) blur(24px);
}
.dock-in { max-width: 640px; margin: 0 auto; }
.dock-count { margin-bottom: 8px; text-align: center; font-size: 14px; color: var(--t2); }
.dock-count strong { color: var(--t1); font-weight: 600; font-variant-numeric: tabular-nums; }
.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 52px;
  border-radius: 999px; background: var(--yellow); color: #000; font-size: 17px; font-weight: 600;
  transition: transform .3s var(--ease);
}
.btn:active { transform: scale(0.98); }

@media (max-width: 420px) { .hero h1 { font-size: 30px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>

<body>
<div class="shell">

  <header class="bar">
    <button type="button" class="back" onclick="history.back()" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <span class="bar-title">Stores</span>
    <span class="bar-spacer"></span>
  </header>

  <div class="hero">
    <h1>Your stores</h1>
    <p>Your release goes to every platform below.</p>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="search" id="searchInput" placeholder="Search" autocomplete="off">
    </div>
  </div>

  <div id="sections"></div>

  <div class="sec" id="moreSec">
    <div class="sh"><h2>And more</h2></div>
    <div class="group">
      <div class="more">
        <div class="platform-icon"><i class="fa-solid fa-layer-group"></i></div>
        <div>
          <strong>+150 more stores</strong>
          <span>Your music also reaches every other store in our distribution network worldwide.</span>
        </div>
      </div>
    </div>
  </div>

  <div class="empty-state" id="emptyState">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <span>No results</span>
  </div>

  <div class="dock">
    <div class="dock-in">
      <div class="dock-count">All <strong id="countNum">0</strong> platforms selected</div>
      <button class="btn" type="button" onclick="continueNext()">Continue</button>
    </div>
  </div>

</div>

<script>
/* Each item: [data-name, simpleicons slug (or null), Font Awesome fallback, tag, display name] */
const SECTIONS = [
  { title: 'Streaming', items: [
    ['Spotify','spotify','fa-brands fa-spotify','Top'],
    ['Apple Music','applemusic','fa-brands fa-apple','Top'],
    ['YouTube Music','youtubemusic','fa-brands fa-youtube','Top'],
    ['Amazon Music','amazonmusic','fa-brands fa-amazon'],
    ['Tidal','tidal','fa-solid fa-water'],
    ['Deezer','deezer','fa-solid fa-circle-play'],
    ['Pandora','pandora','fa-solid fa-radio'],
    ['SoundCloud','soundcloud','fa-brands fa-soundcloud'],
    ['Napster','napster','fa-solid fa-music'],
    ['Qobuz',null,'fa-solid fa-compact-disc'],
    ['iHeart Radio','iheartradio','fa-solid fa-tower-broadcast'],
    ['Anghami',null,'fa-solid fa-globe']
  ]},
  { title: 'Social & video', items: [
    ['TikTok','tiktok','fa-brands fa-tiktok','Viral'],
    ['Instagram','instagram','fa-brands fa-instagram'],
    ['Facebook','facebook','fa-brands fa-facebook'],
    ['YouTube','youtube','fa-brands fa-youtube'],
    ['Snapchat','snapchat','fa-brands fa-snapchat'],
    ['Triller',null,'fa-solid fa-video']
  ]},
  { title: 'African platforms', items: [
    ['Boomplay',null,'fa-solid fa-music','Africa'],
    ['Audiomack','audiomack','fa-solid fa-headphones','Africa'],
    ['Mdundo',null,'fa-solid fa-compact-disc'],
    ['Aftown',null,'fa-solid fa-music'],
    ['Spinlet',null,'fa-solid fa-headphones-simple'],
    ['Iroking',null,'fa-solid fa-play','','iROKING']
  ]},
  { title: 'Radio, sync & more', items: [
    ['Shazam','shazam','fa-solid fa-magnifying-glass'],
    ['Beatport','beatport','fa-solid fa-record-vinyl'],
    ['Bandcamp','bandcamp','fa-brands fa-bandcamp'],
    ['7digital',null,'fa-solid fa-download'],
    ['Resso',null,'fa-solid fa-wave-square'],
    ['NetEase Music','neteasecloudmusic','fa-solid fa-cloud','','NetEase'],
    ['KKBox','kkbox','fa-solid fa-box'],
    ['Joox',null,'fa-solid fa-music'],
    ['Claro Música',null,'fa-solid fa-signal'],
    ['Fizy',null,'fa-solid fa-play'],
    ['Yandex Music','yandex','fa-solid fa-music'],
    ['Gaana',null,'fa-solid fa-music'],
    ['JioSaavn','jiosaavn','fa-solid fa-play'],
    ['Hungama',null,'fa-solid fa-headphones'],
    ['Nuuday',null,'fa-solid fa-tower-broadcast'],
    ['MediaNet',null,'fa-solid fa-network-wired']
  ]},
  { title: 'Global & regional', items: [
    ['AMI Entertainment',null,'fa-solid fa-headphones'],
    ['AWA',null,'fa-solid fa-music'],
    ['Gracenote',null,'fa-solid fa-database'],
    ['InProdicon',null,'fa-solid fa-icons'],
    ['LINE','line','fa-solid fa-comment'],
    ['MixCloud','mixcloud','fa-brands fa-mixcloud'],
    ['Music Aroma',null,'fa-solid fa-music'],
    ['Muud',null,'fa-solid fa-face-smile'],
    ['Peloton','peloton','fa-solid fa-person-biking'],
    ['Saavn','jiosaavn','fa-solid fa-play'],
    ['Sirius XM','siriusxm','fa-solid fa-satellite-dish'],
    ['SoundMouse',null,'fa-solid fa-computer-mouse'],
    ['Tencent','tencentqq','fa-solid fa-comment-dots'],
    ['iMusica',null,'fa-solid fa-signal'],
    ['KION',null,'fa-solid fa-film'],
    ['Zvuk',null,'fa-solid fa-volume-high'],
    ['VK Музыка','vk','fa-brands fa-vk'],
    ['ОК Музыка','odnoklassniki','fa-brands fa-odnoklassniki']
  ]}
];

const TICK = '<div class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>';

document.getElementById('sections').innerHTML = SECTIONS.map(sec => `
  <div class="sec">
    <div class="sh"><h2>${sec.title}</h2><span>${sec.items.length}</span></div>
    <div class="group">
      ${sec.items.map(([name, slug, fa, tag, label]) => `
        <div class="platform selected" data-name="${name}">
          <div class="platform-icon">${slug
            ? `<img src="https://cdn.simpleicons.org/${slug}/ffffff" alt="" data-fa="${fa}">`
            : `<i class="${fa}"></i>`}</div>
          <span class="pname">${label || name}</span>
          ${tag ? `<span class="ptag">${tag}</span>` : ''}
          ${TICK}
        </div>`).join('')}
    </div>
  </div>`).join('');

/* Icon fallback if a brand logo fails to load */
document.querySelectorAll('.platform-icon img').forEach(img => {
  img.addEventListener('error', () => {
    img.parentNode.innerHTML = `<i class="${img.dataset.fa}"></i>`;
  });
});

const searchInput = document.getElementById('searchInput');
const emptyState  = document.getElementById('emptyState');
const moreSec     = document.getElementById('moreSec');

/* All platforms are pre-selected and locked — no click-to-toggle. */
function updateCount() {
  document.getElementById('countNum').textContent = document.querySelectorAll('.platform').length;
}

searchInput.addEventListener('input', () => {
  const q = searchInput.value.toLowerCase().trim();
  let visible = 0;

  document.querySelectorAll('.platform').forEach(item => {
    const match = !q || item.dataset.name.toLowerCase().includes(q);
    item.style.display = match ? '' : 'none';
    if (match) visible++;
  });

  document.querySelectorAll('#sections .sec').forEach(sec => {
    const any = [...sec.querySelectorAll('.platform')].some(p => p.style.display !== 'none');
    sec.style.display = any ? '' : 'none';
  });

  moreSec.style.display = q ? 'none' : '';
  emptyState.classList.toggle('visible', visible === 0 && q.length > 0);
});

function continueNext() {
  const selected = [...document.querySelectorAll('.platform')].map(i => i.dataset.name);
  localStorage.setItem('selectedPlatforms', JSON.stringify(selected));
  window.location.href = 'confirm.html';
}

updateCount();
</script>
</body>
</html>
